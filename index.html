                    notFound: d => '系统找不到指定的路径。',
                    ghErr: e => '网络错误 (' + e + ')。',
                    progress: (i, n) => '  下载中 ' + i + '/' + n,
                    done: (n, mb, d) => '已加载 ' + n + ' 个文件 (' + mb + ' MB) → ' + d.toUpperCase() + '\\',
                    noExe: '命令或文件名错误。',
                    pick: '找到多个程序。请用 RUN 运行以下之一:',
                    multi: n => '找到 ' + n + ' 个 zip 文件。请选择要加载的文件:',
                    choose: (n, all) => '请输入编号 (1-' + n + (all ? ', A = 全部' : '') + ', Q = 取消): ',
                    badChoice: n => '选择无效。请输入 1 到 ' + n + ' 之间的编号 (Q = 取消)。',
                    cancelled: '已取消加载。',
                    selected: nm => '已选择: ' + nm,
                    multiFile: n => '有 ' + n + ' 个文件匹配。请选择要运行的文件:',
                    retry: (n, m) => '  失败 - 正在重试 (' + n + '/' + m + ')...',
                    missing: '服务器上不存在，已跳过',
                    cdRetry: d => '无法加载文件夹 ' + d.toUpperCase() + '。请重试: CD ' + d.toUpperCase()
                }
            };
            const lm = (k, ...a) => { const s = (LM[currentLang] && LM[currentLang][k]) || LM.en[k]; return typeof s === 'function' ? s(...a) : s; };
            const encPath = p => p.split('/').map(encodeURIComponent).join('/');
            const skipName = n => /(^|\/)(\.gitkeep|\.gitignore|\.DS_Store|Thumbs\.db)$/i.test(n) || /^__MACOSX\//.test(n);
            const isZip = n => /\.(zip|jsdos)$/i.test(n);
            // 커스텀 도메인/로컬에서 GitHub 자동 탐색을 쓰려면 'owner/repo' 를 적으세요 (github.io 에서는 비워도 됨)
            const GH_REPO = 'songsiwon001-a11y/WebDos1.09';
            const GH_BRANCHES = ['main', 'master', 'HEAD'];
            // 현재 주소(owner.github.io/<repo>/)에서 알아낸 저장소를 먼저, 그다음 GH_REPO 를 후보로 쓴다
            const ghRepos = () => {
                const r = [], segs = location.pathname.split('/').filter(Boolean);
                if (/\.github\.io$/i.test(location.hostname) && segs.length && (segs.length > 1 || !/\.html?$/i.test(segs[0]))) r.push(location.hostname.split('.')[0] + '/' + segs[0]);
                if (GH_REPO && !r.some(x => x.toLowerCase() === GH_REPO.toLowerCase())) r.push(GH_REPO);
                return r;
            };
            const MAX_TRY = 10;                                 // 폴더 탐색/다운로드 최대 시도 횟수
            let lastLoadCancelled = false;
            let ghBlock = 0;   // GitHub API 가 403/429(호출 한도)를 돌려준 뒤 이 시각까지는 API 를 부르지 않는다
            let loading = 0, ghErr = null, verbose = false;   // loading: 0 = 잠금 없음, 그 외 = 잠금을 건 시각(ms)
            const LOAD_LOCK_MS = 120000;                        // 이 시간이 지나면 멈춘 잠금으로 보고 무시
            // 자동 탐색에서 못 찾은 폴더: 같은 폴더를 연달아 cd 할 때만 잠깐(10초) 재검색을 막는다.
            // (예전에는 영구 차단이라, 네트워크가 한 번 느려서 실패하면 이후 cd 로는 다시 불러오지 못했다)
            const triedFolders = { m: new Map(), add(k) { this.m.set(k, Date.now()); }, delete(k) { this.m.delete(k); }, has(k) { const t = this.m.get(k); return !!t && Date.now() - t < 10000; } };
            const lockBusy = () => loading && Date.now() - loading < LOAD_LOCK_MS;
            const dbg = m => { if (verbose) out('  ' + m, 'yellow'); };
            const pageBase = () => {
                let pth = location.pathname;
                if (!pth.endsWith('/') && !/\.[a-z0-9]+$/i.test(pth.split('/').pop())) pth += '/';
                return location.origin + pth.replace(/[^\/]*$/, '');
            };
            const U = x => pageBase() + x;

            // ---- 네트워크 유틸 ----
            const fetchT = async (u, ms, opts) => {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), ms || 8000);
                try { return await fetch(u, Object.assign({ signal: ctl.signal }, opts || {})); }
                finally { clearTimeout(t); }
            };
            // 여러 비동기 탐색 중 '처음으로 성공(truthy)'한 결과를 반환 (모두 실패하면 null)
            const firstTruthy = ps => new Promise(res => {
                let n = ps.length;
                if (!n) return res(null);
                ps.forEach(p => Promise.resolve(p).then(v => { if (v) res(v); else if (--n === 0) res(null); }, () => { if (--n === 0) res(null); }));
            });
            let progCb = null;
            const readBody = async (r, name) => {
                if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
                const total = +r.headers.get('content-length') || 0;
                const rd = r.body.getReader(), chunks = [];
                let got = 0;
                for (;;) {
                    // 본문 수신이 20초 이상 멈추면 포기 (잠금이 영원히 남는 것 방지)
                    let tm;
                    const { done, value } = await Promise.race([
                        rd.read(),
                        new Promise((_, no) => { tm = setTimeout(() => no(new Error('download stalled: ' + name)), 20000); })
                    ]).catch(e => { try { rd.cancel(); } catch (_) {} throw e; }).finally(() => clearTimeout(tm));
                    if (done) break;
                    chunks.push(value); got += value.length;
                    if (progCb) progCb(name, got, total);
                }
                const buf = new Uint8Array(got);
                let o = 0;
                for (const c of chunks) { buf.set(c, o); o += c.length; }
                return buf;
            };

            const getter = (dir, rel) => async () => {
                const tries = [U(dir + '/' + encPath(rel))];
                for (const rp of ghRepos()) for (const b of GH_BRANCHES.filter(x => x !== 'HEAD')) {
                    tries.push('https://raw.githubusercontent.com/' + rp + '/' + b + '/' + encPath(dir + '/' + rel));
                    tries.push('https://cdn.jsdelivr.net/gh/' + rp + '@' + b + '/' + encPath(dir + '/' + rel));
                }
                let last = 0, n404 = 0, other = 0;
                for (const u of tries) {
                    try {
                        const r = await fetchT(u, 15000);
                        dbg('GET ' + u + ' → ' + r.status);
                        if (r.ok) return await readBody(r, rel);
                        last = r.status;
                        if (r.status === 404) n404++; else other++;
                    } catch (e) { dbg('GET ' + u + ' → ' + (e.message || e)); }
                }
                const err = new Error(rel + ' ' + last);
                err.missing = n404 > 0 && other === 0;   // 서버가 404(파일 없음)로만 답했으면 재시도해도 소용없다 → 건너뜀
                throw err;
            };

            // 폴더 최상위의 zip/jsdos 는 (병렬로) 풀어서 내용물로 교체 — zip 이름은 상관없음
            let skipped = [];
            async function expandZips(list) {
                const parts = await Promise.all(list.map(async it => {
                    if (!it.path.includes('/') && isZip(it.path)) {
                        let buf = null;
                        try {
                            buf = await it.get();   // zip 은 한 번만 받는다 (롬 zip 이면 이 데이터를 그대로 쓴다)
                            const z = await JSZip.loadAsync(buf);
                            const ents = Object.values(z.files).filter(e => !e.dir && !skipName(e.name));
                            // 실행 파일(exe/com/bat)·디스크 이미지·HTML/JS 가 없으면 아케이드 롬 이미지: 안의 파일을 꺼내지 않고 zip 자체를 그대로 보관
                            if (isRomZip(ents)) { dbg('ROM zip kept as-is: ' + it.path); return [{ path: it.path, get: async () => buf }]; }
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            dbg('unzip ' + it.path + ' (' + ents.length + ' files)');
                            return ents.map(e => ({ path: strip ? e.name.split('/').slice(1).join('/') : e.name, get: () => e.async('uint8array') }));
                        } catch (e) {
                            if (!buf && e && e.missing) { skipped.push(it.path); return []; }   // files.json 에는 있지만 실제로는 없는 파일
                            dbg('unzip failed: ' + it.path + ' ' + (e.message || e));
                            if (!buf) throw e;
                            return [{ path: it.path, get: async () => buf }];
                        }
                    }
                    return [it];
                }));
                return parts.flat();
            }

            // 1) <폴더>/files.json (있으면 사용)
            async function srcManifest(dir) {
                try {
                    const r = await fetchT(U(dir + '/files.json'), 10000, { cache: 'no-cache' });
                    dbg('GET ' + dir + '/files.json → ' + r.status);
                    if (!r.ok) return null;
                    const j = await r.json();
                    const arr = (Array.isArray(j) ? j : (j.files || [])).filter(x => typeof x === 'string' && !skipName(x));
                    return arr.length ? { dir, list: arr.map(x => ({ path: x, dir, get: getter(dir, x) })) } : null;
                } catch (e) { return null; }
            }

            // 2) 서버가 폴더 목록(디렉터리 인덱스)을 제공하는 경우 (로컬 서버 등)
            async function srcIndex(dir) {
                try {
                    const r = await fetchT(U(dir + '/'), 8000, { cache: 'no-cache' });
                    dbg('GET ' + dir + '/ → ' + r.status);
                    if (!r.ok) return null;
                    const html = await r.text();
                    const names = [...html.matchAll(/href="([^"?#]+)"/gi)].map(m => decodeURIComponent(m[1]))
                        .filter(h => !h.startsWith('/') && !h.startsWith('..') && !/^[a-z]+:/i.test(h) && !h.endsWith('/') && !skipName(h));
                    return names.length ? { dir, list: names.map(x => ({ path: x, dir, get: getter(dir, x) })) } : null;
                } catch (e) { return null; }
            }

            // GitHub 저장소 후보: 현재 주소(owner.github.io/<repo>/...) + GH_REPO
            const ghCands = () => {
                const c = [], h = location.hostname, segs = location.pathname.split('/').filter(Boolean);
                if (/\.github\.io$/i.test(h) && segs.length && (segs.length > 1 || !/\.html?$/i.test(segs[0]))) {
                    const rest = segs.slice(1);
                    if (rest.length && /\.[a-z0-9]+$/i.test(rest[rest.length - 1])) rest.pop();
                    c.push({ repo: h.split('.')[0] + '/' + segs[0], prefix: rest.length ? rest.join('/') + '/' : '' });
                }
                if (GH_REPO && !c.some(x => x.repo.toLowerCase() === GH_REPO.toLowerCase())) c.push({ repo: GH_REPO, prefix: '' });
                return c;
            };
            const pickFolder = (names, c, letter) => {
                const want = (c.prefix + letter + '/').toLowerCase();
                const hits = names.filter(x => x.toLowerCase().startsWith(want));
                dbg('folder match: ' + hits.length + ' file(s)');
                if (!hits.length) return null;
                const dir = hits[0].slice(c.prefix.length).split('/')[0];
                return { dir, list: hits.map(x => { const rel = x.slice(c.prefix.length + dir.length + 1); return { path: rel, dir, get: getter(dir, rel) }; }) };
            };

            // 3) GitHub API (트리 한 번에 조회, 브랜치/저장소 후보 병렬)
            async function srcGithub(letter) {
                const one = (c, ref) => (async () => {
                    if (Date.now() < ghBlock) return null;   // API 호출 한도에 걸린 동안에는 요청을 보내지 않는다 (한도를 더 쓰지 않게)
                    const r = await fetchT('https://api.github.com/repos/' + c.repo + '/git/trees/' + ref + '?recursive=1', 10000);
                    dbg('API ' + c.repo + '@' + ref + ' → ' + r.status);
                    if (r.status === 403 || r.status === 429) ghBlock = Date.now() + 600000;
                    if (!r.ok) { ghErr = r.status; return null; }
                    const j = await r.json();
                    const names = (j.tree || []).filter(t => t.type === 'blob' && !skipName(t.path)).map(t => t.path);
                    return pickFolder(names, c, letter);
                })();
                const cands = ghCands();
                const hit = await firstTruthy(cands.flatMap(c => ['main', 'master'].map(ref => one(c, ref))));
                return hit || firstTruthy(cands.map(c => one(c, 'HEAD')));
            }

            // 4) jsDelivr 파일 목록 (CDN 이라 API 제한 없음)
            async function srcJsd(letter) {
                const one = (c, b) => (async () => {
                    const r = await fetchT('https://data.jsdelivr.com/v1/packages/gh/' + c.repo + '@' + b + '?structure=flat', 10000);
                    dbg('LIST ' + c.repo + '@' + b + ' → ' + r.status);
                    if (!r.ok) return null;
                    const j = await r.json();
                    const names = (j.files || []).map(f => String(f.name || f).replace(/^\//, '')).filter(x => !skipName(x));
                    return pickFolder(names, c, letter);
                })();
                return firstTruthy(ghCands().flatMap(c => ['main', 'master'].map(b => one(c, b))));
            }

            // 3.5) GitHub contents API: 폴더를 직접 열어 안에 있는 zip 을 찾는다.
            //      files.json 이 없어도 되고, 브랜치 이름(main/master)이 필요 없으며, 폴더 이름의 대소문자도 구분하지 않는다.
            //      (git/trees 보다 응답이 작고, 결과를 캐시해서 API 호출 한도를 아낀다)
            const ghCache = {};
            async function ghContents(repo, path) {
                const k = repo + '/' + path;
                if (ghCache[k]) return ghCache[k];
                if (Date.now() < ghBlock) return null;
                const r = await fetchT('https://api.github.com/repos/' + repo + '/contents' + (path ? '/' + encPath(path) : ''), 10000);
                dbg('CONTENTS ' + repo + '/' + path + ' → ' + r.status);
                if (r.status === 403 || r.status === 429) ghBlock = Date.now() + 600000;
                if (!r.ok) { ghErr = r.status; return null; }
                return (ghCache[k] = await r.json());
            }
            async function srcContents(letter) {
                for (const c of ghCands()) {
                    try {
                        const root = await ghContents(c.repo, c.prefix.replace(/\/$/, ''));
                        if (!Array.isArray(root)) continue;
                        const f = root.find(x => x.type === 'dir' && x.name.toLowerCase() === letter.toLowerCase());
                        if (!f) continue;
                        const items = await ghContents(c.repo, c.prefix + f.name);
                        if (!Array.isArray(items)) continue;
                        // 폴더 이름은 저장소의 실제 이름(A, B ...)을 그대로 써서 GitHub Pages 의 대소문자 구분 문제를 피한다
                        const list = items.filter(x => x.type === 'file' && !skipName(x.name))
                            .map(x => ({ path: x.name, dir: f.name, get: getter(f.name, x.name) }));
                        if (list.length) return { dir: f.name, list };
                    } catch (e) { dbg('contents error: ' + (e.message || e)); }
                }
                return null;
            }

            // 목록(files.json 등)에 적혀 있지만 서버에 실제로 없는 파일인지 가볍게 확인 (HEAD). 확인이 안 되면(네트워크 오류 등) 있는 것으로 본다.
            async function probeExists(it) {
                if (!it.dir) return true;
                try {
                    const r = await fetchT(U(it.dir + '/' + encPath(it.path)), 8000, { method: 'HEAD', cache: 'no-cache' });
                    dbg('HEAD ' + it.dir + '/' + it.path + ' → ' + r.status);
                    return r.status !== 404;
                } catch (e) { return true; }
            }
            // 목록 없이 폴더에 실제로 있는 파일들을 찾는다 (디렉터리 인덱스 / GitHub / jsDelivr)
            // 탐색 결과가 '오래된 목록'이 아닌지 확인한다: 목록의 zip 몇 개를 HEAD 로 확인해서 하나도 없으면 그 결과는 버린다.
            // (jsDelivr 는 브랜치 목록을 오래 캐시해서, 파일을 옮긴 뒤에도 예전 위치(A/w3d.zip)를 알려줄 수 있다.
            //  이런 낡은 결과가 먼저 도착해 올바른 결과를 이기던 것이 "찾을 수 없음"의 원인이었다)
            const verified = p => Promise.resolve(p).then(async h => {
                if (!h || !h.list || !h.list.length) return null;
                const sample = h.list.filter(it => isZip(it.path) || /\.html?$/i.test(it.path)).slice(0, 3);
                if (!sample.length) return h;
                const ok = await Promise.all(sample.map(probeExists));
                if (!ok.some(Boolean)) { dbg('stale listing ignored (' + sample.map(s => s.dir + '/' + s.path).join(', ') + ')'); return null; }
                return h;
            }).catch(() => null);
            // 목록 없이 폴더에 실제로 있는 파일들을 찾는다 (디렉터리 인덱스 / GitHub / jsDelivr)
            function discoverAlt(L) {
                // GitHub API 는 비인증 시 시간당 60회 제한이라, contents 가 실패했을 때만 trees 를 쓴다 (호출 수 절약)
                const api = srcContents(L).then(r => r || srcGithub(L));
                const jobs = [api, srcIndex(L), srcIndex(L.toUpperCase()), srcJsd(L)].map(verified);
                return Promise.race([firstTruthy(jobs), new Promise(r => setTimeout(() => r(null), 15000))]);
            }
            // 모든 탐색 방법을 동시에 시작해서, '실제로 존재가 확인된' 첫 결과를 사용
            function discover(L) {
                const jobs = [];
                for (const d of [L, L.toUpperCase()]) { jobs.push(srcManifest(d)); jobs.push(srcIndex(d)); }
                // 폴더 안의 파일을 직접 찾는다 (files.json 불필요).
                // 예전에는 contents 와 trees(최대 6회)를 동시에 불러 API 한도(시간당 60회)를 금방 소진했고,
                // 한도에 걸리면 낡은 jsDelivr 목록만 남아 files.json 없는 폴더(HTML 폴더 E)만 로드가 실패했다.
                // 이제 contents 가 실패했을 때만 trees 로 넘어간다.
                jobs.push(srcContents(L).then(r => r || srcGithub(L)));
                jobs.push(srcJsd(L));
                return firstTruthy(jobs.map(verified));
            }

            // cd 로 a~z(c 제외) 폴더에 들어가면 아직 안 불러온 경우 자동으로 LOAD 실행
            async function autoLoad() {
                const L = cwd.length ? String(cwd[0]).toLowerCase() : '';
                if (!/^[abd-z]$/.test(L)) return;
                if (location.protocol === 'file:') return out(lm('local'), 'err');
                // 이미 불러온 폴더는 로딩 잠금과 상관없이 바로 통과
                const has = () => { for (const k of files.keys()) if (k.startsWith(L + '/')) return true; return false; };
                if (has()) return;
                // 직전에 실패한 폴더라도 cd 는 조용히 건너뛰지 않고 항상 다시 시도한다 (예전에는 이 때문에 LOAD 를 직접 쳐야 했다)
                triedFolders.delete(L);
                if (lockBusy()) {
                    out('  ...', 'yellow');
                    while (lockBusy()) await sleep(100);
                }
                if (has()) return;   // 기다리는 동안 로드됐을 수 있음
                return cmds.load([L]);
            }
            // 사용자의 번호 입력을 기다린다. (LOAD 가 명령 대기열 안에서 돌고 있으므로 Enter 입력을 대기열 대신 여기로 직접 전달)
            let choiceResolver = null;
            // 반환: 번호(0부터) / -1 = 전체(allowAll) / null = 취소
            // 숫자가 아닌 다른 명령을 입력하면 선택을 취소하고 그 명령을 그대로 실행한다 (입력이 삼켜지지 않게)
            function askChoice(n, allowAll) {
                return new Promise(res => {
                    const ask = () => {
                        $('pr').textContent = lm('choose', n, allowAll);
                        choiceResolver = v => {
                            const t = String(v).trim();
                            if (/^(q|quit|cancel|0)$/i.test(t)) { $('pr').textContent = ''; res(null); return true; }
                            if (allowAll && /^(a|all)$/i.test(t)) { $('pr').textContent = ''; res(-1); return true; }
                            const k = /^\d+$/.test(t) ? parseInt(t, 10) : 0;
                            if (k >= 1 && k <= n) { $('pr').textContent = ''; res(k - 1); return true; }
                            if (t && !/^\d+$/.test(t)) { $('pr').textContent = ''; res(null); return false; }   // 다른 명령 → 취소 후 일반 명령으로 처리
                            out(lm('badChoice', n), 'err');
                            ask();
                            return true;
                        };
                        I.focus();
                    };
                    ask();
                });
            }
            // ===== 게임 폴더 로컬 캐시 (브라우저 IndexedDB) =====
            // 한 번 내려받은 폴더(a~z)는 브라우저에 저장해 두고, 다음부터는 네트워크 없이 바로 불러온다. 강제로 다시 받으려면 LOAD 문자 -F.
            const gcDB = () => new Promise((ok, no) => { try { const r = indexedDB.open('webdos-games', 1); r.onupgradeneeded = () => r.result.createObjectStore('dir', { keyPath: 'L' }); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } });
            const gcReq = (mode, fn) => gcDB().then(db => new Promise((ok, no) => { const tx = db.transaction('dir', mode); const rq = fn(tx.objectStore('dir')); tx.oncomplete = () => { ok(rq && rq.result); db.close(); }; tx.onerror = tx.onabort = () => { no(tx.error); db.close(); }; }));
            const GC_MAX = 3;   // 로컬 캐시에 보관하는 폴더는 최대 3개 (넘으면 가장 오래 안 쓴 폴더부터 삭제)
            const gcUse = () => { try { return JSON.parse(loadSetting('gcuse') || '{}') || {}; } catch (e) { return {}; } };
            const gcTouch = L => { const u = gcUse(); u[L] = Date.now(); saveSetting('gcuse', JSON.stringify(u)); };
            async function gcGet(L) { try { const v = await gcReq('readonly', s => s.get(L)); const ok = v && Array.isArray(v.files) && v.files.length ? v : null; if (ok) gcTouch(L); return ok; } catch (e) { return null; } }
            async function gcTrim(keep) {
                let keys = [];
                try { keys = (await gcReq('readonly', s => s.getAllKeys())) || []; } catch (e) { return; }
                const u = gcUse();
                while (keys.length > GC_MAX) {
                    const cand = keys.filter(k => k !== keep).sort((x, y) => (u[x] || 0) - (u[y] || 0));
                    if (!cand.length) break;
                    const v = cand[0];
                    try { await gcReq('readwrite', s => s.delete(v)); } catch (e) { break; }
                    keys = keys.filter(k => k !== v); delete u[v];
                    out('  ' + (currentLang === 'kr' ? '캐시는 최대 ' + GC_MAX + '개까지 보관합니다. 가장 오래 쓰지 않은 ' + String(v).toUpperCase() + ': 캐시를 삭제했습니다.' : 'Cache keeps at most ' + GC_MAX + ' folders. Removed the least recently used: ' + String(v).toUpperCase() + ':'), 'yellow');
                }
                saveSetting('gcuse', JSON.stringify(u));
            }
            async function gcPut(L, fl) {
                try {
                    await gcReq('readwrite', s => s.put({ L, t: Date.now(), files: fl }));
                    gcTouch(L); await gcTrim(L);
                    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // 브라우저가 임의로 지우지 않도록 요청
                    return true;
                } catch (e) { dbg('cache save failed: ' + (e && e.message || e)); return false; }
            }
            cmds.emu = function (a) {
                return (async () => {
                    const kr = currentLang === 'kr';
                    const NAME = 'webdos-emu-v1';
                    if (!('caches' in window)) return out(kr ? '이 환경에서는 로컬 저장(Cache Storage)을 쓸 수 없습니다.' : 'Cache Storage is not available here.', 'err');
                    const sub = (a[0] || '').toLowerCase();
                    if (sub === 'clear' || sub === 'del' || sub === 'delete') {
                        try { for (const k of await caches.keys()) if (k.startsWith('webdos-emu-')) await caches.delete(k); } catch (e) { return out('Error: ' + (e && e.message || e), 'err'); }
                        return out(kr ? '에뮬레이터 캐시를 삭제했습니다. 다음 RUN 때 다시 받습니다.' : 'Emulator cache cleared. It will be downloaded again on the next RUN.', 'ok');
                    }
                    let reg = null; try { reg = await navigator.serviceWorker.getRegistration(); } catch (e) {}
                    out(kr ? '--- 에뮬레이터 로컬 저장 ---' : '--- Emulator local storage ---', 'cyan');
                    out('  ' + (kr ? '서비스 워커: ' : 'Service worker: ') + (reg ? (kr ? '등록됨' : 'registered') : (kr ? '등록 안 됨 (sw.js 를 HTML 과 같은 폴더에 두고 https 로 여세요)' : 'not registered (put sw.js next to this HTML and open it over https)')), reg ? 'ok' : 'yellow');
                    let n = 0, tot = 0;
                    try {
                        const c = await caches.open(NAME);
                        for (const rq of await c.keys()) { n++; try { const r = await c.match(rq); tot += (await r.clone().blob()).size; } catch (e) {} }
                    } catch (e) {}
                    out('  ' + (n ? n + (kr ? '개 파일  ' : ' file(s)  ') + (tot / 1048576).toFixed(1) + ' MB' : (kr ? '아직 저장된 에뮬레이터 파일이 없습니다. DOS 게임을 한 번 RUN 하면 저장됩니다.' : 'Nothing saved yet. RUN a DOS game once and it will be saved.')), n ? 'ok' : 'yellow');
                    out(kr ? '  EMU CLEAR  에뮬레이터 캐시 삭제' : '  EMU CLEAR  delete the emulator cache');
                })();
            };
            cmds.cache = function (a) {
                return (async () => {
                    const kr = currentLang === 'kr';
                    const sub = (a[0] || '').toLowerCase();
                    if (sub === 'clear' || sub === 'del' || sub === 'delete') {
                        const L = (a[1] || '').toLowerCase().replace(/[:\\\/]+$/, '');
                        try { await gcReq('readwrite', s => L ? s.delete(L) : s.clear()); } catch (e) { return out('Error: ' + (e && e.message || e), 'err'); }
                        return out(kr ? (L ? L.toUpperCase() + ' 폴더 캐시를 삭제했습니다.' : '모든 폴더 캐시를 삭제했습니다.') : (L ? 'Cache cleared for ' + L.toUpperCase() + '.' : 'All folder caches cleared.'), 'ok');
                    }
                    let all = [];
                    try { all = (await gcReq('readonly', s => s.getAll())) || []; } catch (e) {}
                    if (!all.length) out(kr ? '저장된 폴더 캐시가 없습니다. (CD 또는 LOAD 로 받은 폴더가 최대 3개까지 자동 저장됩니다)' : 'No cached folders yet. (Folders downloaded with CD or LOAD are saved automatically, up to 3.)', 'yellow');
                    else {
                        out(kr ? '--- 로컬에 저장된 폴더 ---' : '--- Locally cached folders ---', 'cyan');
                        let tot = 0;
                        for (const v of all.sort((x, y) => x.L < y.L ? -1 : 1)) {
                            const sz = v.files.reduce((n, f) => n + f[1].length, 0); tot += sz;
                            out('  ' + v.L.toUpperCase() + ':\\  ' + v.files.length + (kr ? '개 파일  ' : ' file(s)  ') + (sz / 1048576).toFixed(1) + ' MB  ' + new Date(v.t).toLocaleDateString(), 'ok');
                        }
                        out('  ' + (kr ? '합계 ' : 'Total ') + (tot / 1048576).toFixed(1) + ' MB');
                    }
                    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); out('  ' + (kr ? '브라우저 저장소: ' : 'Browser storage: ') + ((e.usage || 0) / 1048576).toFixed(0) + ' / ' + ((e.quota || 0) / 1048576).toFixed(0) + ' MB'); } } catch (e) {}
                    out(kr ? '  CACHE CLEAR [문자]  캐시 삭제   |   LOAD 문자 -F  서버에서 다시 받기' : '  CACHE CLEAR [letter]  delete cache   |   LOAD letter -F  re-download from server');
                })();
            };
            cmds.load = async function (a) {
                lastLoadCancelled = false;
                verbose = a.some(x => /^[-\/]v$/i.test(x));
                const force = a.some(x => /^[-\/]f$/i.test(x));
                let L = (a.find(x => !/^[-\/]/.test(x)) || '').replace(/[:\\\/]+$/, '').toLowerCase();
                if (!L && cwd.length && /^[a-z]$/i.test(cwd[0])) L = cwd[0].toLowerCase();
                if (!L || !/^[a-z]$/.test(L)) return out(lm('usage'), 'err');
                if (L === 'c') return out(lm('reserved'), 'err');
                if (location.protocol === 'file:') return out(lm('local'), 'err');
                while (lockBusy()) await sleep(100);
                if (!force) { for (const k of files.keys()) if (k.startsWith(L + '/')) return out(lm('already'), 'yellow'); }
                // 로컬 캐시에 있으면 네트워크를 쓰지 않고 바로 불러온다 (데이터 절약, 오프라인 가능)
                if (!force) {
                    const cached = await gcGet(L);
                    if (cached) {
                        for (const [pp, d] of cached.files) addFile(L + '/' + pp, d);
                        triedFolders.delete(L);
                        const mb = cached.files.reduce((n, f) => n + f[1].length, 0) / 1048576;
                        out('  ' + (currentLang === 'kr' ? L.toUpperCase() + ': 로컬 캐시에서 불러옴 (다운로드 없음, ' : L.toUpperCase() + ': loaded from local cache (no download, ') + mb.toFixed(1) + ' MB)', 'cyan');
                        out(cached.files.length + tr('uploadComplete'), 'ok');
                        out('');
                        out(tr('uploadedHeader'), 'cyan');
                        cached.files.forEach(f => out('  ' + (L + '/' + f[0]).replace(/\//g, '\\').toUpperCase(), 'ok'));
                        out('');
                        return;
                    }
                }
                let myLock = loading = Date.now(); ghErr = null;
                out('');
                let bar = O.lastChild;
                const st = t => { if (bar) bar.textContent = t; };
                const rm = () => { if (bar && bar.parentNode) bar.remove(); };
                try {
                    dbg('base: ' + pageBase());
                    st(lm('scan'));
                    // 실패하면 최대 3번까지 시도
                    let hit = null;
                    for (let t = 1; t <= MAX_TRY && !hit; t++) {
                        if (t > 1) { st(lm('retry', t, MAX_TRY)); await sleep(600 * (t - 1)); }
                        hit = await Promise.race([discover(L), new Promise(r => setTimeout(() => r(null), 25000))]);
                    }
                    if (hit) hit.list = hit.list.filter(it => /\.(zip|jsdos|html?)$/i.test(it.path));   // zip/jsdos 와 HTML 앱만 받는다 (json 등 기타 파일 제외)
                    // 목록에 있는데 서버에 없는 파일은 빼고, 폴더에 실제로 있는 다른 zip 을 찾아 대신 사용한다
                    if (hit && hit.list.length && hit.list.length <= 60) {
                        const okArr = await Promise.all(hit.list.map(probeExists));
                        const gone = hit.list.filter((_, i) => !okArr[i]);
                        if (gone.length) {
                            hit.list = hit.list.filter((_, i) => okArr[i]);
                            const alt = await discoverAlt(L);
                            if (alt) {
                                const have = new Set(hit.list.map(x => x.path.toLowerCase()));
                                const goneSet = new Set(gone.map(x => x.path.toLowerCase()));
                                for (const it of alt.list.filter(x => /\.(zip|jsdos|html?)$/i.test(x.path))) {
                                    const k = it.path.toLowerCase();
                                    if (!have.has(k) && !goneSet.has(k)) { hit.list.push(it); have.add(k); }
                                }
                            }
                        }
                    }
                    if (!hit || !hit.list.length) {
                        rm();
                        if (ghErr) out(lm('ghErr', ghErr), 'err');
                        else triedFolders.add(L);   // 네트워크 오류일 때는 막지 않고 다음 cd 에서 다시 시도
                        return out(lm('notFound', L), 'err');
                    }
                    // 최상위에 zip/jsdos 가 2개 이상이면 무엇을 불러올지 번호로 선택
                    // BIOS zip(neogeo.zip 등)은 선택 목록에서 빼고 항상 함께 불러온다 (게임만 고르면 BIOS 가 없어서 롬이 안 열린다)
                    const BIOS_RE = /^(neogeo|pgm|ym2608|cchip|nmk004|decocass|isgsm|konamigx|namcoc69|namcoc70|namcoc75|namcos22|skns|stvbios|taitofx1|taitotz|tps|midssio|cvs)\.zip$/i;
                    const zipItems = hit.list.filter(it => !it.path.includes('/') && isZip(it.path) && !BIOS_RE.test(it.path));
                    if (zipItems.length >= 2) {
                        rm();
                        out(lm('multi', zipItems.length), 'hi');
                        zipItems.forEach((it, i) => out('  ' + (i + 1) + '. ' + it.path, 'cyan'));
                        const keep = setInterval(() => { if (loading === myLock) myLock = loading = Date.now(); }, 30000);   // 기다리는 동안 잠금이 풀리지 않게 갱신
                        let pick;
                        try { pick = await askChoice(zipItems.length, true); } finally { clearInterval(keep); }
                        if (pick === null) { lastLoadCancelled = true; return out(lm('cancelled'), 'yellow'); }
                        if (pick === -1) { out(lm('selected', 'ALL (' + zipItems.length + ')'), 'ok'); }
                        else {
                            const chosen = zipItems[pick];
                            out(lm('selected', chosen.path), 'ok');
                            hit.list = hit.list.filter(it => it === chosen || !zipItems.includes(it));
                        }
                        myLock = loading = Date.now();
                        out('');
                        bar = O.lastChild;
                    }
                    st(lm('fetching'));
                    let list = null, fresh = null;
                    for (let t = 1; t <= MAX_TRY; t++) {
                        try {
                            progCb = (n, g, tt) => st('  ' + n + '  ' + (g / 1048576).toFixed(1) + (tt ? ' / ' + (tt / 1048576).toFixed(1) : '') + ' MB');
                            skipped = [];
                            list = await expandZips(hit.list);
                            progCb = null;
                            if (!list.length) break;
                            fresh = []; skipped = [];
                            const total = list.length;
                            let idx = 0, done = 0;
                            const worker = async () => {
                                while (idx < total) {
                                    const it = list[idx++];
                                    let data;
                                    try { data = await it.get(); }
                                    catch (e) { if (e && e.missing) { skipped.push(it.path); done++; continue; } throw e; }
                                    fresh.push([it.path, data]);
                                    done++;
                                    st(lm('progress', done, total));
                                }
                            };
                            await Promise.all(Array.from({ length: Math.min(6, total) }, worker));
                            break;
                        } catch (e) {
                            progCb = null; fresh = null;
                            if (t >= MAX_TRY) throw e;
                            st(lm('retry', t + 1, MAX_TRY));
                            await sleep(700 * t);
                        }
                    }
                    if (!list.length || !fresh || !fresh.length) {
                        rm();
                        triedFolders.add(L);
                        return out(lm('notFound', L), 'err');
                    }
                    list = fresh.map(f => ({ path: f[0] }));
                    const total = list.length;
                    for (const k of [...files.keys()]) if (k.startsWith(L + '/')) files.delete(k);
                    for (const [pp, d] of fresh) addFile(L + '/' + pp, d);
                    triedFolders.delete(L);
                    rm();
                    // 다음부터는 다운로드 없이 쓰도록 브라우저에 저장
                    if (await gcPut(L, fresh)) out('  ' + (currentLang === 'kr' ? '로컬에 저장했습니다 (다음부터 다운로드 없음)' : 'Saved to local cache (no re-download next time)'), 'yellow');

                    out(total + tr('uploadComplete'), 'ok');
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    list.forEach(it => out('  ' + (L + '/' + it.path).replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                } catch (e) {
                    rm();
                    out('Error: ' + (e && e.message || e), 'err');
                } finally { progCb = null; if (loading === myLock) loading = 0; }
            };
            // =================================================================================

            $('fz').onchange=e=>{ingest([...e.target.files]);e.target.value=''};
            $('fd').onchange=e=>{ingest([...e.target.files]);e.target.value=''};

            T.ondragover=e=>{e.preventDefault();T.classList.add('drag')};
            T.ondragleave=()=>T.classList.remove('drag');
            T.ondrop=async e=>{
                e.preventDefault(); T.classList.remove('drag');
                const all=[];
                const walk=async(en,path)=>{
                    if(en.isFile) await new Promise(r=>en.file(f=>{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});all.push(f);r()}));
                    else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const c of b)await walk(c,path+en.name+'\/')}while(b.length)}
                };
                for(const it of e.dataTransfer.items){
                    const en=it.webkitGetAsEntry?.();
                    if(en?.isDirectory) await walk(en,'');
                    else if(en) await new Promise(r=>en.file(f=>{all.push(f);r()}))
                }
                ingest(all);
            };

            // 명령은 입력창을 잠그지 않고 대기열(cmdChain)에 넣어 순서대로 실행한다.
            // (예전에는 CD/LOAD 가 끝날 때까지 입력창을 disabled 로 잠가서, 느린 기기에서 그 사이에 친 RUN 등이 사라졌다.)
            let cmdChain=Promise.resolve();
            // RUN 없이 파일명만 입력했을 때, 실행할 수 있는 파일(exe/com/bat/디스크 이미지/html)이 있는지 확인
            // 실행 가능한 파일 중 이름(경로를 적었으면 경로)에 입력한 글자가 포함된 것들
            function partialCands(arg){
                const q=String(arg).replace(/^["']|["']$/g,'').trim().toLowerCase().replace(/\\/g,'/');
                if(!/[a-z0-9\u00a1-\uffff]/i.test(q)) return [];
                const hasPath=q.includes('/');
                return [...files.values()].filter(v=>(/\.(exe|com|bat|zip|html?)$/i.test(v.p)||IMG_RE.test(v.p)) && (hasPath?v.p.toLowerCase():base(v.p).toLowerCase()).includes(q));
            }
            // 후보가 여러 개면 번호로 고르게 한다 (취소하면 null)
            async function chooseFile(cands){
                const list=[...cands].sort((x,y)=>x.p.toLowerCase()<y.p.toLowerCase()?-1:1);
                out(lm('multiFile', list.length), 'hi');
                list.forEach((v,i)=>out('  '+(i+1)+'. '+v.p.replace(/\//g,'\\'), 'cyan'));
                const k=await askChoice(list.length);
                if(k===null){ out(lm('cancelled'), 'yellow'); return null; }
                out(lm('selected', list[k].p.replace(/\//g,'\\')), 'ok');
                return list[k];
            }
            function runnableExists(arg){
                arg=String(arg).replace(/^["']|["']$/g,'').trim();
                if(!arg) return false;
                const hasExt=/\.[a-z0-9]{1,4}$/i.test(arg);
                const exts=hasExt?['']:['.exe','.com','.bat','.zip','.img','.ima','.vfd','.dsk','.flp','.iso','.cue'];
                const p=resolve(arg);
                for(const e of exts){ if(files.get(lc(p)+e)) return true; }
                const nm=arg.split(/[\\/]/).pop().toLowerCase();
                if([...files.values()].some(v=>exts.some(e=>base(v.p).toLowerCase()===nm+e))) return true;
                const nm2=nm.replace(/\.(exe|com|bat)$/i,'');
                if([...files.values()].some(v=>/\.html?$/i.test(v.p) && base(v.p).toLowerCase().replace(/\.html?$/i,'')===nm2)) return true;
                return partialCands(arg).length>0;
            }
            async function execLine(l){
                try{
                    let [c,...a]=l.split(/\s+/);
                    // DOS 처럼 공백 없이 붙여 쓴 cd 도 허용: cd.. / cd\ / cd/ / cd.
                    const cm=/^(cd|chdir)([\\\/.].*)$/i.exec(l);
                    if(cm && !runnableExists(c)){ c=cm[1]; a=[cm[2].trim()]; }
                    // d:\폴더 / d:폴더 처럼 드라이브 문자가 붙은 경로만 입력하면 해당 폴더로 이동
                    else if(/^[a-z]:[^\s]+$/i.test(c) && !a.length && !runnableExists(c)){ a=[c]; c='cd'; }
                    if(/^[a-z]:$/i.test(c) && !a.length){
                        const r=cmds.cd([c[0].toLowerCase()==='c' ? 'c:' : '\\'+c[0]]);
                        if(r&&typeof r.then==='function') await r;
                    } else {
                        const fn=Object.prototype.hasOwnProperty.call(cmds,c.toLowerCase()) ? cmds[c.toLowerCase()] : null;
                        if(fn){
                            const r=fn(a);
                            if(r&&typeof r.then==='function') await r;
                        } else if(runnableExists(c)){
                            // 내부 명령이 아니고 실행 가능한 파일이 있으면 RUN 없이 파일명만으로 실행
                            const r=cmds.run([c,...a]);
                            if(r&&typeof r.then==='function') await r;
                        } else out("'"+c+"'"+tr('notCommand'),'err');
                    }
                }catch(e){ out('Error: '+(e&&e.message||e),'err'); }
                prompt(); T.scrollTop=T.scrollHeight;
                saveSetting('cwd', cwd.join('/'));   // 마지막 위치 기억
                vfSave();                              // 파일/폴더가 바뀌었으면 브라우저에 저장
            }
            I.onkeydown=e=>{
                if(e.key==='Enter'){
                    const l=I.value.trim();
                    out($('pr').textContent+I.value);
                    I.value='';
                    if(choiceResolver){ const r=choiceResolver; choiceResolver=null; if(r(l)) return; }
                    if(l){
                        hist.push(l); hi=hist.length;
                        cmdChain=cmdChain.then(()=>execLine(l));
                    } else { prompt(); T.scrollTop=T.scrollHeight; }
                }else if(e.key==='ArrowUp'){
                    if(hi>0) I.value=hist[--hi];
                    e.preventDefault();
                }else if(e.key==='ArrowDown'){
                    I.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'');
                }else if(e.key==='Tab'){
                    e.preventDefault();
                    const val = I.value.trim().toLowerCase();
                    const cmdNames = Object.keys(cmds);
                    const match = cmdNames.find(c => c.startsWith(val));
                    if(match) I.value = match.toUpperCase() + ' ';
                }
            };

            window.addEventListener('keydown', async e => {
                if($('editor').style.display === 'flex') {
                    if(e.key === 'Escape') {
                        $('editor').style.display = 'none';
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    } else if((e.ctrlKey || e.metaKey) && e.key === 's') {
                        const content = new TextEncoder().encode($('editor-textarea').value);
                        files.set(editingFile.key, { p: editingFile.path, d: content });
                        vfDirty = true; setTimeout(vfSave, 0);
                        $('editor').style.display = 'none';
                        out(tr('editorSaved') + editingFile.path, 'ok');
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    }
                } else if(manualExit && e.key==='End' && $('game').style.display==='block') {
                    e.preventDefault(); e.stopPropagation();
                    await stopGame();
                }
            }, true);

            window.addEventListener('error', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.message || 'Script warning'), 'err');
                }
            });

            window.addEventListener('unhandledrejection', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.reason && e.reason.message || e.reason), 'err');
                }
            });

            ensureDos().catch(()=>{});
            T.onclick=()=>{if(!getSelection().toString() && $('editor').style.display !== 'flex')I.focus()};

            (async () => {
                // 언어 조회(외부 IP)나 IndexedDB 복원이 멈춰도 시작 화면이 비지 않도록 시간 제한을 둔다
                const limit = (p, ms, v) => Promise.race([Promise.resolve(p).catch(() => v), new Promise(r => setTimeout(() => r(v), ms))]);
                await limit(langReady, 4000, null);
                const sc = loadSetting('color');
                if (sc) T.style.color = sc;
                const restored = await limit(vfRestore(), 3000, 0);   // 저장된 가상 디스크/마지막 위치 복원
                updateUIForLanguage();
                mtReady.then(() => { if (mtSet() && tune.midi === 'default') mtAutoEnable(); });   // 이전에 ROM 을 올린 사용자도 MT-32 사용
                out(tr('intro1'),'hi');
                out(tr('intro2'));
                if (restored) out(bl('Restored ' + restored + ' saved file(s) from this browser. (VFS to manage)', '이전에 저장한 파일 ' + restored + '개를 복원했습니다. (관리: VFS)'), 'cyan');
                out('');
                prompt();
                // AUTORUN: 저장된 명령을 쉼표 단위로 잘라, 사용자가 직접 친 것처럼 순서대로 실행
                const ar = loadSetting('autorun');
                if (ar) {
                    for (const c of ar.split(/,(?!\s)/).map(s => s.trim()).filter(Boolean)) {
                        if (/^autorun(\s|$)/i.test(c)) continue;   // 자기 자신 재귀 방지
                        hist.push(c); hi = hist.length;
                        cmdChain = cmdChain.then(() => { out($('pr').textContent + c); return execLine(c); });
                    }
                }
            })();
        })();
    </script>
