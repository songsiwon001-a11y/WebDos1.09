    <title>WEB-DOS [Version 1.09]</title>
    <meta name="description" content="MS-DOS를 JS를 이용해 웹상에 구현한 프로젝트입니다." />
    <link rel="icon" href="image.png">
    <meta name="google-site-verification" content="xjENZEcS7wwhbRYeovTgvsJRhXLjyZ6HD1A89KB16A0" />
    <!-- EmulatorJS(DOSBox Pure)는 스레드가 필요 → SharedArrayBuffer → 교차 출처 격리(COOP/COEP) 필요.
         정적 호스팅은 헤더를 못 바꾸므로 같은 폴더의 coi-serviceworker.js 가 대신 헤더를 붙인다(처음 한 번 자동 새로고침). -->
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.js"></script>
    <style>
        html, body { height: 100%; margin: 0; background: #000; }
        #t { height: 100%; overflow-y: auto; padding: 10px 14px; box-sizing: border-box; color: #aaa; font: 16px/1.3 "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; white-space: pre-wrap; word-break: break-all; }
        #t.drag { outline: 3px dashed #5f5; outline-offset: -6px; }
        #row { display: flex; }
        #in { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; caret-color: #fff; padding: 0; }
        .err { color: #f66; }
        .ok { color: #5f5; }
        .hi { color: #fff; }
        .cyan { color: #5ff; }
        .yellow { color: #ff5; }
        #game { display: none; position: fixed; inset: 0; background: #000; z-index: 9; }
        #dos { position: absolute; inset: 0; }
        #off { display: none; position: fixed; inset: 0; background: #000; z-index: 30; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #f90; font: 20px/1.6 "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; cursor: pointer; }
        #off-note { color: #777; font-size: 14px; margin-top: 18px; max-width: 80%; }
        #splash { display: none; position: fixed; inset: 0; z-index: 35; background: #738c9c; align-items: center; justify-content: center; }
        #splash img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
        #sw { display: none; position: absolute; top: 8px; right: 150px; z-index: 10; background: #05a; color: #fff; border: 0; padding: 6px 12px; font: 14px monospace; cursor: pointer; opacity: .85; }
        #x { display: none; position: absolute; top: 8px; right: 8px; z-index: 10; background: #a00; color: #fff; border: 0; padding: 6px 12px; font: 14px monospace; cursor: pointer; opacity: .85; }
        /* 모바일 터치 컨트롤 (키보드 이벤트로 변환) */
        #pad { display: none; position: absolute; inset: 0; z-index: 11; pointer-events: none; }
        #pad, #pad * { -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
        #stick { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; }
        #knob { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.5); }
        #btns { position: absolute; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, 62px); gap: 10px; pointer-events: none; }
        .pb { height: 58px; border-radius: 14px; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4); color: #fff; font: bold 14px monospace; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .pb.on { background: rgba(85,255,85,.55); }
        #kb { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
        #padtg { display: none; position: absolute; top: 8px; left: 8px; z-index: 12; background: #333; color: #fff; border: 0; padding: 6px 12px; font: 14px monospace; cursor: pointer; opacity: .85; }
        /* Editor Overlay Styles */
        #editor { display: none; position: fixed; inset: 20px; background: #000; border: 2px solid #5f5; z-index: 8; padding: 10px; flex-direction: column; box-sizing: border-box; }
        #editor-header { color: #5f5; font: bold 16px monospace; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #editor-textarea { flex: 1; background: #111; color: #fff; border: 1px solid #333; font: 15px monospace; padding: 8px; resize: none; outline: none; }
        #editor-footer { color: #777; font-size: 13px; margin-top: 5px; display: flex; justify-content: space-between; }
    </style>
</head>

    <input type="file" id="fz" multiple accept=".zip,.jsdos,*" hidden>
    <input type="file" id="fd" webkitdirectory directory multiple hidden>

                const T={

                // 재생 속도가 어긋나 음정이 올라간다. 그래서 rate 는 실제 AudioContext 값에 맞추고(매번 새로 측정),

                run(a){
                    if(a.length>1){
                        const ex=a.map(t=>files.get(lc(resolve(t.replace(/^["']|["']$/g,'')))));
                        if(ex.every(Boolean) && ex.every(f=>IMG_RE.test(f.p))){
                            return launch(ex[0].p, ex.map(f=>f.p));
                        }
                    }
                    const arg=a.join(' ').replace(/^["']|["']$/g,'').trim();
                    if(!arg) return out(tr('runUsage'), 'err');
                    const hasExt=/\.[a-z0-9]{1,4}$/i.test(arg), exts=hasExt?['']:['.exe','.com','.bat','.img','.ima','.vfd','.dsk','.flp','.iso','.cue'];
                    let f=null; const p=resolve(arg);
                    for(const e of exts){ f=files.get(lc(p)+e); if(f) break; }
                    if(!f){
                        const nm=arg.split(/[\\/]/).pop().toLowerCase();
                        const hits=[...files.values()].filter(v=>exts.some(e=>base(v.p).toLowerCase()===nm+e));
                        const cur=lc(cwd), near=hits.filter(v=>par(v.p.toLowerCase()).startsWith(cur));
                        const pick=near.length?near:hits;
                        if(pick.length>1){ out(tr('multiFileMatch'), 'err'); pick.forEach(v=>out('  RUN '+v.p.replace(/\//g,'\\'))); return; }
                        f=pick[0];
                    }
                    // HTML 앱을 EXE 인 척 실행: RUN typing.exe → typing.html (진짜 .exe 가 없을 때만)
                    if(!f){
                        const nm2=arg.split(/[\\/]/).pop().toLowerCase().replace(/\.(exe|com|bat)$/i,'');
                        const hh=[...files.values()].filter(v=>/\.html?$/i.test(v.p) && base(v.p).toLowerCase().replace(/\.html?$/i,'')===nm2);
                        const cur2=lc(cwd), near2=hh.filter(v=>par(v.p.toLowerCase()).startsWith(cur2));
                        const pick2=near2.length?near2:hh;
                        if(pick2.length>1){ out(tr('multiFileMatch'), 'err'); pick2.forEach(v=>out('  RUN '+v.p.replace(/\//g,'\\'))); return; }
                        if(pick2.length===1) return launchHtml(pick2[0].p);
                    }
                    if(!f) return out(arg.toUpperCase()+': '+tr('fileNotFoundErr'), 'err');
                    if(/\.html?$/i.test(f.p)) return launchHtml(f.p);
                    if(!/\.(exe|com|bat)$/i.test(f.p) && !IMG_RE.test(f.p)) return out(tr('invFormat'), 'err');
                    launch(f.p, diskSet(f.p));
                }
            };

            cmds.tune=function(a){
                const show=()=>{
                    try{ const c=JSON.parse(loadSetting('calib')||'null'); if(c){ const e=effective(c);
                        out('DEVICE tier='+c.tier+' score='+c.score+' ('+c.mops+' Mops, cores='+c.cores+(c.mobile?', mobile':'')+', audio='+c.nativeRate+'Hz)','yellow');
                        out('USING  cpu='+e.cpu+'  cycles='+e.cycles+'  rate='+e.rate+'  block='+e.block+'  pre='+e.pre,'ok'); } }catch(e){}
                    out('TUNE  cpu='+tune.cpu+'  cycles='+tune.cycles+'  rate='+tune.rate+'  block='+tune.block+'  pre='+tune.pre+'  worker='+tune.worker+'  midi='+tune.midi+'  sb='+tune.sb+'  opl='+tune.opl+'  oplemu='+tune.oplemu+'  core='+tune.core+'  plain='+tune.plain,'cyan');
                };
                if(!a.length){
                    show();
                    out('TUNE cpu=auto|386|486|pentium|pentium_slow  cycles=auto|max|20000|fixed_20000','hi');
                    out('TUNE rate=11025|22050|44100|48000  block=1024|2048|4096  pre=10..500  worker=on|off','hi');
                    out('TUNE plain=on   (DOSBox defaults only: no cpu/mixer/sound overrides - closest to dos.zone)','hi');
                    out('TUNE midi=default|none  sb=sb16|sbpro2|sb1|none  opl=auto|opl2|opl3|none  oplemu=default|compat|fast|mame|nuked  core=auto|normal|dynamic|simple','hi');
                    out('TUNE CALIBRATE (re-measure this device)   TUNE RESET (back to auto)   [applies on next RUN]','hi');
                    return;
                }
                if(/^calibrate$/i.test(a[0])){
                    return calibrate(true).then(()=>{ out('Calibrated.','ok'); show(); });
                }
                if(/^reset$/i.test(a[0])){ Object.assign(tune,TUNE_DEF); saveSetting('tune',''); show(); return; }
                const ok={
                    cpu:v=>/^(auto|386|486|pentium|pentium_slow|pentium_mmx)$/i.test(v),
                    cycles:v=>/^(auto|max|\d+|fixed_\d+|auto_\d+(_limit_\d+)?)$/i.test(v),
                    rate:v=>v==='auto'||['8000','11025','16000','22050','32000','44100','48000'].includes(v),
                    block:v=>v==='auto'||['256','512','1024','2048','4096','8192'].includes(v),
                    pre:v=>v==='auto'||(/^\d{1,3}$/.test(v)&&+v>=10&&+v<=500),
                    worker:v=>/^(on|off)$/i.test(v),
                    midi:v=>/^(default|none)$/i.test(v),
                    sb:v=>/^(sb16|sbpro2|sbpro1|sb2|sb1|none)$/i.test(v),
                    opl:v=>/^(auto|opl2|dualopl2|opl3|none)$/i.test(v),
                    oplemu:v=>/^(default|compat|fast|mame|nuked)$/i.test(v),
                    core:v=>/^(auto|normal|dynamic|simple)$/i.test(v),
                    plain:v=>/^(on|off)$/i.test(v)
                };
                for(const t of a){
                    const m=/^(\w+)=(\S+)$/.exec(t);
                    if(!m||!ok[m[1].toLowerCase()]||!ok[m[1].toLowerCase()](m[2])) return out('Invalid: '+t,'err');
                    tune[m[1].toLowerCase()]=m[2].toLowerCase();
                }
                saveSetting('tune',JSON.stringify(tune));
                show();

            let launchSeq=0;
            // EXE/COM/BAT 게임은 종료를 자동 감지하므로 END 키/종료 버튼을 쓰지 않는다.
            // (자동 감지가 불가능한 HTML 앱과 디스크 이미지만 수동 종료 사용)
            let manualExit=true;
            function showSplash(){ try{ const im=$('splash-img'); if(!im.src) im.src=SPLASH_SRC; $('splash').style.display='flex'; }catch(e){} return Date.now(); }
            // 게임 중에는 터미널 입력창(#in)에 포커스가 남아 모바일 키보드가 튀어나오므로, 실행 시 포커스를 빼고 키보드 표시를 막는다
            function blurTerminal(){ try{ I.setAttribute('inputmode','none'); I.blur(); const a=document.activeElement; if(a && a!==document.body && a.blur) a.blur(); }catch(e){} }
            function hideSplash(){ try{ $('splash').style.display='none'; }catch(e){} }
            const waitSplash=t0=>sleep(Math.max(0,SPLASH_MS-(Date.now()-t0)));

            let shutTimer=null, offAt=0;
            function powerOff(restart){
                try{ stopGame(); }catch(e){}
                $('off-msg').textContent = restart ? tx('restarting') : tx('shutSafe');
                $('off-note').textContent = restart ? '' : tx('shutNote');
                $('off').style.display='flex';
                offAt=Date.now();
                if(restart){ setTimeout(()=>location.reload(), 1200); return; }
                // 브라우저는 OS 전원을 끌 수 없으므로, 허용되는 경우에 한해 탭만 닫는다
                setTimeout(()=>{ try{ window.open('','_self'); window.close(); }catch(e){} }, 800);

                        w.addEventListener('keydown',remapKey,true); w.addEventListener('keyup',remapKey,true);
                        w.addEventListener('keydown',ev=>{ if(manualExit&&ev.key==='End'&&$('game').style.display==='block'){ ev.preventDefault(); stopGame(); } },true);
                        w.addEventListener('keydown',ev=>{ if(diskCount>1 && ev.isTrusted && ev.ctrlKey && (ev.key==='F4'||ev.key===']')){ ev.preventDefault(); ev.stopImmediatePropagation(); swapDisk(); } },true);
                        w.focus();
                    }catch(e){} };
                    fr.srcdoc=html;
                    host.appendChild(fr);
                    hideSplash(); blurTerminal(); showPad();
                    player={stop:async()=>{ try{ fr.remove(); }catch(e){} }};
                    if(exitWatch) watchGameExit(fr);
                    $('sw').style.display=diskCount>1?'block':'none'; updateSwapLabel();
                }catch(e){hideSplash();$('game').style.display='none';out('Error: '+(e&&e.message||e),'err')}
            }

            // 게임이 스스로 종료되면(신호 화면이 계속 보이면) END 와 똑같이 WEB-DOS 로 돌아온다.
            function watchGameExit(fr){
                const c2=document.createElement('canvas'); c2.width=c2.height=16;
                const x=c2.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=false;
                let hits=0;
                const id=setInterval(()=>{
                    if(gameFrame!==fr || $('game').style.display!=='block'){ clearInterval(id); return; }
                    try{
                        const cv=fr.contentDocument && fr.contentDocument.querySelector('canvas');
                        if(!cv || !cv.width || !cv.height) return;
                        x.drawImage(cv,0,0,16,16);
                        const d=x.getImageData(0,0,16,16).data; let m=0;
                        for(let i=0;i<d.length;i+=4) if(d[i]>235 && d[i+1]<20 && d[i+2]>235) m++;
                        hits = (m>=90) ? hits+1 : 0;          // 256칸 중 35% 이상이 마젠타
                        if(hits>=2){ clearInterval(id); stopGame(); }
                    }catch(e){}
                },100);
            }
            const dbg2=m=>out('  '+m,'yellow');
            let stopping=false;
            async function stopGame(){
                if(stopping || $('game').style.display!=='block') return;
                stopping=true; launchSeq++; hideSplash(); hidePad();
                try{
                    try{ if(player && typeof player.stop === 'function') await player.stop(); }catch(e){}
                    closeAudio();
                    $('dos').innerHTML=''; player=null; curCI=null; gameFrame=null; padRemap=null; kbRemap=null; $('game').style.display='none'; $('sw').style.display='none'; diskCount=0; diskIdx=1;
                    out(tr('gameClosed')); I.removeAttribute('inputmode'); I.focus();
                }finally{ stopping=false; }
            }
            $('x').onclick=stopGame;

            // 분할 디스크 교체 (DOSBox 단축키 Ctrl+F4 를 대신 눌러줌: 브라우저가 Ctrl+F4 를 가로채는 경우 대비)
            function sendKeyToGame(key, code, kc, mods){
                const d=gameDoc(); if(!d) return false;
                const win=d.defaultView;
                const target=d.querySelector('canvas')||d.body;
                for(const type of ['keydown','keyup']){
                    const ev=new win.KeyboardEvent(type,Object.assign({key,code,bubbles:true,cancelable:true},mods||{}));
                    for(const k of ['keyCode','which']) Object.defineProperty(ev,k,{get:()=>kc});
                    target.dispatchEvent(ev);
                    try{ d.dispatchEvent(ev.constructor===win.KeyboardEvent?new win.KeyboardEvent(type,Object.assign({key,code,bubbles:true},mods||{})):ev); }catch(e){}
                }
                return true;
            }
            // 에뮬레이터가 디스크 교체 API 를 노출하면 그것을 먼저 쓰고, 없으면 Ctrl+F4 로 대체
            async function swapDisk(){
                if(diskCount<2 || $('game').style.display!=='block') return;
                const next=diskIdx>=diskCount?1:diskIdx+1;
                let done=false;
                try{
                    const w=gameFrame && gameFrame.contentWindow;
                    const em=w && w.EJS_emulator;
                    const fn=em && em.gameManager && em.gameManager.functions;
                    if(fn){
                        for(const name of ['setDiskIndex','setCurrentDisk','swapDisk','changeDisk']){
                            if(typeof fn[name]==='function'){ fn[name](next-1); done=true; break; }
                        }
                    }
                }catch(e){}
                if(!done){
                    // DOSBox 의 디스크 교체 단축키
                    sendKeyToGame('F4','F4',115,{ctrlKey:true});
                }
                diskIdx=next;
                updateSwapLabel();
                out('  Disk '+diskIdx+'/'+diskCount,'cyan');
                try{ gameFrame.contentWindow.focus(); }catch(e){}
            }
            $('sw').onmousedown=e=>e.preventDefault();
            $('sw').onclick=swapDisk;
            // 게임 실행 중 Ctrl+F4 / Ctrl+] 로도 교체 (브라우저가 Ctrl+F4 로 탭을 닫으려 하므로 가로챔)
            window.addEventListener('keydown',e=>{
                if(diskCount>1 && $('game').style.display==='block' && e.ctrlKey && (e.key==='F4'||e.key===']')){
                    e.preventDefault(); e.stopPropagation(); swapDisk();
                }
            },true);

            async function ingest(list){
                let n = 0; 
                const cp = cwd.join('/'), pre = cp ? cp + '/' : '';
                
                const preparedItems = [];
                for (const f of list) {
                    if (/\.(zip|jsdos)$/i.test(f.name) && !f.webkitRelativePath) {
                        preparedItems.push({ type: 'archive', file: f });
                    } else {
                        const relPath = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
                        preparedItems.push({ type: 'file', file: f, path: relPath });
                    }
                }

                const filePaths = preparedItems.filter(i => i.type === 'file').map(i => i.path);
                const firstSlashIndexes = filePaths.map(p => p.indexOf('/'));
                const hasSubfolders = filePaths.length > 0 && firstSlashIndexes.every(idx => idx > 0);
                
                let rootFolderToStrip = null;
                if (hasSubfolders) {
                    const topFolders = new Set(filePaths.map(p => p.split('/')[0]));
                    if (topFolders.size === 1) {
                        rootFolderToStrip = [...topFolders][0];
                    }
                }

                if (rootFolderToStrip) {
                }

                const uploadedNames = [];

                for (const item of preparedItems) {
                    if (item.type === 'archive') {
                        const f = item.file;
                        const root = f.name.replace(/\.[^.]+$/,'');
                        try {
                            const z = await JSZip.loadAsync(f);
                            const ents = Object.values(z.files).filter(e => !e.dir && !/^__MACOSX\/|(^|\/)\.DS_Store$/.test(e.name));
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            for (const e of ents) {
                                let nm = e.name;
                                if (strip) nm = nm.split('/').slice(1).join('/');
                                const targetPath = pre + (strip ? '' : root + '/') + nm;
                                addFile(targetPath, await e.async('uint8array'));
                                uploadedNames.push(targetPath);
                                n++;
                            }
                            out(`  ${f.name} → ${root}\\` + tr('zipUnpack'), 'ok');
                        } catch(e) {
                            out(f.name + ': ' + tr('zipFail'), 'err');
                        }
                    } else {
                        let finalPath = item.path;
                        if (rootFolderToStrip && finalPath.startsWith(rootFolderToStrip + '/')) {
                            finalPath = finalPath.slice(rootFolderToStrip.length + 1);
                        }
                        const targetPath = pre + finalPath;
                        addFile(targetPath, new Uint8Array(await item.file.arrayBuffer()));
                        uploadedNames.push(targetPath);
                        n++;
                    }
                }

                out(`${n}` + tr('uploadComplete'), 'ok');

                if (uploadedNames.length > 0) {
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    uploadedNames.forEach(fn => out('  ' + fn.replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                }
            }


            // ================= LOAD : GitHub 폴더(a~z, c 제외)에서 게임 불러오기 =================
            const LM = {
                en: {
                    usage: 'Usage: LOAD A [-v]   (A-Z except C)',
                    scan: '  scanning folder...', fetching: '  downloading...',
                    already: 'Already loaded. Use LOAD <letter> -F to reload.',
                    reserved: 'Access is denied.',
                    local: 'The device is not ready.',
                    notFound: d => 'The system cannot find the path specified.',
                    ghErr: e => 'Network error (' + e + ').',
                    progress: (i, n) => '  downloading ' + i + '/' + n,
                    done: (n, mb, d) => n + ' file(s) loaded (' + mb + ' MB) → ' + d.toUpperCase() + '\\',
                    noExe: 'Bad command or file name.',
                    pick: 'Multiple programs found. Use RUN with one of these:'
                },
                kr: {
                    usage: '사용법: LOAD A [-v]   (C를 제외한 A~Z)',
                    scan: '  폴더 검색 중...', fetching: '  다운로드 중...',
                    already: '이미 불러온 폴더입니다. 다시 받으려면 LOAD 문자 -F 를 사용하세요.',
                    reserved: '액세스가 거부되었습니다.',
                    local: '장치가 준비되지 않았습니다.',
                    notFound: d => '지정된 경로를 찾을 수 없습니다.',
                    ghErr: e => '네트워크 오류 (' + e + ').',
                    progress: (i, n) => '  다운로드 중 ' + i + '/' + n,
                    done: (n, mb, d) => n + '개 파일 로드 완료 (' + mb + ' MB) → ' + d.toUpperCase() + '\\',
                    noExe: '잘못된 명령 또는 파일 이름입니다.',
                    pick: '프로그램이 여러 개입니다. 아래 중 하나를 RUN 으로 실행하세요:'
                },
                jp: {
                    usage: '使い方: LOAD A [-v]   (Cを除くA～Z)',
                    scan: '  フォルダを検索中...', fetching: '  ダウンロード中...',
                    already: '既に読み込み済みです。再読み込みは LOAD 文字 -F を使用してください。',
                    reserved: 'アクセスが拒否されました。',
                    local: 'デバイスの準備ができていません。',
                    notFound: d => '指定されたパスが見つかりません。',
                    ghErr: e => 'ネットワークエラー (' + e + ')。',
                    progress: (i, n) => '  ダウンロード中 ' + i + '/' + n,
                    done: (n, mb, d) => n + '個のファイルを読み込みました (' + mb + ' MB) → ' + d.toUpperCase() + '\\',
                    noExe: 'コマンドまたはファイル名が正しくありません。',
                    pick: 'プログラムが複数あります。次のいずれかを RUN で実行してください:'
                },
                cn: {
                    usage: '用法: LOAD A [-v]   (除 C 外的 A~Z)',
                    scan: '  正在搜索文件夹...', fetching: '  下载中...',
                    already: '已加载。如需重新加载，请使用 LOAD 字母 -F。',
                    reserved: '拒绝访问。',
                    local: '设备未准备好。',
                    notFound: d => '系统找不到指定的路径。',
                    ghErr: e => '网络错误 (' + e + ')。',
                    progress: (i, n) => '  下载中 ' + i + '/' + n,
                    done: (n, mb, d) => '已加载 ' + n + ' 个文件 (' + mb + ' MB) → ' + d.toUpperCase() + '\\',
                    noExe: '命令或文件名错误。',
                    pick: '找到多个程序。请用 RUN 运行以下之一:'
                }
            };
            const lm = (k, ...a) => { const s = (LM[currentLang] && LM[currentLang][k]) || LM.en[k]; return typeof s === 'function' ? s(...a) : s; };
            const encPath = p => p.split('/').map(encodeURIComponent).join('/');
            const skipName = n => /(^|\/)(\.gitkeep|\.gitignore|\.DS_Store|Thumbs\.db)$/i.test(n) || /^__MACOSX\//.test(n);
            const isZip = n => /\.(zip|jsdos)$/i.test(n);
            // 커스텀 도메인/로컬에서 GitHub 자동 탐색을 쓰려면 'owner/repo' 를 적으세요 (github.io 에서는 비워도 됨)
            const GH_REPO = 'songsiwon001-a11y/WebDos1.09';
            const GH_BRANCHES = ['main', 'master', 'HEAD'];
            // 현재 주소(owner.github.io/<repo>/)에서 알아낸 저장소를 먼저, 그다음 GH_REPO 를 후보로 쓴다
            const ghRepos = () => {
                const r = [], segs = location.pathname.split('/').filter(Boolean);
                if (/\.github\.io$/i.test(location.hostname) && segs.length && (segs.length > 1 || !/\.html?$/i.test(segs[0]))) r.push(location.hostname.split('.')[0] + '/' + segs[0]);
                if (GH_REPO && !r.some(x => x.toLowerCase() === GH_REPO.toLowerCase())) r.push(GH_REPO);
                return r;
            };
            let loading = false, ghErr = null, verbose = false;
            const dbg = m => { if (verbose) out('  ' + m, 'yellow'); };
            const pageBase = () => {
                let pth = location.pathname;
                if (!pth.endsWith('/') && !/\.[a-z0-9]+$/i.test(pth.split('/').pop())) pth += '/';
                return location.origin + pth.replace(/[^\/]*$/, '');
            };
            const U = x => pageBase() + x;

            // ---- 네트워크 유틸 ----
            const fetchT = async (u, ms, opts) => {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), ms || 8000);
                try { return await fetch(u, Object.assign({ signal: ctl.signal }, opts || {})); }
                finally { clearTimeout(t); }
            };
            // 여러 비동기 탐색 중 '처음으로 성공(truthy)'한 결과를 반환 (모두 실패하면 null)
            const firstTruthy = ps => new Promise(res => {
                let n = ps.length;
                if (!n) return res(null);
                ps.forEach(p => Promise.resolve(p).then(v => { if (v) res(v); else if (--n === 0) res(null); }, () => { if (--n === 0) res(null); }));
            });
            let progCb = null;
            const readBody = async (r, name) => {
                if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
                const total = +r.headers.get('content-length') || 0;
                const rd = r.body.getReader(), chunks = [];
                let got = 0;
                for (;;) {
                    const { done, value } = await rd.read();
                    if (done) break;
                    chunks.push(value); got += value.length;
                    if (progCb) progCb(name, got, total);
                }
                const buf = new Uint8Array(got);
                let o = 0;
                for (const c of chunks) { buf.set(c, o); o += c.length; }
                return buf;
            };

            const getter = (dir, rel) => async () => {
                const tries = [U(dir + '/' + encPath(rel))];
                for (const rp of ghRepos()) for (const b of GH_BRANCHES.filter(x => x !== 'HEAD')) {
                    tries.push('https://raw.githubusercontent.com/' + rp + '/' + b + '/' + encPath(dir + '/' + rel));
                    tries.push('https://cdn.jsdelivr.net/gh/' + rp + '@' + b + '/' + encPath(dir + '/' + rel));
                }
                let last = 0;
                for (const u of tries) {
                    try {
                        const r = await fetchT(u, 15000);
                        dbg('GET ' + u + ' → ' + r.status);
                        if (r.ok) return await readBody(r, rel);
                        last = r.status;
                    } catch (e) { dbg('GET ' + u + ' → ' + (e.message || e)); }
                }
                throw new Error(rel + ' ' + last);
            };

            // 폴더 최상위의 zip/jsdos 는 (병렬로) 풀어서 내용물로 교체 — zip 이름은 상관없음
            async function expandZips(list) {
                const parts = await Promise.all(list.map(async it => {
                    if (!it.path.includes('/') && isZip(it.path)) {
                        try {
                            const z = await JSZip.loadAsync(await it.get());
                            const ents = Object.values(z.files).filter(e => !e.dir && !skipName(e.name));
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            dbg('unzip ' + it.path + ' (' + ents.length + ' files)');
                            return ents.map(e => ({ path: strip ? e.name.split('/').slice(1).join('/') : e.name, get: () => e.async('uint8array') }));
                        } catch (e) { dbg('unzip failed: ' + it.path + ' ' + (e.message || e)); return []; }
                    }
                    return [it];
                }));
                return parts.flat();
            }

            // 1) <폴더>/files.json (있으면 사용)
            async function srcManifest(dir) {
                try {
                    const r = await fetchT(U(dir + '/files.json'), 6000, { cache: 'no-cache' });
                    dbg('GET ' + dir + '/files.json → ' + r.status);
                    if (!r.ok) return null;
                    const j = await r.json();
                    const arr = (Array.isArray(j) ? j : (j.files || [])).filter(x => typeof x === 'string' && !skipName(x));
                    return arr.length ? { dir, list: arr.map(x => ({ path: x, get: getter(dir, x) })) } : null;
                } catch (e) { return null; }
            }

            // 2) 서버가 폴더 목록(디렉터리 인덱스)을 제공하는 경우 (로컬 서버 등)
            async function srcIndex(dir) {
                try {
                    const r = await fetchT(U(dir + '/'), 6000, { cache: 'no-cache' });
                    dbg('GET ' + dir + '/ → ' + r.status);
                    if (!r.ok) return null;
                    const html = await r.text();
                    const names = [...html.matchAll(/href="([^"?#]+)"/gi)].map(m => decodeURIComponent(m[1]))
                        .filter(h => !h.startsWith('/') && !h.startsWith('..') && !/^[a-z]+:/i.test(h) && !h.endsWith('/') && !skipName(h));
                    return names.length ? { dir, list: names.map(x => ({ path: x, get: getter(dir, x) })) } : null;
                } catch (e) { return null; }
            }

            // GitHub 저장소 후보: 현재 주소(owner.github.io/<repo>/...) + GH_REPO
            const ghCands = () => {
                const c = [], h = location.hostname, segs = location.pathname.split('/').filter(Boolean);
                if (/\.github\.io$/i.test(h) && segs.length && (segs.length > 1 || !/\.html?$/i.test(segs[0]))) {
                    const rest = segs.slice(1);
                    if (rest.length && /\.[a-z0-9]+$/i.test(rest[rest.length - 1])) rest.pop();
                    c.push({ repo: h.split('.')[0] + '/' + segs[0], prefix: rest.length ? rest.join('/') + '/' : '' });
                }
                if (GH_REPO && !c.some(x => x.repo.toLowerCase() === GH_REPO.toLowerCase())) c.push({ repo: GH_REPO, prefix: '' });
                return c;
            };
            const pickFolder = (names, c, letter) => {
                const want = (c.prefix + letter + '/').toLowerCase();
                const hits = names.filter(x => x.toLowerCase().startsWith(want));
                dbg('folder match: ' + hits.length + ' file(s)');
                if (!hits.length) return null;
                const dir = hits[0].slice(c.prefix.length).split('/')[0];
                return { dir, list: hits.map(x => { const rel = x.slice(c.prefix.length + dir.length + 1); return { path: rel, get: getter(dir, rel) }; }) };
            };

            // 3) GitHub API (트리 한 번에 조회, 브랜치/저장소 후보 병렬)
            async function srcGithub(letter) {
                const one = (c, ref) => (async () => {
                    const r = await fetchT('https://api.github.com/repos/' + c.repo + '/git/trees/' + ref + '?recursive=1', 10000);
                    dbg('API ' + c.repo + '@' + ref + ' → ' + r.status);
                    if (!r.ok) { ghErr = r.status; return null; }
                    const j = await r.json();
                    const names = (j.tree || []).filter(t => t.type === 'blob' && !skipName(t.path)).map(t => t.path);
                    return pickFolder(names, c, letter);
                })();
                const cands = ghCands();
                const hit = await firstTruthy(cands.flatMap(c => ['main', 'master'].map(ref => one(c, ref))));
                return hit || firstTruthy(cands.map(c => one(c, 'HEAD')));
            }

            // 4) jsDelivr 파일 목록 (CDN 이라 API 제한 없음)
            async function srcJsd(letter) {
                const one = (c, b) => (async () => {
                    const r = await fetchT('https://data.jsdelivr.com/v1/packages/gh/' + c.repo + '@' + b + '?structure=flat', 10000);
                    dbg('LIST ' + c.repo + '@' + b + ' → ' + r.status);
                    if (!r.ok) return null;
                    const j = await r.json();
                    const names = (j.files || []).map(f => String(f.name || f).replace(/^\//, '')).filter(x => !skipName(x));
                    return pickFolder(names, c, letter);
                })();
                return firstTruthy(ghCands().flatMap(c => ['main', 'master'].map(b => one(c, b))));
            }

            // 모든 탐색 방법을 동시에 시작해서 가장 먼저 폴더를 찾아낸 결과를 사용
            function discover(L) {
                const jobs = [];
                for (const d of [L, L.toUpperCase()]) { jobs.push(srcManifest(d)); jobs.push(srcIndex(d)); }
                jobs.push(srcGithub(L));
                jobs.push(srcJsd(L));
                return firstTruthy(jobs);
            }

            // cd 로 a~z(c 제외) 폴더에 들어가면 아직 안 불러온 경우 자동으로 LOAD 실행
            async function autoLoad() {
                const L = cwd.length ? String(cwd[0]).toLowerCase() : '';
                if (!/^[abd-z]$/.test(L) || location.protocol === 'file:') return;
                while (loading) await sleep(100);
                for (const k of files.keys()) if (k.startsWith(L + '/')) return;
                return cmds.load([L]);
            }
            cmds.load = async function (a) {
                verbose = a.some(x => /^[-\/]v$/i.test(x));
                const force = a.some(x => /^[-\/]f$/i.test(x));
                let L = (a.find(x => !/^[-\/]/.test(x)) || '').replace(/[:\\\/]+$/, '').toLowerCase();
                if (!L && cwd.length && /^[a-z]$/i.test(cwd[0])) L = cwd[0].toLowerCase();
                if (!L || !/^[a-z]$/.test(L)) return out(lm('usage'), 'err');
                if (L === 'c') return out(lm('reserved'), 'err');
                if (location.protocol === 'file:') return out(lm('local'), 'err');
                while (loading) await sleep(100);
                if (!force) { for (const k of files.keys()) if (k.startsWith(L + '/')) return out(lm('already'), 'yellow'); }
                loading = true; ghErr = null;
                out('');
                const bar = O.lastChild;
                const st = t => { if (bar) bar.textContent = t; };
                const rm = () => { if (bar && bar.parentNode) bar.remove(); };
                try {
                    dbg('base: ' + pageBase());
                    st(lm('scan'));
                    const hit = await Promise.race([discover(L), new Promise(r => setTimeout(() => r(null), 25000))]);
                    if (!hit) {
                        rm();
                        if (ghErr) out(lm('ghErr', ghErr), 'err');
                        return out(lm('notFound', L), 'err');
                    }
                    st(lm('fetching'));
                    progCb = (n, g, t) => st('  ' + n + '  ' + (g / 1048576).toFixed(1) + (t ? ' / ' + (t / 1048576).toFixed(1) : '') + ' MB');
                    const list = await expandZips(hit.list);
                    progCb = null;
                    if (!list.length) { rm(); return out(lm('notFound', L), 'err'); }

                    const total = list.length, fresh = [];
                    let idx = 0, done = 0;
                    const worker = async () => {
                        while (idx < total) {
                            const it = list[idx++];
                            const data = await it.get();
                            fresh.push([it.path, data]);
                            done++;
                            st(lm('progress', done, total));
                        }
                    };
                    await Promise.all(Array.from({ length: Math.min(6, total) }, worker));
                    for (const k of [...files.keys()]) if (k.startsWith(L + '/')) files.delete(k);
                    for (const [pp, d] of fresh) addFile(L + '/' + pp, d);
                    rm();

                    out(total + tr('uploadComplete'), 'ok');
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    list.forEach(it => out('  ' + (L + '/' + it.path).replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                } catch (e) {
                    rm();
                    out('Error: ' + (e && e.message || e), 'err');
                } finally { progCb = null; loading = false; }
            };
            // =================================================================================

            $('fz').onchange=e=>{ingest([...e.target.files]);e.target.value=''};
            $('fd').onchange=e=>{ingest([...e.target.files]);e.target.value=''};

            T.ondragover=e=>{e.preventDefault();T.classList.add('drag')};
            T.ondragleave=()=>T.classList.remove('drag');
            T.ondrop=async e=>{
                e.preventDefault(); T.classList.remove('drag');
                const all=[];
                const walk=async(en,path)=>{
                    if(en.isFile) await new Promise(r=>en.file(f=>{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});all.push(f);r()}));
                    else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const c of b)await walk(c,path+en.name+'\/')}while(b.length)}
                };
                for(const it of e.dataTransfer.items){
                    const en=it.webkitGetAsEntry?.();
                    if(en?.isDirectory) await walk(en,'');
                    else if(en) await new Promise(r=>en.file(f=>{all.push(f);r()}))
                }
                ingest(all);
            };

            // 명령은 입력창을 잠그지 않고 대기열(cmdChain)에 넣어 순서대로 실행한다.
            // (예전에는 CD/LOAD 가 끝날 때까지 입력창을 disabled 로 잠가서, 느린 기기에서 그 사이에 친 RUN 등이 사라졌다.)
            let cmdChain=Promise.resolve();
            // RUN 없이 파일명만 입력했을 때, 실행할 수 있는 파일(exe/com/bat/디스크 이미지/html)이 있는지 확인
            function runnableExists(arg){
                arg=String(arg).replace(/^["']|["']$/g,'').trim();
                if(!arg) return false;
                const hasExt=/\.[a-z0-9]{1,4}$/i.test(arg);
                const exts=hasExt?['']:['.exe','.com','.bat','.img','.ima','.vfd','.dsk','.flp','.iso','.cue'];
                const p=resolve(arg);
                for(const e of exts){ if(files.get(lc(p)+e)) return true; }
                const nm=arg.split(/[\\/]/).pop().toLowerCase();
                if([...files.values()].some(v=>exts.some(e=>base(v.p).toLowerCase()===nm+e))) return true;
                const nm2=nm.replace(/\.(exe|com|bat)$/i,'');
                return [...files.values()].some(v=>/\.html?$/i.test(v.p) && base(v.p).toLowerCase().replace(/\.html?$/i,'')===nm2);
            }
            async function execLine(l){
                try{
                    const [c,...a]=l.split(/\s+/);
                    if(/^[a-z]:$/i.test(c) && !a.length){
                        const r=cmds.cd([c[0].toLowerCase()==='c' ? 'c:' : '\\'+c[0]]);
                        if(r&&typeof r.then==='function') await r;
                    } else {
                        const fn=Object.prototype.hasOwnProperty.call(cmds,c.toLowerCase()) ? cmds[c.toLowerCase()] : null;
                        if(fn){
                            const r=fn(a);
                            if(r&&typeof r.then==='function') await r;
                        } else if(runnableExists(c)){
                            // 내부 명령이 아니고 실행 가능한 파일이 있으면 RUN 없이 파일명만으로 실행
                            const r=cmds.run([c,...a]);
                            if(r&&typeof r.then==='function') await r;
                        } else out("'"+c+"'"+tr('notCommand'),'err');
                    }
                }catch(e){ out('Error: '+(e&&e.message||e),'err'); }
                prompt(); T.scrollTop=T.scrollHeight;
            }
            I.onkeydown=e=>{
                if(e.key==='Enter'){
                    const l=I.value.trim();
                    out($('pr').textContent+I.value);
                    I.value='';
                    if(l){
                        hist.push(l); hi=hist.length;
                        cmdChain=cmdChain.then(()=>execLine(l));
                    } else { prompt(); T.scrollTop=T.scrollHeight; }
                }else if(e.key==='ArrowUp'){
                    if(hi>0) I.value=hist[--hi];
                    e.preventDefault();
                }else if(e.key==='ArrowDown'){
                    I.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'');
                }else if(e.key==='Tab'){
                    e.preventDefault();
                    const val = I.value.trim().toLowerCase();
                    const cmdNames = Object.keys(cmds);
                    const match = cmdNames.find(c => c.startsWith(val));
                    if(match) I.value = match.toUpperCase() + ' ';
                }
            };

            window.addEventListener('keydown', async e => {
                if($('editor').style.display === 'flex') {
                    if(e.key === 'Escape') {
                        $('editor').style.display = 'none';
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    } else if((e.ctrlKey || e.metaKey) && e.key === 's') {
                        const content = new TextEncoder().encode($('editor-textarea').value);
                        files.set(editingFile.key, { p: editingFile.path, d: content });
                        $('editor').style.display = 'none';
                        out(tr('editorSaved') + editingFile.path, 'ok');
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    }
                } else if(manualExit && e.key==='End' && $('game').style.display==='block') {
                    e.preventDefault(); e.stopPropagation();
                    await stopGame();
                }
            }, true);

            window.addEventListener('error', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.message || 'Script warning'), 'err');
                }
            });

            window.addEventListener('unhandledrejection', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.reason && e.reason.message || e.reason), 'err');
                }
            });

            ensureDos().catch(()=>{});
            T.onclick=()=>{if(!getSelection().toString() && $('editor').style.display !== 'flex')I.focus()};

            (async () => {
                await langReady;
                const sc = loadSetting('color');
                if (sc) T.style.color = sc;
                updateUIForLanguage();
                out(tr('intro1'),'hi');
                out(tr('intro2'));
                out('');
                prompt();
            })();
        })();
    </script>
