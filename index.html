    <title>WEB-DOS [Version 1.09]</title>

    <link rel="icon" href="image.png">

    <!-- DOS 느낌의 픽셀 글꼴: Neo둥근모 Code (고정폭, 한글/영문/일부 한자·가나 지원) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.601/neodgm_code/style.css">
    <!-- coi-serviceworker.js 는 스레드 코어(DOSBox Pure)를 실제로 쓸 때만 동적으로 불러온다 (시작 시 로드하면 페이지가 반복 새로고침되어 빈 화면 깜박임) -->

    <style>
        html, body { height: 100%; margin: 0; background: #000; }
        #t { height: 100%; overflow-y: auto; padding: 10px 14px; box-sizing: border-box; color: #aaa; font: 16px/1.3 "NeoDunggeunmo Code", "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; -webkit-font-smoothing: none; font-smooth: never; white-space: pre-wrap; word-break: break-all; }
        #t.drag { outline: 3px dashed #5f5; outline-offset: -6px; }
        #row { display: flex; }
        #in { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; caret-color: #fff; padding: 0; }
        .err { color: #f66; }
        .ok { color: #5f5; }
        .hi { color: #fff; }
        .cyan { color: #5ff; }
        .yellow { color: #ff5; }
        #game { display: none; position: fixed; inset: 0; background: #000; z-index: 9; }
        #dos { position: absolute; inset: 0; }
        #off { display: none; position: fixed; inset: 0; background: #000; z-index: 30; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #f90; font: 20px/1.6 "NeoDunggeunmo Code", "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; cursor: pointer; }
        #off-note { color: #777; font-size: 14px; margin-top: 18px; max-width: 80%; }
        #splash { display: none; position: fixed; inset: 0; z-index: 35; background: #738c9c; align-items: center; justify-content: center; }
        #splash img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
        #sw { display: none; position: absolute; top: 8px; right: 150px; z-index: 10; background: #05a; color: #fff; border: 0; padding: 6px 12px; font: 14px "NeoDunggeunmo Code", monospace; cursor: pointer; opacity: .85; }
        #x { display: none; position: absolute; top: 8px; right: 8px; z-index: 10; background: #a00; color: #fff; border: 0; padding: 6px 12px; font: 14px "NeoDunggeunmo Code", monospace; cursor: pointer; opacity: .85; }
        /* 모바일 터치 컨트롤 (키보드 이벤트로 변환) */
        #pad { display: none; position: absolute; inset: 0; z-index: 11; pointer-events: none; }
        #pad, #pad * { -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
        #stick { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; }
        #knob { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.5); }
        #btns { position: absolute; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, 62px); gap: 10px; pointer-events: none; }
        .pb { height: 58px; border-radius: 14px; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4); color: #fff; font: bold 14px "NeoDunggeunmo Code", monospace; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .pb.on { background: rgba(85,255,85,.55); }
        #kb { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
        #coin { display: none; position: absolute; top: 8px; left: 8px; z-index: 12; background: #c80; color: #fff; border: 0; padding: 6px 12px; font: 14px "NeoDunggeunmo Code", monospace; cursor: pointer; opacity: .9; }
        #padtg { display: none; position: absolute; top: 8px; left: 8px; z-index: 12; background: #333; color: #fff; border: 0; padding: 6px 12px; font: 14px "NeoDunggeunmo Code", monospace; cursor: pointer; opacity: .85; }
        /* Editor Overlay Styles */
        #editor { display: none; position: fixed; inset: 20px; background: #000; border: 2px solid #5f5; z-index: 8; padding: 10px; flex-direction: column; box-sizing: border-box; }
        #editor-header { color: #5f5; font: bold 16px "NeoDunggeunmo Code", monospace; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #editor-textarea { flex: 1; line-height: 1.3; background: #111; color: #fff; border: 1px solid #333; font: 15px "NeoDunggeunmo Code", monospace; padding: 8px; resize: none; outline: none; }
        #editor-footer { color: #777; font-size: 13px; margin-top: 5px; display: flex; justify-content: space-between; }
    </style>

    <div id="t">
        <div id="o"></div>
        <div id="row"><span id="pr"></span><input id="in" autocomplete="off" spellcheck="false" autofocus></div>
    </div>
    
    <div id="editor">
        <div id="editor-header">WEB-DOS EDITOR</div>
        <textarea id="editor-textarea" spellcheck="false"></textarea>
        <div id="editor-footer">
            <span id="editor-hint">[Ctrl+S] Save & Exit | [ESC] Cancel</span>
            <span id="editor-filename"></span>
        </div>
    </div>

    <div id="game">
        <button id="x">■ EXIT (END)</button>
        <button id="sw">NEXT DISK</button>
        <div id="dos"></div>
        <div id="pad"></div>
        <button id="padtg">🎮</button>
        <button id="coin">● COIN</button>
    </div>
        <div id="off"><div id="off-msg"></div><div id="off-note"></div></div>
    <input type="file" id="fz" multiple accept=".zip,.jsdos,*" hidden>
    <input type="file" id="fd" webkitdirectory directory multiple hidden>
    <script type="text/plain" id="webdos-engine"><!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebDos</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--fg:#e6e8ec;--dim:#98a0ad;--acc:#4dd0a8;--warn:#ff7b72}
@media (prefers-color-scheme: light){:root{--bg:#f3f4f6;--panel:#fff;--line:#d9dce2;--fg:#1c1f26;--dim:#5b6472;--acc:#0a8f6a;--warn:#c2362d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:none;margin:0;padding:0;display:block}
html,body{height:100%;overflow:hidden}
h1{font-size:18px;margin:0 0 12px;font-weight:650}
h1 small{color:var(--dim);font-weight:400;margin-left:8px;font-size:12px}
#stage{background:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;height:100dvh;margin:0;border:0;border-radius:0;position:relative}
#stage.keep43 #screen{width:auto;height:auto;aspect-ratio:4/3;max-width:100%;max-height:100%}
#stage:fullscreen{width:100vw;height:100vh}
#stage:fullscreen #gear,#stage:fullscreen #hint{display:none}
#screen{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:fill;image-rendering:pixelated;outline:none;display:block;background:#000}
#gear{position:absolute;left:8px;top:8px;z-index:5;width:34px;height:34px;padding:0;font-size:18px;line-height:1;border-radius:50%;background:#000a;color:#ddd;border:1px solid #fff3}
#gear:hover{border-color:var(--acc);color:#fff}
#hint{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#9aa;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;pointer-events:none}
#settings{position:fixed;left:0;top:0;bottom:0;width:360px;max-width:92vw;overflow:auto;background:var(--bg);border-right:1px solid var(--line);padding:12px;z-index:100;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 18px #0006}
#settings.open{transform:none}
#settings .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#settings .head h1{margin:0}
#kbd{position:absolute;right:8px;top:8px;font-size:11px;padding:2px 8px;border-radius:10px;background:#0008;color:#ccc;pointer-events:none}
#kbd.on{background:#0a8f6acc;color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button,select,input[type=text]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.chip{padding:3px 10px;font-size:12px;border-radius:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--dim);font-weight:600;letter-spacing:.02em}
#drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--dim);transition:.15s}
#drop.over{border-color:var(--acc);color:var(--fg);background:#4dd0a812}
label.file{display:inline-block}
label.file input{display:none}
label.file span{display:inline-block;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px}
label.file span:hover{border-color:var(--acc)}
select#prog{width:100%;margin-bottom:8px}
#args{width:100%;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row input[type=range]{flex:1}
.dim{color:var(--dim);font-size:12px}
#status{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;margin-top:10px;color:var(--dim);min-height:2.6em}
#status.err{color:var(--warn)}
#perf{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);margin-top:6px}
ul.notes{margin:0;padding-left:18px;color:var(--dim);font-size:12.5px}
ul.notes li{margin:3px 0}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
#mobileBlock{display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);color:var(--fg);align-items:center;justify-content:center;text-align:center;padding:32px}
#mobileBlock .box{max-width:360px}
#mobileBlock h2{font-size:20px;margin:0 0 10px}
#mobileBlock p{margin:6px 0;color:var(--dim)}
html.is-mobile #mobileBlock{display:flex}
html.is-mobile .wrap{display:none}
html.embed #settings{display:none!important}
html.embed #gear,html.embed #hint,html.embed #kbd{display:none!important}
#wdOverlay{display:none;position:absolute;inset:0;z-index:6;background:#000b;color:#fff;align-items:center;justify-content:center;font:16px/1.6 system-ui,sans-serif;cursor:pointer;text-align:center}
</style>

    <div id="perf"></div>
    <div id="status"></div>
    </div>
    <div class="card" id="drop">

      <label class="file"><input id="fileIn" type="file" multiple><span>파일·ZIP 선택</span></label>
      <div class="dim" id="fileInfo" style="margin-top:8px">불러온 파일 없음</div>
    </div>
    <div class="card">
      <h2>실행</h2>
      <select id="prog"></select>
      <input id="args" type="text" placeholder="명령줄 인수 (선택)">
      <div class="bar" style="margin:0"><button id="runBtn" class="primary" disabled>실행</button></div>
      <div class="row" style="margin-top:10px"><span style="width:62px">CPU 속도</span><input id="speed" type="range" min="2" max="400" value="120"><span id="speedVal" class="dim" style="width:190px;text-align:right"></span></div>

      <div id="demos" class="bar" style="margin:0"></div>
    </div>
    <div class="card">
      <h2>진단 (게임이 안 될 때)</h2>
      <div class="bar" style="margin:0"><button id="diagBtn">진단 정보 보기·복사</button><span class="dim" id="diagMsg"></span></div>
      <textarea id="diag" readonly style="display:none;width:100%;height:220px;margin-top:8px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px"></textarea>
    </div>
    <div class="card">
      <h2>세이브 데이터</h2>
      <div class="dim" id="saveInfo">…</div>
      <div class="bar"><button id="clearSaves">진행상황만 삭제</button><button id="clearAll">모두 삭제</button></div>
      <div class="dim" style="margin-top:6px">불러온 게임 파일과 게임이 만든/수정한 파일(세이브, 설정)은 이 브라우저에 보관됩니다. 프로그램이 끝날 때(중지·창 닫기 포함) 저장되고, 다시 열면 그대로 이어서 할 수 있어요.</div>
    </div>

        <li>386 실모드 CPU(16/32비트 레지스터), VGA(텍스트·13h·모드 X·16색), PIT/PIC, 키보드 IRQ</li>
        <li>AdLib(OPL2), Sound Blaster 2.0(8비트 DMA), PC 스피커, INT 33h 마우스</li>

        <li><b>미지원</b>: 보호 모드(DOS/4GW, DPMI 사용 게임 — 둠 등), XMS/EMS, FPU, BAT</li>
      </ul>
    </div>
  </aside>

  cv.addEventListener('focus', () => { focused = true; $('kbd').classList.add('on'); $('kbd').textContent = '키보드 캡처 중'; });
  cv.addEventListener('blur', () => { focused = false; $('kbd').classList.remove('on'); $('kbd').textContent = '키보드 캡처 꺼짐 (화면 클릭)'; for (const c of [...machine.kb.down]) machine.key(c, false); });
  const keyHandler = down => e => {
    if (!focused) return;
    if (e.code === 'F11') return;
    if (!machine.running) { if (down && shell.key(e)) { e.preventDefault(); e.stopPropagation(); } return; }
    if (machine.key((WD.keyRemap && WD.keyRemap[e.code]) || e.code, down)) { e.preventDefault(); e.stopPropagation(); }
  };
  window.addEventListener('keydown', keyHandler(true), true);
  window.addEventListener('keyup', keyHandler(false), true);

  /* ------------------------------ mouse ------------------------------ */
  let buttons = 0;
  cv.addEventListener('mousedown', e => {
    cv.focus();
    if ($('mouseOn').checked && machine.running && document.pointerLockElement !== cv && !((navigator.maxTouchPoints||0)>0)) { cv.requestPointerLock && cv.requestPointerLock(); }   // 터치 기기에서는 포인터 잠금을 걸지 않는다 (잠기면 가상 조이스틱 입력이 어긋남)
    buttons |= e.button === 0 ? 1 : e.button === 2 ? 2 : 4; machine.dos.mouseEvent(0, 0, buttons); e.preventDefault();
  });
  window.addEventListener('mouseup', e => { buttons &= ~(e.button === 0 ? 1 : e.button === 2 ? 2 : 4); machine.dos.mouseEvent(0, 0, buttons); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('mousemove', e => { if (document.pointerLockElement === cv) machine.dos.mouseEvent(e.movementX, e.movementY, buttons); });

  /* ===================================================================
   *  WebDos 임베드 API (iframe / 외부 페이지에서 파일 주입 + 자동 실행)
   *   1) window.WebDos            (같은 페이지/동일 출처에서 직접 호출)
   *   2) postMessage 프로토콜      (iframe 부모 → 이 페이지)
   *   3) URL 파라미터              (?zip=...&run=GAME.EXE&ui=0 ...)
   * =================================================================== */
  const WD = (() => {
    const VERSION = '1.0';
    const listeners = [];
    let readyResolve; const ready = new Promise(r => { readyResolve = r; });
    let isReady = false;

    const norm = p => String(p).replace(/\\/g, '/').replace(/^\.?\/+/, '');
    const toU8 = async d => {
      if (d instanceof Uint8Array) return d;
      if (d instanceof ArrayBuffer) return new Uint8Array(d);
      if (ArrayBuffer.isView(d)) return new Uint8Array(d.buffer, d.byteOffset, d.byteLength);
      if (typeof Blob !== 'undefined' && d instanceof Blob) return new Uint8Array(await d.arrayBuffer());
      if (typeof d === 'string') { // base64 (data: URL 접두사 허용)
        const b = d.replace(/^data:[^,]*,/, '');
        return Uint8Array.from(atob(b), c => c.charCodeAt(0));
      }
      throw new Error('지원하지 않는 데이터 형식');
    };
    const emit = (type, data) => { for (const f of listeners) { try { f(type, data || {}); } catch (e) { } } };

    // 파일 목록 [{path, data}] 를 가상 디스크에 추가
    async function loadFiles(files, opt = {}) {
      const persist = !!opt.persist;
      const list = [];
      for (const f of files) list.push({ path: norm(f.path), data: await toU8(f.data) });
      const fin = opt.stripRoot ? stripCommonRoot(list) : list;
      flushSaves();
      const vfs = machine.dos.vfs;
      for (const f of fin) {
        const nd = vfs.addFile(f.path, f.data); if (!nd) continue;
        loaded.push(f);
        if (persist) store.put(vfs.realPath(nd), f.data, 'base');
      }
      if (opt.restoreSaves !== false) await applySaves();
      refreshPrograms(); refreshSaves();
      emit('files', { count: fin.length });
      return fin.length;
    }
    async function loadZip(src, opt = {}) {
      let buf;
      if (typeof src === 'string' && /^(https?:|blob:|data:|\.{0,2}\/)/i.test(src)) {
        const r = await fetch(src); if (!r.ok) throw new Error('다운로드 실패: HTTP ' + r.status); buf = await r.arrayBuffer();
      } else buf = (await toU8(src)).slice().buffer;
      const list = await readZip(buf);
      return loadFiles(list, Object.assign({ stripRoot: true }, opt));
    }
    async function loadUrl(url, path, opt = {}) {
      const r = await fetch(url); if (!r.ok) throw new Error('다운로드 실패: HTTP ' + r.status);
      const name = path || decodeURIComponent(String(url).split('?')[0].split('/').pop() || 'FILE');
      if (!path && /\.zip$/i.test(name)) return loadZip(new Uint8Array(await r.arrayBuffer()), opt);
      return loadFiles([{ path: name, data: await r.arrayBuffer() }], opt);
    }
    function listPrograms() { return machine.findPrograms().map(p => p.path); }
    function findProgram(path) {
      const progs = machine.findPrograms();
      if (path == null || path === '') { // 자동 선택: 설치/설정 계열 제외
        return (progs.find(p => !/INSTALL|SETUP|UNINST|CONFIG|SERSETUP|README/i.test(p.path)) || progs[0] || {}).node || null;
      }
      const want = norm(path).toUpperCase();
      const hit = progs.find(p => machine.dos.vfs.realPath(p.node).replace(/\\/g, '/').toUpperCase() === want)
        || progs.find(p => p.path.replace(/\\/g, '/').toUpperCase() === want)
        || progs.find(p => p.node.name.toUpperCase() === want)
        || progs.find(p => p.path.replace(/\\/g, '/').toUpperCase().endsWith('/' + want))
        || progs.find(p => p.node.name.toUpperCase() === want + '.EXE' || p.node.name.toUpperCase() === want + '.COM');
      return hit ? hit.node : null;
    }
    function run(path, args) {
      const node = findProgram(path);
      if (!node) throw new Error('실행 파일을 찾을 수 없습니다: ' + (path || '(자동)'));
      initAudio(); hookAudioUnlock();
      shell.runFromUI(node, args ? ' ' + String(args).replace(/^\s+/, '') : '');
      return machine.dos.vfs.fullPath(node);
    }
    function stop() { machine.running = false; flushSaves(); setStatus('중지됨'); }
    // 임베드 종료: 실행 중지 + 오디오 닫기 (iframe 을 제거하기 직전에 호출)
    function shutdown() { execMode = false; machine.running = false; try { if (ac) ac.close(); } catch (e) { } ac = null; }
    // 명령 줄 실행 (BAT 포함). 셸이 다시 프롬프트로 돌아오면 'exit' 이벤트
    function exec(line) { initAudio(); hookAudioUnlock(); execMode = true; wasRunning = false; shell.submit(String(line)); return true; }
    function pause() { paused = true; $('pauseBtn').textContent = '계속'; }
    function resume() { paused = false; $('pauseBtn').textContent = '일시정지'; lastT = performance.now(); }
    function setSpeed(mips) { $('speed').value = mips; $('speed').oninput({ target: $('speed') }); }
    function setVolume(v) { $('vol').value = Math.round(v * 100); if (window.__gain) window.__gain.gain.value = v; }
    function setUI(on) { document.documentElement.classList.toggle('embed', !on); }
    function setKeep43(on) { $('keep43').checked = !!on; $('stage').classList.toggle('keep43', !!on); }
    function setMouse(on) { $('mouseOn').checked = !!on; machine.dos.mouse.present = !!on; }
    function focus() { cv.focus(); }
    function setKeyRemap(m) { api.keyRemap = m || null; }
    function unlockAudio() { initAudio(); const o = $('wdOverlay'); if (o) o.style.display = 'none'; }
    function fullscreen() { $('fsBtn').click(); }
    function screenshot() { return cv.toDataURL('image/png'); }
    function reset() { // 가상 디스크 비우기 (저장된 세이브는 유지)
      if (machine.running) stop();
      machine.dos.vfs = new VFS(); loaded = [];
      shell.vfs = machine.dos.vfs; machine.dos.cwd = [];
      refreshPrograms(); emit('files', { count: 0 });
    }
    function status() {
      return { version: VERSION, ready: isReady, running: machine.running, paused, programs: listPrograms(), error: machine.error ? machine.error.message : null };
    }
    // 키 입력 주입 (e.g. sendKey('Enter'), sendKey('KeyA'))
    function sendKey(code, ms = 60) { machine.key(code, true); setTimeout(() => machine.key(code, false), ms); }

    // 오디오는 브라우저 정책상 사용자 제스처가 필요 → 첫 클릭/키 입력 때 풀어줌 + 안내 오버레이
    let unlockHooked = false;
    function hookAudioUnlock() {
      const ov = $('wdOverlay');
      if (ac && ac.state === 'running' && document.hasFocus()) { ov.style.display = 'none'; return; }
      ov.style.display = 'flex';
      if (unlockHooked) return; unlockHooked = true;
      const go = () => { initAudio(); cv.focus(); ov.style.display = 'none'; };
      ov.addEventListener('pointerdown', go);
      window.addEventListener('keydown', () => { if (ac && ac.state === 'suspended') ac.resume(); ov.style.display = 'none'; }, true);
    }

    // 실행 상태 변화를 이벤트로 알림
    let wasRunning = false, execMode = false, idleN = 0;
    setInterval(() => {
      const r = machine.running;
      if (r && !wasRunning) emit('started', {});
      if (!r && wasRunning && !execMode) {
        if (machine.error) emit('error', { message: machine.error.message, detail: describeError() });
        emit('exit', { code: machine.exitInfo ? machine.exitInfo.code : null, error: !!machine.error });
      }
      if (execMode && !r && machine.error) { execMode = false; emit('error', { message: machine.error.message, detail: describeError() }); emit('exit', { code: null, error: true }); }
      else if (execMode && !r && !shell.waiting && !shell.queue.length && !shell.paused && wasRunning !== null) {
        if (wasRunning || ++idleN > 6) { execMode = false; idleN = 0; emit('exit', { code: machine.exitInfo ? machine.exitInfo.code : 0, error: false }); }
      }
      wasRunning = r;
    }, 150);

    const api = {
      version: VERSION, ready, machine, shutdown, exec, unlockAudio, setKeyRemap, keyRemap: null, loadFiles, loadZip, loadUrl, listPrograms, run, stop, pause, resume,
      setSpeed, setVolume, setUI, setKeep43, setMouse, focus, fullscreen, screenshot, reset, status, sendKey,
      on(f) { listeners.push(f); return () => { const i = listeners.indexOf(f); if (i >= 0) listeners.splice(i, 1); }; },
      _ready() { isReady = true; readyResolve(api); emit('ready', { version: VERSION }); },
    };
    return api;
  })();
  window.WebDos = WD;

  /* ---- postMessage 프로토콜 ----
   * 요청:  { webdos: 1, id, cmd, ...args }
   * 응답:  { webdos: 1, id, ok: true, result } | { webdos: 1, id, ok: false, error }
   * 이벤트(이 페이지 → 부모): { webdos: 1, event: 'ready'|'started'|'exit'|'error'|'files', ... }
   * 허용 출처는 ?origin=https://a.com,https://b.com 로 제한 가능(기본: 모두 허용)
   */
  const allowOrigins = (new URLSearchParams(location.search).get('origin') || '').split(',').map(s => s.trim()).filter(Boolean);
  const originOk = o => !allowOrigins.length || allowOrigins.includes(o);
  const parentTargets = new Set();
  WD.on((type, data) => {
    const msg = Object.assign({ webdos: 1, event: type }, data);
    if (window.parent !== window) { try { window.parent.postMessage(msg, allowOrigins.length === 1 ? allowOrigins[0] : '*'); } catch (e) { } }
  });
  const handlers = {
    ping: () => WD.status(),
    status: () => WD.status(),
    loadFiles: a => WD.loadFiles(a.files || [], a.options || {}),
    loadZip: a => WD.loadZip(a.data != null ? a.data : a.url, a.options || {}),
    loadUrl: a => WD.loadUrl(a.url, a.path, a.options || {}),
    // 한 번에: 파일 주입 + 실행  { files|zip|url, run, args }
    start: async a => {
      if (a.reset) WD.reset();
      if (a.files) await WD.loadFiles(a.files, a.options || {});
      if (a.zip != null) await WD.loadZip(a.zip, a.options || {});
      if (a.url) await WD.loadUrl(a.url, a.path, a.options || {});
      if (a.speed) WD.setSpeed(a.speed);
      if (a.volume != null) WD.setVolume(a.volume);
      return WD.run(a.run, a.args);
    },
    run: a => WD.run(a.path, a.args),
    exec: a => WD.exec(a.line),
    unlockAudio: () => WD.unlockAudio(),
    stop: () => WD.stop(), pause: () => WD.pause(), resume: () => WD.resume(), reset: () => WD.reset(),
    listPrograms: () => WD.listPrograms(),
    setSpeed: a => WD.setSpeed(a.value), setVolume: a => WD.setVolume(a.value),
    setUI: a => WD.setUI(!!a.value), setKeep43: a => WD.setKeep43(!!a.value), setMouse: a => WD.setMouse(!!a.value),
    focus: () => WD.focus(), fullscreen: () => WD.fullscreen(), screenshot: () => WD.screenshot(),
    sendKey: a => WD.sendKey(a.code, a.ms),
  };
  window.addEventListener('message', async e => {
    const d = e.data; if (!d || d.webdos !== 1 || !d.cmd) return;
    if (!originOk(e.origin)) return;
    const reply = o => { try { (e.source || window.parent).postMessage(Object.assign({ webdos: 1, id: d.id }, o), e.origin === 'null' ? '*' : e.origin); } catch (er) { } };
    const h = handlers[d.cmd];
    if (!h) { reply({ ok: false, error: '알 수 없는 명령: ' + d.cmd }); return; }
    try { await WD.ready; reply({ ok: true, result: await h(d) }); }
    catch (er) { reply({ ok: false, error: er && er.message || String(er) }); }
  });

  /* ---- URL 파라미터 ----
   *  ui=0        설정 버튼/힌트/키보드 배지 숨김(임베드 모드)
   *  zip=URL     ZIP 내려받아 불러옴 (CORS 허용 필요)      file=URL  개별 파일(여러 개: file=a&file=b)
   *  run=NAME    실행할 EXE/COM (비우고 autorun=1 이면 자동 선택)  args=...  명령줄 인수
   *  speed=MIPS  volume=0..100   keep43=1   mouse=0
   */
  async function applyParams() {
    const q = new URLSearchParams(location.search);
    if (q.get('ui') === '0' || q.get('embed') === '1') WD.setUI(false);
    if (q.has('speed')) WD.setSpeed(+q.get('speed'));
    if (q.has('volume')) WD.setVolume(+q.get('volume') / 100);
    if (q.get('keep43') === '1') WD.setKeep43(true);
    if (q.get('mouse') === '0') WD.setMouse(false);
    try {
      const persist = q.get('persist') === '1';
      if (q.has('zip')) await WD.loadZip(q.get('zip'), { persist });
      for (const u of q.getAll('file')) await WD.loadUrl(u, null, { persist });
      if (q.has('run') || q.get('autorun') === '1') WD.run(q.get('run') || '', q.get('args') || '');
    } catch (e) { setStatus('자동 실행 실패: ' + e.message, true); }
  }

  requestAnimationFrame(frame);
  (async () => { refreshPrograms(); shell.boot(); refreshSaves(); cv.focus(); WD._ready(); await applyParams(); })();
};
if (!window.__MOBILE__) window.__startUI(); // 모바일은 차단 (무시하고 접속 버튼으로 수동 시작)

<\/script>

            const loadSetting = k => { try { return localStorage.getItem('webdos.' + k); } catch (e) { return null; } };
            const countryToLang = cc => {
                cc = String(cc || '').toUpperCase();
                if (cc === 'KR') return 'kr';
                if (cc === 'JP') return 'jp';
                if (['CN', 'TW', 'HK', 'MO'].includes(cc)) return 'cn';
                return 'en';
            };
            async function fetchCountry() {
                const eps = [
                    ['https://api.country.is/', j => j.country],
                    ['https://ipapi.co/json/', j => j.country_code],
                    ['https://get.geojs.io/v1/ip/country.json', j => j.country]
                ];
                for (const [u, pick] of eps) {
                    try {
                        const ctl = new AbortController();
                        const t = setTimeout(() => ctl.abort(), 2500);
                        const r = await fetch(u, { signal: ctl.signal, cache: 'no-store' });
                        clearTimeout(t);
                        if (!r.ok) continue;
                        const cc = pick(await r.json());
                        if (cc) return cc;
                    } catch (e) {}
                }
                return null;
            }

            function diskSet(p){
                if(!IMG_RE.test(p) || /\.cue$/i.test(p)) return null;
                const dir=p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
                const m=p.slice(dir.length).match(NUM_RE);
                if(!m) return null;
                const pl=m[1].toLowerCase(), ql=m[3].toLowerCase(), dl=dir.toLowerCase();
                const grp=[];

                    if(rest.includes('/') || !IMG_RE.test(rest) || /\.cue$/i.test(rest)) continue;
                    const mm=rest.match(NUM_RE);
                    if(mm && mm[1].toLowerCase()===pl && mm[3].toLowerCase()===ql) grp.push({p:v.p,n:parseInt(mm[2],10)});

                if(/\.(iso|cue)$/i.test(p)) return {k:'cd'};
                if(n>2949120){
                    if(n>0x8006 && d[0x8001]===0x43 && d[0x8002]===0x44 && d[0x8003]===0x30 && d[0x8004]===0x30 && d[0x8005]===0x31) return {k:'cd'};
                    if(n>=512 && d[510]===0x55 && d[511]===0xAA){
                        for(let i=0;i<4;i++){
                            const o=446+16*i;
                            if(!d[o+4]) continue;
                            const heads=d[o+5]+1, sec=d[o+6]&0x3F;
                            if(heads>0 && sec>0){

                                if(cyl>0) return {k:'hd',h:heads,s:sec,c:cyl};

            // tier -> concrete values (user TUNE overrides win)
            function resolveProfile(pf){

                // never below CYC_MIN (games too slow). Fixed cycles = same game speed on every device.
                // 고정 사이클은 '원본 속도'에 가깝게: 386~486 초기 기종 수준(약 6000~10000)으로 제한한다.

                const CYC_MIN=6000, CYC_MAX=10000;
                const cyc=Math.min(CYC_MAX,Math.max(CYC_MIN,Math.round(pf.score*30/1000)*1000));

                if(/[a-z]/i.test(ch)) code='Key'+ch.toUpperCase();
                else if(/[0-9]/.test(ch)) code='Digit'+ch;
                else if(ch===' '){ code='Space'; kc=32; }
                else if(OTH[ch]){ kc=OTH[ch][0]; code=OTH[ch][1]; }
                if(up) padSend('keydown',...PK.Shift);
                padSend('keydown',ch,code,kc);
                setTimeout(()=>{ padSend('keyup',ch,code,kc); if(up) padSend('keyup',...PK.Shift); },60);
            }
            let padBuilt=false;
            function buildPad(){
                if(padBuilt) return; padBuilt=true;
                const pad=$('pad');
                // 아날로그 스틱 → 방향키 (대각선 지원)
                const st=document.createElement('div'); st.id='stick';
                const kn=document.createElement('div'); kn.id='knob'; st.appendChild(kn); pad.appendChild(st);
                // 스틱 중심/반지름은 손가락을 댄 순간에 한 번만 잡는다 (드래그 중 주소창·키보드로 화면이 움직여도 흔들리지 않게).
                // 방향은 각도로 8방향(대각선 포함) 판정하고, 놓거나 취소·포커스를 잃으면 모든 방향키를 반드시 뗀다.
                let sid=null, cx=0, cy=0, SR=85;
                const DIRS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
                const stickKeys=(l,r,u,d)=>{ (l?padDown:padUp)('ArrowLeft'); (r?padDown:padUp)('ArrowRight'); (u?padDown:padUp)('ArrowUp'); (d?padDown:padUp)('ArrowDown'); };
                const stickUpdate=e=>{
                    let dx=e.clientX-cx, dy=e.clientY-cy; const m=Math.hypot(dx,dy);
                    if(m>SR){ dx=dx*SR/m; dy=dy*SR/m; }
                    kn.style.transform='translate('+(dx*0.55)+'px,'+(dy*0.55)+'px)';
                    if(m<SR*0.28){ stickKeys(0,0,0,0); return; }   // 중앙 데드존
                    const c=dx/m, sn=dy/m, T=0.38;                   // sin 22.5° → 8방향
                    stickKeys(c<-T, c>T, sn<-T, sn>T);
                };
                const stickEnd=e=>{
                    if(e && e.pointerId!==undefined && sid!==null && e.pointerId!==sid) return;
                    sid=null; kn.style.transform=''; for(const n of DIRS) padUp(n);
                };
                st.addEventListener('pointerdown',e=>{
                    e.preventDefault(); if(sid!==null) stickEnd();
                    sid=e.pointerId; const r=st.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; SR=r.width/2;
                    try{ st.setPointerCapture(sid); }catch(_){}
                    stickUpdate(e);
                });
                st.addEventListener('pointermove',e=>{ if(e.pointerId===sid){ e.preventDefault(); stickUpdate(e); } });
                for(const ev of ['pointerup','pointercancel','lostpointercapture']) st.addEventListener(ev,stickEnd);
                window.addEventListener('pointerup',stickEnd); window.addEventListener('pointercancel',stickEnd);
                document.addEventListener('visibilitychange',()=>{ if(document.hidden) stickEnd(); });
                // 버튼
                const bw=document.createElement('div'); bw.id='btns'; pad.appendChild(bw);
                const kb=document.createElement('input'); kb.id='kb'; kb.autocomplete='off'; kb.autocapitalize='off'; kb.spellcheck=false; kb.setAttribute('enterkeyhint','enter'); document.body.appendChild(kb);
                const SENT='​';
                for(const n of ['Ctrl','Alt','Space','A','S','D','Enter','Esc','KEY']){
                    const b=document.createElement('div'); b.className='pb'; b.textContent=n==='KEY'?'⌨':n;
                    if(n==='KEY'){
                        b.addEventListener('click',()=>{ if(document.activeElement===kb){ kb.blur(); return; } kb.value=SENT; kb.focus(); });
                    } else {
                        let pid=null;
                        const end=e=>{ if(e.pointerId!==pid) return; pid=null; b.classList.remove('on'); padUp(n); };
                        b.addEventListener('pointerdown',e=>{ e.preventDefault(); pid=e.pointerId; try{b.setPointerCapture(pid);}catch(_){} b.classList.add('on'); padDown(n); });
                        b.addEventListener('pointerup',end); b.addEventListener('pointercancel',end);
                    }
                    bw.appendChild(b);
                }
                // 소프트 키보드: 입력된 글자를 게임에 키 입력으로 전달
                kb.addEventListener('input',()=>{
                    const v=kb.value;
                    if(!v.startsWith(SENT)||v.length<SENT.length){ padTap('Back'); }
                    else for(const ch of v.slice(SENT.length)) charTap(ch);
                    kb.value=SENT;
                });
                kb.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); padTap('Enter'); } else if(e.key==='Backspace'){ e.preventDefault(); padTap('Back'); } });
                $('padtg').onclick=()=>{ const off=$('pad').style.display!=='none'; $('pad').style.display=off?'none':'block'; if(off) padReleaseAll(); saveSetting('padoff',off?'1':''); };
            }
            function showPad(){
                if(!touchDev) return;
                buildPad();
                $('pad').style.display=loadSetting('padoff')?'none':'block';
                $('padtg').style.display='block';
            }
            function hidePad(){
                try{ $('coin').style.display='none'; }catch(e){}
                try{ padReleaseAll(); $('pad').style.display='none'; $('padtg').style.display='none'; const k=$('kb'); if(k) k.blur(); }catch(e){}
            }

            // ===== HTML 앱 실행 (EXE 처럼 전체화면 오버레이로 띄움, DOS 게임과 동일한 종료 방식) =====
            function launchHtml(path){
                const f=files.get(path.toLowerCase());
                if(!f) return out(tr('fileNotFound'),'err');
                padRemap=null; kbRemap=null; diskCount=0; diskIdx=1; gameTop=null;
                const host=document.createElement('div'); host.style.cssText='position:absolute;inset:0';
                $('dos').innerHTML=''; $('dos').appendChild(host);
                $('game').style.display='block'; $('sw').style.display='none';
                curGameId=null;
                manualExit=true; $('x').style.display='block';
                try{
                    let src=new TextDecoder('utf-8').decode(f.d);
                    // 같은 폴더의 상대 경로 리소스는 지원하지 않으므로 단일 파일 HTML 기준
                    const fr=document.createElement('iframe');
                    fr.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:#000';
                    fr.setAttribute('allow','autoplay; fullscreen; clipboard-write');

                    fr.onload=()=>{ try{
                        const w=fr.contentWindow;
                        w.addEventListener('keydown',ev=>{ if(manualExit&&ev.key==='End'&&$('game').style.display==='block'){ ev.preventDefault(); stopGame(); } },true);

                    fr.srcdoc=src;
                    host.appendChild(fr);

            }

            // ===== 게임 진행 저장 / 이어하기 (EmulatorJS 세이브 스테이트를 브라우저 IndexedDB 에 게임별로 저장) =====
            // 종료(END/EXIT)·탭 이탈 시 자동 저장, 다음 RUN 때 자동으로 이어서 시작 (TUNE resume=off 로 끔). SAVE / LOAD 버튼으로 수동 저장·불러오기.
            const bl=(en,kr)=>currentLang==='kr'?kr:en;
            let curGameId=null, curIsData=false, lastLaunch=null;   // curIsData: DOS 게임 → 에뮬레이터 스냅샷 대신 '게임이 만든 파일(세이브/설정/점수)'을 저장
            const svDB=()=>new Promise((ok,no)=>{ try{ const r=indexedDB.open('webdos-saves',1); r.onupgradeneeded=()=>r.result.createObjectStore('g',{keyPath:'id'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } });
            const svReq=(mode,fn)=>svDB().then(db=>new Promise((ok,no)=>{ const tx=db.transaction('g',mode); const rq=fn(tx.objectStore('g')); tx.oncomplete=()=>{ ok(rq&&rq.result); db.close(); }; tx.onerror=tx.onabort=()=>{ no(tx.error); db.close(); }; }));
            const svGet=async id=>{ try{ const v=await svReq('readonly',s=>s.get(id)); return v&&v.state&&v.state.length?v:null; }catch(e){ return null; } };
            const getGM=()=>{ if(typeof nativeSes!=='undefined'&&nativeSes&&gameFrame===nativeSes.fr) return nativeSes; try{ const w=gameFrame&&gameFrame.contentWindow; const em=w&&w.EJS_emulator; return (em&&em.gameManager)||null; }catch(e){ return null; } };
            let curStart=0;   // 에뮬레이터가 시작된 시각 (0 = 아직 시작 전)
            let saveQuiet=false, savingNow=false;   // 1분마다 하는 주기 저장은 터미널에 메시지를 남기지 않는다
            const sOut=(t,c)=>{ if(!saveQuiet) out(t,c); };
            async function saveGame(auto){
                const gm=getGM(), id=curGameId;
                if(!gm||!id||typeof gm.getState!=='function') return false;
                // 자동 저장은 시작 직후(로딩 화면/이어하기 복원 전)의 상태가 기존 저장을 덮어쓰지 않도록 15초 이후에만 한다
                if(auto && (!curStart || Date.now()-curStart<15000)) return false;
                try{
                    if(typeof gm.supportsStates==='function' && !gm.supportsStates()) throw new Error('core does not support save states');
                    const raw=gm.getState();
                    if(!raw||!raw.length) throw new Error('empty state');
                    const state=new Uint8Array(raw);   // 코어 메모리를 가리키는 뷰일 수 있으니 복사본을 저장
                    await svReq('readwrite',s=>s.put({id,t:Date.now(),state}));
                    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
                    sOut('  '+bl(auto?'Progress saved automatically':'Progress saved','진행 상황을 '+(auto?'자동 ':'')+'저장했습니다')+' ('+(state.length/1048576).toFixed(1)+' MB)','ok');
                    return true;
                }catch(e){ sOut('  '+bl('Save failed: ','저장 실패: ')+(e&&e.message||e),'err'); return false; }
            }
            async function loadGame(quiet){
                const gm=getGM(), id=curGameId;
                if(!gm||!id||typeof gm.loadState!=='function') return false;
                const rec=await svGet(id);
                if(!rec){ if(!quiet) out('  '+bl('No saved progress for this game.','이 게임의 저장된 진행 상황이 없습니다.'),'yellow'); return false; }
                try{
                    gm.loadState(new Uint8Array(rec.state));
                    out('  '+bl('Resumed from saved progress ','저장된 진행 상황에서 이어서 시작했습니다 ')+'('+new Date(rec.t).toLocaleString()+')','cyan');
                    return true;
                }catch(e){ out('  '+bl('Load failed: ','불러오기 실패: ')+(e&&e.message||e),'err'); return false; }
            }

            // ===== 게임 데이터 저장 (DOS) =====
            // 스냅샷(그 순간으로 되감기)이 아니라, 게임이 디스크에 쓴 파일(세이브·설정·점수 등)만 꺼내서 저장하고,
            // 다음 RUN 때 게임 파일 위에 그대로 덮어 넣어서 시작한다. 게임 안의 '이어하기/불러오기'를 그대로 쓸 수 있다.
            const dtDB=()=>new Promise((ok,no)=>{ try{ const r=indexedDB.open('webdos-gamedata',1); r.onupgradeneeded=()=>r.result.createObjectStore('d',{keyPath:'id'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } });
            const dtReq=(mode,fn)=>dtDB().then(db=>new Promise((ok,no)=>{ const tx=db.transaction('d',mode); const rq=fn(tx.objectStore('d')); tx.oncomplete=()=>{ ok(rq&&rq.result); db.close(); }; tx.onerror=tx.onabort=()=>{ no(tx.error); db.close(); }; }));
            const dtGet=async id=>{ try{ const v=await dtReq('readonly',s=>s.get(id)); return v&&v.data&&v.data.length?v:null; }catch(e){ return null; } };
            // 에뮬레이터에서 '게임이 디스크에 쓴 변경분'(DOSBox Pure 의 .save = zip)을 꺼낸다. 여러 경로를 순서대로 시도하고, 실패하면 이유(diag)를 돌려준다.
            // flush=true(게임을 끝낼 때만): DOSBox Pure 는 콘텐츠를 닫을 때 저장 파일을 쓰는 경우가 있어서, 먼저 에뮬레이터 종료를 요청한다.
            const logSave=m=>{ try{ const a=JSON.parse(loadSetting('savelog')||'[]'); a.push(new Date().toLocaleString()+'  '+m); while(a.length>16) a.shift(); saveSetting('savelog',JSON.stringify(a)); }catch(e){} };
            const saveSkip=new Set();   // 이미 확인한 '게임 번들' 같은 파일은 다시 읽지 않는다
            async function grabSaveZip(gm,flush){
                if(gm&&gm.__native) return grabNative(gm);
                const diag=[]; const isZip=b=>b&&b.length>=4&&b[0]===0x50&&b[1]===0x4B;
                const ejs=(()=>{ try{ return gameFrame.contentWindow.EJS_emulator; }catch(e){ return null; } })();
                const FS=gm.FS||(ejs&&ejs.Module&&ejs.Module.FS)||null;
                diag.push('getSaveFile='+typeof gm.getSaveFile+' FS='+(FS?'ok':'none'));
                if(flush){
                    try{
                        const q=(gm.functions&&typeof gm.functions.quit==='function')?()=>gm.functions.quit():(typeof gm.quit==='function'?()=>gm.quit():null);
                        diag.push('quit='+(q?'yes':'none'));
                        if(q){ q(); await sleep(600); }
                    }catch(e){ diag.push('quit: '+(e&&e.message||e)); }
                }
                try{ if(typeof gm.saveSaveFiles==='function') await gm.saveSaveFiles(); }catch(e){}
                // 1) 공식 경로 (.srm)
                for(const f of [()=>gm.getSaveFile(true),()=>gm.getSaveFile(false)]){
                    try{ const r=await f(); if(r&&r.length){ const b=new Uint8Array(r); if(isZip(b)) return {bytes:b,diag}; diag.push('getSaveFile: '+b.length+' bytes, not zip'); break; } else { diag.push('getSaveFile: empty'); break; } }catch(e){ diag.push('getSaveFile: '+(e&&e.message||e)); break; }
                }
                // 2) 파일 시스템에서 저장 파일처럼 보이는 *.srm / *.sav / *.save / *.zip 을 찾는다 (게임 번들 zip 은 dosbox.conf 가 들어 있으므로 제외)
                if(FS){
                    const found=[]; let nfiles=0;
                    const SKIP=/\/(bundle|shaders?|autoconfig|assets|overlays|cores|cheats|database|info|thumbnails|playlists|states|screenshots)(\/|$)/i;
                    const LIKE=/\.(srm|sav|save|zip)$/i;
                    const walk=(d,depth)=>{ if(depth>6||SKIP.test(d)) return; let ents; try{ ents=FS.readdir(d); }catch(e){ return; }
                        for(const n of ents){ if(n==='.'||n==='..') continue; const pth=(d==='/'?'':d)+'/'+n; let st; try{ st=FS.stat(pth); }catch(e){ continue; }
                            if(FS.isDir(st.mode)) walk(pth,depth+1); else { nfiles++; if(LIKE.test(n)) found.push({pth,size:st.size}); } } };
                    ['/data','/home','/saves','/tmp'].forEach(r=>walk(r,0));
                    try{ for(const n of FS.readdir('/')){ if(n==='.'||n==='..') continue; const pth='/'+n; let st; try{ st=FS.stat(pth); }catch(e){ continue; } if(!FS.isDir(st.mode)&&LIKE.test(n)) found.push({pth,size:st.size}); } }catch(e){}
                    diag.push('fs: '+(found.length?found.map(f=>f.pth+' ('+f.size+')').join(', '):'no save-like files')+' ['+nfiles+' files]');
                    for(const f of found.sort((a,b)=>b.size-a.size)){
                        const key=f.pth+':'+f.size; if(saveSkip.has(key)) continue;
                        let b; try{ b=new Uint8Array(FS.readFile(f.pth)); }catch(e){ continue; }
                        if(!isZip(b)){ saveSkip.add(key); continue; }
                        try{
                            const z=await JSZip.loadAsync(b);
                            if(Object.keys(z.files).some(n=>/^dosbox\.conf$/i.test(n))){ saveSkip.add(key); diag.push(f.pth+' = game bundle'); continue; }
                            return {bytes:b,diag};
                        }catch(e){ saveSkip.add(key); }
                    }
                }
                // 3) EmulatorJS 가 zip 을 풀어서 넘기면 DOSBox Pure 가 .pure.zip 을 만들지 않는다 (게임이 쓴 파일이 에뮬레이터 파일 시스템에 그대로 생김).
                //    이때는 번들의 원본과 비교해서 바뀌거나 새로 생긴 파일만 모은다.
                const orig=window.__bundleOrig;
                if(FS&&orig){
                    try{
                        const NOSCAN=/^\/(proc|dev|sys)(\/|$)|\/(bundle|shaders?|autoconfig|assets|overlays|cores|cheats|database|info|thumbnails|playlists|states|screenshots)(\/|$)/i;
                        let root=null;
                        const find=(d,depth)=>{ if(root||depth>7||NOSCAN.test(d)) return; let ents; try{ ents=FS.readdir(d); }catch(e){ return; }
                            for(const n of ents){ if(root) return; if(n==='.'||n==='..') continue; const pth=(d==='/'?'':d)+'/'+n; let st; try{ st=FS.stat(pth); }catch(e){ continue; }
                                if(FS.isDir(st.mode)) find(pth,depth+1); else if(/^dosbox\.conf$/i.test(n)){ root=d; return; } } };
                        find('/',0);
                        if(!root) diag.push('diff: game folder not found');
                        else{
                            const IGN=/^(dosbox\.conf|wdexit\.com|dosbox\.run|retroarch.*\.cfg|.*\.(state|srm|opt|pure\.zip))$/i;
                            const SYSDIR=/^(home|data|tmp|proc|dev|sys|etc|usr|bin|lib|lib64|var|mnt|run|root|boot|opt|srv|system|saves|states|shaders|assets|bundle)$/i;   // 게임 폴더가 '/' 일 때 에뮬레이터 내부 폴더는 건너뛴다
                            const changed=[]; let total=0;
                            const same=(a,b)=>{ if(a.length!==b.length) return false; if(a.length>262144) return true; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; };
                            const scan=(d,relp,depth)=>{ if(depth>8) return; let ents; try{ ents=FS.readdir(d); }catch(e){ return; }
                                for(const n of ents){ if(n==='.'||n==='..') continue; const pth=(d==='/'?'':d)+'/'+n, rp=relp?relp+'/'+n:n; let st; try{ st=FS.stat(pth); }catch(e){ continue; }
                                    if(FS.isDir(st.mode)){ if(depth===0&&root==='/'&&SYSDIR.test(n)) continue; scan(pth,rp,depth+1); continue; }
                                    if(IGN.test(n)) continue;
                                    total++;
                                    const o=orig.get(rp.toLowerCase());
                                    if(o&&o.length===st.size&&st.size>262144) continue;   // 큰 파일은 크기만 비교
                                    let b; try{ b=new Uint8Array(FS.readFile(pth)); }catch(e){ continue; }
                                    if(!o||!same(o,b)) changed.push({rp,b}); } };
                            scan(root,'',0);
                            diag.push('diff: root='+root+' files='+total+' changed='+changed.length+(changed.length?' ('+changed.slice(0,6).map(c=>c.rp).join(', ')+')':''));
                            if(changed.length){
                                const z=new JSZip(); for(const c of changed) z.file(c.rp,c.b,{binary:true});
                                return {bytes:await z.generateAsync({type:'uint8array',compression:'DEFLATE'}),diag};
                            }
                        }
                    }catch(e){ diag.push('diff: '+(e&&e.message||e)); }
                }
                return {bytes:null,diag};
            }
            async function saveData(auto,flush){
                const gm=getGM(), id=curGameId;
                if(!gm||!id||!curStart) return false;
                try{
                    const g=await grabSaveZip(gm,flush);
                    const none=()=>{ if(!saveQuiet) logSave('SAVE '+id+' : nothing found | '+g.diag.join(' | ')); sOut('  '+bl('No game data changes to save.','저장할 게임 데이터 변경이 없습니다.'),'yellow'); sOut('  [diag] '+g.diag.join(' | '),'yellow'); return false; };   // 종료할 때도 이유가 보이도록 auto 여부와 관계없이 출력 (1분 주기 저장만 조용히)
                    if(!g.bytes) return none();
                    const nu=g.bytes;
                    const ns=await JSZip.loadAsync(nu);
                    const names=Object.keys(ns.files).filter(n=>!ns.files[n].dir);
                    if(!names.length) return none();
                    const old=await dtGet(id);
                    let merged=ns;
                    if(old){   // 이전에 저장한 데이터 위에 이번 변경분을 합친다 (같은 파일이면 새 것이 이긴다)
                        merged=await JSZip.loadAsync(old.data);
                        const low=new Map(); merged.forEach(pth=>low.set(pth.toLowerCase(),pth));
                        for(const n of names){
                            const k=n.toLowerCase(); if(low.has(k)) merged.remove(low.get(k));
                            merged.file(n, await ns.file(n).async('uint8array'), {binary:true});
                        }
                    }
                    const data=await merged.generateAsync({type:'uint8array',compression:'DEFLATE'});
                    const cnt=merged.file(/./).length;
                    await dtReq('readwrite',s=>s.put({id,t:Date.now(),data,n:cnt}));

                if(diskCount>1 && $('game').style.display==='block' && e.ctrlKey && (e.key==='F4'||e.key===']')){
                    e.preventDefault(); e.stopPropagation(); swapDisk();
                }
            },true);

            // ===== 가상 디스크(업로드·편집·복사한 파일, 폴더 구조, 현재 위치)를 브라우저에 저장해 새로고침 후에도 이어서 사용 =====
            // a~z(c 제외) 한 글자 폴더는 위의 '폴더 캐시'가 따로 보관하므로 여기서는 제외한다.
            const vfDB=()=>new Promise((ok,no)=>{ try{ const r=indexedDB.open('webdos-vfs',1); r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'k'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } });
            const vfReq=(mode,fn)=>vfDB().then(db=>new Promise((ok,no)=>{ const tx=db.transaction('s',mode); const rq=fn(tx.objectStore('s')); tx.oncomplete=()=>{ ok(rq&&rq.result); db.close(); }; tx.onerror=tx.onabort=()=>{ no(tx.error); db.close(); }; }));
            const vfIsGame=k=>/^[abd-z](\/|$)/.test(k);
            let vfSig='', vfDirty=false, vfBusy=false;
            const vfSignature=()=>{
                let n=0, sz=0, h=0;
                for(const [k,v] of files){ if(vfIsGame(k)) continue; n++; sz+=v.d.length; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; }
                return n+':'+sz+':'+h+':'+[...dirs].filter(d=>d&&!vfIsGame(d)).sort().join('|');
            };
            async function vfSave(){
                if(vfBusy) return;
                const sig=vfSignature();
                if(!vfDirty && sig===vfSig) return;
                vfBusy=true;
                try{
                    const fl=[]; for(const [k,v] of files){ if(vfIsGame(k)) continue; fl.push([v.p,v.d]); }
                    const dl=[...dirs].filter(d=>d&&!vfIsGame(d));
                    await vfReq('readwrite',s=>s.put({k:'state',files:fl,dirs:dl,t:Date.now()}));
                    vfSig=sig; vfDirty=false;
                }catch(e){ dbg('vfs save failed: '+(e&&e.message||e)); }
                finally{ vfBusy=false; }
            }
            // 시작할 때 저장된 가상 디스크와 마지막 위치를 복원한다. (a~z 게임 폴더는 CD 를 입력할 때만 캐시에서 불러온다)
            async function vfRestore(){
                try{
                    const st=await vfReq('readonly',s=>s.get('state'));
                    if(st){
                        for(const d of (st.dirs||[])) dirs.add(d);
                        for(const [p,d] of (st.files||[])) addFile(p,d);
                        vfSig=vfSignature();
                    }
                    const sc=(loadSetting('cwd')||'').split('/').filter(Boolean);
                    if(sc.length){
                        const L=sc[0].toLowerCase();
                        if(/^[abd-z]$/.test(L)){
                            // 시작할 때는 a~z 게임 폴더를 캐시에서 자동으로 불러오지 않는다 (루트에서 시작). CD 를 입력해야 불러온다.
                        } else if(dirs.has(sc.join('/').toLowerCase())) cwd=sc;
                    }
                    return st?(st.files||[]).length:0;
                }catch(e){ return 0; }
            }
            cmds.vfs=function(a){
                return (async()=>{
                    if((a[0]||'').toLowerCase()==='clear'){
                        try{ await vfReq('readwrite',s=>s.clear()); }catch(e){}
                        vfSig=''; saveSetting('cwd','');
                        return out(bl('Saved virtual disk removed from this browser (current session is unchanged).','브라우저에 저장된 가상 디스크를 삭제했습니다 (현재 세션은 그대로입니다).'),'ok');
                    }
                    let n=0, sz=0; for(const [k,v] of files){ if(vfIsGame(k)) continue; n++; sz+=v.d.length; }
                    out(bl('Virtual disk is saved in this browser automatically: ','가상 디스크는 브라우저에 자동 저장됩니다: ')+n+bl(' file(s), ',' 개 파일, ')+(sz/1048576).toFixed(1)+' MB','cyan');
                    out(bl('  VFS CLEAR  removes the saved copy   |   FORMAT  wipes the disk (and the saved copy)','  VFS CLEAR  저장본 삭제   |   FORMAT  디스크를 지움 (저장본도 함께 갱신)'));
                })();
            };

            async function ingest(list){
                let n = 0;
                const cp = cwd.join('/'), pre = cp ? cp + '/' : '';
                
                const preparedItems = [];
                for (const f of list) {
                    if (/\.(zip|jsdos)$/i.test(f.name) && !f.webkitRelativePath) {
                        preparedItems.push({ type: 'archive', file: f });
                    } else {
                        const relPath = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
                        preparedItems.push({ type: 'file', file: f, path: relPath });
                    }
                }

                const filePaths = preparedItems.filter(i => i.type === 'file').map(i => i.path);
                const firstSlashIndexes = filePaths.map(p => p.indexOf('/'));
                const hasSubfolders = filePaths.length > 0 && firstSlashIndexes.every(idx => idx > 0);
                
                let rootFolderToStrip = null;
                if (hasSubfolders) {
                    const topFolders = new Set(filePaths.map(p => p.split('/')[0]));
                    if (topFolders.size === 1) {
                        rootFolderToStrip = [...topFolders][0];
                    }
                }

                if (rootFolderToStrip) {
                }

                const uploadedNames = [];

                for (const item of preparedItems) {
                    if (item.type === 'archive') {
                        const f = item.file;
                        const root = f.name.replace(/\.[^.]+$/,'');
                        try {
                            const z = await JSZip.loadAsync(f);
                            const ents = Object.values(z.files).filter(e => !e.dir && !/^__MACOSX\/|(^|\/)\.DS_Store$/.test(e.name));
                            const mtEnts = ents.filter(e => MT_RE.test(e.name));
                            if (mtEnts.length) {
                                for (const e of mtEnts) { mtTake(e.name, await e.async('uint8array')); out('  ' + e.name.split('/').pop().toUpperCase() + ' (MT-32 ROM)', 'ok'); n++; }
                                const mtOk=mtAutoEnable(); out(mtOk ? '  MT-32 ready and enabled (TUNE midi=default turns it off).' : '  Need both *_CONTROL.ROM and *_PCM.ROM.', mtOk ? 'cyan' : 'yellow');
                                if (mtEnts.length === ents.length) continue;
                            }
                            if (isRomZip(ents)) {
                                const tp = pre + f.name;
                                addFile(tp, new Uint8Array(await f.arrayBuffer()));
                                uploadedNames.push(tp);
                                n++;
                                out(`  ${f.name} (ROM)`, 'ok');
                                continue;
                            }
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            for (const e of ents) {
                                let nm = e.name;
                                if (strip) nm = nm.split('/').slice(1).join('/');
                                const targetPath = pre + (strip ? '' : root + '/') + nm;
                                addFile(targetPath, await e.async('uint8array'));
                                uploadedNames.push(targetPath);
                                n++;
                            }
                            out(`  ${f.name} → ${root}\\` + tr('zipUnpack'), 'ok');
                        } catch(e) {
                            out(f.name + ': ' + tr('zipFail'), 'err');
                        }
                    } else {
                        let finalPath = item.path;
                        if (rootFolderToStrip && finalPath.startsWith(rootFolderToStrip + '/')) {
                            finalPath = finalPath.slice(rootFolderToStrip.length + 1);
                        }
                        if (MT_RE.test(finalPath)) {
                            mtTake(finalPath, new Uint8Array(await item.file.arrayBuffer()));
                            out('  ' + finalPath.split('/').pop().toUpperCase() + ' (MT-32 ROM)', 'ok'); n++;
                            if (mtAutoEnable()) out('  MT-32 ready and enabled (TUNE midi=default turns it off).', 'cyan');
                            continue;
                        }
                        const targetPath = pre + finalPath;
                        addFile(targetPath, new Uint8Array(await item.file.arrayBuffer()));
                        uploadedNames.push(targetPath);
                        n++;
                    }
                }

                out(`${n}` + tr('uploadComplete'), 'ok');
                vfDirty = true; vfSave();

                if (uploadedNames.length > 0) {
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    uploadedNames.forEach(fn => out('  ' + fn.replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                }
            }


            // ================= LOAD : GitHub 폴더(a~z, c 제외)에서 게임 불러오기 =================

                },

                },
                cn: {
                    usage: '用法: LOAD A [-v]   (除 C 外的 A~Z)',
                    scan: '  正在搜索文件夹...', fetching: '  下载中...',
