    <meta name="google-site-verification" content="xjENZEcS7wwhbRYeovTgvsJRhXLjyZ6HD1A89KB16A0" />
    <!-- EmulatorJS(DOSBox Pure)는 스레드가 필요 → SharedArrayBuffer → 교차 출처 격리(COOP/COEP) 필요.
         정적 호스팅은 헤더를 못 바꾸므로 같은 폴더의 coi-serviceworker.js 가 대신 헤더를 붙인다(처음 한 번 자동 새로고침). -->
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.js"></script>
    <style>
        html, body { height: 100%; margin: 0; background: #000; }
        #t { height: 100%; overflow-y: auto; padding: 10px 14px; box-sizing: border-box; color: #aaa; font: 16px/1.3 "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; white-space: pre-wrap; word-break: break-all; }
        #t.drag { outline: 3px dashed #5f5; outline-offset: -6px; }
        #row { display: flex; }
        #in { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; caret-color: #fff; padding: 0; }
        .err { color: #f66; }
        .ok { color: #5f5; }
        .hi { color: #fff; }
        .cyan { color: #5ff; }
        .yellow { color: #ff5; }
        #game { display: none; position: fixed; inset: 0; background: #000; z-index: 9; }
        #dos { position: absolute; inset: 0; }
        #off { display: none; position: fixed; inset: 0; background: #000; z-index: 30; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #f90; font: 20px/1.6 "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; cursor: pointer; }
        #off-note { color: #777; font-size: 14px; margin-top: 18px; max-width: 80%; }
        #sw { display: none; position: absolute; top: 8px; right: 150px; z-index: 10; background: #05a; color: #fff; border: 0; padding: 6px 12px; font: 14px monospace; cursor: pointer; opacity: .85; }
        #x { position: absolute; top: 8px; right: 8px; z-index: 10; background: #a00; color: #fff; border: 0; padding: 6px 12px; font: 14px monospace; cursor: pointer; opacity: .85; }
        /* Editor Overlay Styles */
        #editor { display: none; position: fixed; inset: 20px; background: #000; border: 2px solid #5f5; z-index: 8; padding: 10px; flex-direction: column; box-sizing: border-box; }
        #editor-header { color: #5f5; font: bold 16px monospace; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #editor-textarea { flex: 1; background: #111; color: #fff; border: 1px solid #333; font: 15px monospace; padding: 8px; resize: none; outline: none; }
        #editor-footer { color: #777; font-size: 13px; margin-top: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div id="t">

            function diskSet(p){
                if(!IMG_RE.test(p) || /\.cue$/i.test(p)) return null;
                const dir=p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
                const m=p.slice(dir.length).match(NUM_RE);
                if(!m) return null;
                const pl=m[1].toLowerCase(), ql=m[3].toLowerCase(), dl=dir.toLowerCase();
                const grp=[];

                    if(rest.includes('/') || !IMG_RE.test(rest) || /\.cue$/i.test(rest)) continue;
                    const mm=rest.match(NUM_RE);
                    if(mm && mm[1].toLowerCase()===pl && mm[3].toLowerCase()===ql) grp.push({p:v.p,n:parseInt(mm[2],10)});

                const d=f?f.d:new Uint8Array(0), n=d.length;
                if(/\.(iso|cue)$/i.test(p)) return {k:'cd'};
                if(n>2949120){
                    if(n>0x8006 && d[0x8001]===0x43 && d[0x8002]===0x44 && d[0x8003]===0x30 && d[0x8004]===0x30 && d[0x8005]===0x31) return {k:'cd'};
                    if(n>=512 && d[510]===0x55 && d[511]===0xAA){
                        for(let i=0;i<4;i++){
                            const o=446+16*i;
                            if(!d[o+4]) continue;
                            const heads=d[o+5]+1, sec=d[o+6]&0x3F;
                            if(heads>0 && sec>0){
                                const cyl=Math.floor(n/(512*heads*sec));
                                if(cyl>0) return {k:'hd',h:heads,s:sec,c:cyl};
                            }
                        }
                    }
                    return {k:'cd'};
                }

                const cores=navigator.hardwareConcurrency||2, mem=navigator.deviceMemory||4;
                // score: raw speed, penalised for mobile / few cores / low memory
                let score=mops*(mobile?0.6:1)*(cores<4?0.8:1)*(mem<4?0.8:1);
                let tier=score>=300?'high':score>=120?'mid':'low';

            function resolveProfile(pf){

                // never below CYC_MIN (games too slow). Fixed cycles = same game speed on every device.
                // 고정 사이클은 '원본 속도'에 가깝게: 386~486 초기 기종 수준(약 6000~10000)으로 제한한다.
                // (예전 10000~30000 은 대부분의 게임이 원본보다 빠르게 돌았음. 더 느리거나 빠르게는 TUNE cycles=N)
                const CYC_MIN=6000, CYC_MAX=10000;
                const cyc=Math.min(CYC_MAX,Math.max(CYC_MIN,Math.round(pf.score*30/1000)*1000));
                // 오디오(mixer)는 js-dos 8 기본값(44100Hz / 1024 / 20ms)을 그대로 사용한다.
                // 기기별로 rate/blocksize/prebuffer 를 바꾸면 js-dos 의 오디오 큐와 어긋나
                // 소리가 늘어지거나 끊기고 음정이 이상해지므로 TUNE 으로 직접 지정할 때만 덮어쓴다.
                const T={
                    high:{cpu:'486'},
                    mid: {cpu:'486'},
                    low: {cpu:'486'}

                // 소리가 '높게' 들리는 원인: 에뮬레이터 샘플레이트(예: 44100)와 브라우저 오디오 장치(예: 48000)가 다르면
                // 재생 속도가 어긋나 음정이 올라간다. 그래서 rate 는 실제 AudioContext 값에 맞추고(매번 새로 측정),

                // 브라우저 AudioContext 를 같은 값으로 만들어(아래 forceAudioRate) 브라우저가 장치에 맞게 리샘플링하게 한다.
                return {cpu:T.cpu,cycles:'fixed '+cyc,rate:'44100',block:'1024',pre:'20'};

                            return launch(ex[0].p, ex.map(f=>f.p));
                        }
                    }
                    const arg=a.join(' ').replace(/^["']|["']$/g,'').trim();
                    if(!arg) return out(tr('runUsage'), 'err');
                    const hasExt=/\.[a-z0-9]{1,4}$/i.test(arg), exts=hasExt?['']:['.exe','.com','.bat','.img','.ima','.vfd','.dsk','.flp','.iso','.cue'];
                    let f=null; const p=resolve(arg);
                    for(const e of exts){ f=files.get(lc(p)+e); if(f) break; }

                        f=pick[0];
                    }
                    // HTML 앱을 EXE 인 척 실행: RUN typing.exe → typing.html (진짜 .exe 가 없을 때만)
                    if(!f){
                        const nm2=arg.split(/[\\/]/).pop().toLowerCase().replace(/\.(exe|com|bat)$/i,'');
                        const hh=[...files.values()].filter(v=>/\.html?$/i.test(v.p) && base(v.p).toLowerCase().replace(/\.html?$/i,'')===nm2);
                        const cur2=lc(cwd), near2=hh.filter(v=>par(v.p.toLowerCase()).startsWith(cur2));

                        if(pick2.length>1){ out(tr('multiFileMatch'), 'err'); pick2.forEach(v=>out('  RUN '+v.p.replace(/\//g,'\\'))); return; }
                        if(pick2.length===1) return launchHtml(pick2[0].p);
                    }
                    if(!f) return out(arg.toUpperCase()+': '+tr('fileNotFoundErr'), 'err');
                    if(/\.html?$/i.test(f.p)) return launchHtml(f.p);
                    if(!/\.(exe|com|bat)$/i.test(f.p) && !IMG_RE.test(f.p)) return out(tr('invFormat'), 'err');
                    launch(f.p, diskSet(f.p));
                }

                    out('TUNE midi=default|none  sb=sb16|sbpro2|sb1|none  opl=auto|opl2|opl3|none  oplemu=default|compat|fast|mame|nuked  core=auto|normal|dynamic|simple','hi');
                    out('TUNE CALIBRATE (re-measure this device)   TUNE RESET (back to auto)   [applies on next RUN]','hi');
                    return;
                }
                if(/^calibrate$/i.test(a[0])){
                    return calibrate(true).then(()=>{ out('Calibrated.','ok'); show(); });
                }
                if(/^reset$/i.test(a[0])){ Object.assign(tune,TUNE_DEF); saveSetting('tune',''); show(); return; }
                const ok={
                    cpu:v=>/^(auto|386|486|pentium|pentium_slow|pentium_mmx)$/i.test(v),
                    cycles:v=>/^(auto|max|\d+|fixed_\d+|auto_\d+(_limit_\d+)?)$/i.test(v),
                    rate:v=>v==='auto'||['8000','11025','16000','22050','32000','44100','48000'].includes(v),
                    block:v=>v==='auto'||['256','512','1024','2048','4096','8192'].includes(v),

                    plain:v=>/^(on|off)$/i.test(v)

            // 생성 시 sampleRate 를 에뮬레이터 rate 로 지정해, 장치와 다를 때는 브라우저가 리샘플링하도록 한다.

            let forcedRate=0, acInstalled=false;

                for(const c of liveAC){ try{ c.close(); }catch(e){} }

            function forceAudioRate(rate){
                if(!BaseAC) return;
                forcedRate=rate>0?rate:0;
                if(acInstalled) return;
                acInstalled=true;
                const C=class extends BaseAC{
                    constructor(o){
                        const opt=Object.assign({},o||{});
                        if(opt.sampleRate==null && forcedRate>0) opt.sampleRate=forcedRate;
                        try{ super(opt); }catch(e){ super(o); }
                        liveAC.add(this);
                        try{ if(this.state==='suspended') this.resume().catch(()=>{}); }catch(e){}
                    }
                };
                window.AudioContext=C; window.webkitAudioContext=C;
            }

                const confFinal = tune.plain==='on' ? conf.replace(/\[cpu\][\s\S]*?\[autoexec\]/,'[autoexec]') : conf;

            function sendKeyToGame(key, code, kc, mods){
                const d=gameDoc(); if(!d) return false;
                const win=d.defaultView;
                const target=d.querySelector('canvas')||d.body;
                for(const type of ['keydown','keyup']){
                    const ev=new win.KeyboardEvent(type,Object.assign({key,code,bubbles:true,cancelable:true},mods||{}));
                    for(const k of ['keyCode','which']) Object.defineProperty(ev,k,{get:()=>kc});

                    try{ d.dispatchEvent(ev.constructor===win.KeyboardEvent?new win.KeyboardEvent(type,Object.assign({key,code,bubbles:true},mods||{})):ev); }catch(e){}
                }
                return true;

            // 에뮬레이터가 디스크 교체 API 를 노출하면 그것을 먼저 쓰고, 없으면 Ctrl+F4 로 대체
            async function swapDisk(){
                if(diskCount<2 || $('game').style.display!=='block') return;
                const next=diskIdx>=diskCount?1:diskIdx+1;
                let done=false;
                try{
                    const w=gameFrame && gameFrame.contentWindow;
                    const em=w && w.EJS_emulator;
                    const fn=em && em.gameManager && em.gameManager.functions;
                    if(fn){
                        for(const name of ['setDiskIndex','setCurrentDisk','swapDisk','changeDisk']){
                            if(typeof fn[name]==='function'){ fn[name](next-1); done=true; break; }
                        }
                    }
                }catch(e){}
                if(!done){
                    // DOSBox 의 디스크 교체 단축키
                    sendKeyToGame('F4','F4',115,{ctrlKey:true});

            async function ingest(list){
                let n = 0; 
                const cp = cwd.join('/'), pre = cp ? cp + '/' : '';
                
                const preparedItems = [];
                for (const f of list) {
                    if (/\.(zip|jsdos)$/i.test(f.name) && !f.webkitRelativePath) {
                        preparedItems.push({ type: 'archive', file: f });
                    } else {
                        const relPath = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
                        preparedItems.push({ type: 'file', file: f, path: relPath });
                    }
                }

                const filePaths = preparedItems.filter(i => i.type === 'file').map(i => i.path);
                const firstSlashIndexes = filePaths.map(p => p.indexOf('/'));
                const hasSubfolders = filePaths.length > 0 && firstSlashIndexes.every(idx => idx > 0);
                
                let rootFolderToStrip = null;
                if (hasSubfolders) {
                    const topFolders = new Set(filePaths.map(p => p.split('/')[0]));
                    if (topFolders.size === 1) {
                        rootFolderToStrip = [...topFolders][0];
                    }
                }

                if (rootFolderToStrip) {
                }

                const uploadedNames = [];

                for (const item of preparedItems) {
                    if (item.type === 'archive') {
                        const f = item.file;
                        const root = f.name.replace(/\.[^.]+$/,'');
                        try {
                            const z = await JSZip.loadAsync(f);
                            const ents = Object.values(z.files).filter(e => !e.dir && !/^__MACOSX\/|(^|\/)\.DS_Store$/.test(e.name));
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            for (const e of ents) {
                                let nm = e.name;
                                if (strip) nm = nm.split('/').slice(1).join('/');
                                const targetPath = pre + (strip ? '' : root + '/') + nm;
                                addFile(targetPath, await e.async('uint8array'));
                                uploadedNames.push(targetPath);
                                n++;
                            }
                            out(`  ${f.name} → ${root}\\` + tr('zipUnpack'), 'ok');
                        } catch(e) {
                            out(f.name + ': ' + tr('zipFail'), 'err');
                        }
                    } else {
                        let finalPath = item.path;
                        if (rootFolderToStrip && finalPath.startsWith(rootFolderToStrip + '/')) {
                            finalPath = finalPath.slice(rootFolderToStrip.length + 1);
                        }
                        const targetPath = pre + finalPath;
                        addFile(targetPath, new Uint8Array(await item.file.arrayBuffer()));
                        uploadedNames.push(targetPath);
                        n++;
                    }
                }

                out(`${n}` + tr('uploadComplete'), 'ok');

                if (uploadedNames.length > 0) {
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    uploadedNames.forEach(fn => out('  ' + fn.replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                }
            }

            const lm = (k, ...a) => { const s = (LM[currentLang] && LM[currentLang][k]) || LM.en[k]; return typeof s === 'function' ? s(...a) : s; };
            const encPath = p => p.split('/').map(encodeURIComponent).join('/');

            // 커스텀 도메인/로컬에서 GitHub 자동 탐색을 쓰려면 'owner/repo' 를 적으세요 (github.io 에서는 비워도 됨)
            const GH_REPO = 'ktxsubway-bit/WebDos';

            setTimeout(() => { try { Object.keys(KNOWN).forEach(k => addDir(k)); } catch (e) {} }, 0);

            const getter = (dir, rel) => async () => {
                const tries = [U(dir + '/' + encPath(rel))];
                if (GH_REPO) for (const b of GH_BRANCHES.filter(x => x !== 'HEAD')) {
                    tries.push('https://raw.githubusercontent.com/' + GH_REPO + '/' + b + '/' + encPath(dir + '/' + rel));
                    tries.push('https://cdn.jsdelivr.net/gh/' + GH_REPO + '@' + b + '/' + encPath(dir + '/' + rel));
                }
                let last = 0;
                for (const u of tries) {
                    try {
                        const r = await fetch(u);
                        dbg('GET ' + u + ' → ' + r.status);
                        if (r.ok) return new Uint8Array(await r.arrayBuffer());
                        last = r.status;
                    } catch (e) { dbg('GET ' + u + ' → ' + (e.message || e)); }
                }
                throw new Error(rel + ' ' + last);
            };

            // 폴더 최상위의 zip/jsdos 는 풀어서 내용물로 교체
            async function expandZips(list) {
                const res = [];
                for (const it of list) {
                    if (!it.path.includes('/') && isZip(it.path)) {
                        try {
                            const z = await JSZip.loadAsync(await it.get());
                            const ents = Object.values(z.files).filter(e => !e.dir && !skipName(e.name));
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            dbg('unzip ' + it.path + ' (' + ents.length + ' files)');
                            for (const e of ents) res.push({ path: strip ? e.name.split('/').slice(1).join('/') : e.name, get: () => e.async('uint8array') });
                            continue;
                        } catch (e) { dbg('unzip failed: ' + it.path + ' ' + (e.message || e)); continue; }
                    }
                    res.push(it);
                }
                return res;
            }

            // 1) <폴더>/files.json
            async function srcManifest(dir) {
                try {
                    const r = await fetch(U(dir + '/files.json'), { cache: 'no-cache' });
                    dbg('GET ' + dir + '/files.json → ' + r.status);
                    if (!r.ok) return null;
                    const j = await r.json();
                    const arr = (Array.isArray(j) ? j : (j.files || [])).filter(x => typeof x === 'string' && !skipName(x));
                    return arr.length ? arr.map(x => ({ path: x, get: getter(dir, x) })) : null;
                } catch (e) { return null; }
            }

            // 2) 흔한 이름의 zip (game.zip / a.zip ...)
            async function srcZipNames(dir, L) {
                for (const nm of [...new Set((KNOWN[L] || []).flatMap(n => [n, n.normalize('NFC'), n.normalize('NFD')])), 'game.zip', 'game.jsdos', L + '.zip', L.toUpperCase() + '.zip', L + '.jsdos']) {
                    try {
                        const r = await fetch(U(dir + '/' + encPath(nm)), { cache: 'no-cache' });
                        dbg('GET ' + dir + '/' + nm + ' → ' + r.status);
                        if (r.ok) return [{ path: nm, get: getter(dir, nm) }];
                        if (GH_REPO && (KNOWN[L] || []).includes(nm)) {
                            const g = getter(dir, nm);
                            try { const data = await g(); return [{ path: nm, get: async () => data }]; } catch (e) {}
                        }
                    } catch (e) {}
                }
                return null;
            }

            // 3) 서버가 폴더 목록(디렉터리 인덱스)을 제공하는 경우 (로컬 서버 등)
            async function srcIndex(dir) {
                try {
                    const r = await fetch(U(dir + '/'), { cache: 'no-cache' });
                    dbg('GET ' + dir + '/ → ' + r.status);
                    if (!r.ok) return null;
                    const html = await r.text();
                    const names = [...html.matchAll(/href="([^"?#]+)"/gi)].map(m => decodeURIComponent(m[1]))
                        .filter(h => !h.startsWith('/') && !h.startsWith('..') && !/^[a-z]+:/i.test(h) && !h.endsWith('/') && !skipName(h));
                    return names.length ? names.map(x => ({ path: x, get: getter(dir, x) })) : null;
                } catch (e) { return null; }
            }

            // 4) GitHub API 로 폴더 자동 탐색 (zip 이름이 뭐든 상관없음)
            async function srcGithub(letter) {
                const h = location.hostname, segs = location.pathname.split('/').filter(Boolean);
                const isFile = x => /\.[a-z0-9]+$/i.test(x);
                const cands = [];
                if (GH_REPO) {
                    const [o, rp] = GH_REPO.split('/');
                    cands.push({ owner: o, repo: rp, rest: [] });
                } else if (/\.github\.io$/i.test(h)) {
                    const o = h.split('.')[0];
                    if (segs.length && !isFile(segs[0])) cands.push({ owner: o, repo: segs[0], rest: segs.slice(1) });
                    cands.push({ owner: o, repo: h, rest: segs });
                }
                for (const c of cands) {
                    const rest = c.rest.slice();
                    if (rest.length && isFile(rest[rest.length - 1])) rest.pop();
                    const prefix = rest.length ? rest.join('/') + '/' : '';
                    try {
                        let r = null;
                        for (const ref of GH_BRANCHES) {
                            r = await fetch('https://api.github.com/repos/' + c.owner + '/' + c.repo + '/git/trees/' + ref + '?recursive=1');
                            dbg('API ' + c.owner + '/' + c.repo + '@' + ref + ' → ' + r.status);
                            if (r.ok) break;
                        }
                        if (!r || !r.ok) { ghErr = r && r.status; continue; }
                        const j = await r.json();
                        const want = (prefix + letter + '/').toLowerCase();
                        const hits = (j.tree || []).filter(t => t.type === 'blob' && t.path.toLowerCase().startsWith(want) && !skipName(t.path));
                        dbg('folder match: ' + hits.length + ' file(s)');
                        if (!hits.length) continue;
                        const dir = hits[0].path.slice(prefix.length).split('/')[0];
                        return { dir, list: hits.map(t => { const rel = t.path.slice(prefix.length + dir.length + 1); return { path: rel, get: getter(dir, rel) }; }) };
                    } catch (e) { ghErr = e.message || e; dbg('API error: ' + ghErr); }
                }
                return null;
            }

            async function srcJsd(letter) {
                if (!GH_REPO) return null;
                for (const b of GH_BRANCHES.filter(x => x !== 'HEAD')) {
                    for (const u of ['https://data.jsdelivr.com/v1/packages/gh/' + GH_REPO + '@' + b + '?structure=flat',
                                     'https://data.jsdelivr.com/v1/package/gh/' + GH_REPO + '@' + b + '/flat']) {
                        try {
                            const r = await fetch(u);
                            dbg('LIST ' + u.split('/')[5] + '@' + b + ' → ' + r.status);
                            if (!r.ok) continue;
                            const j = await r.json();
                            const names = (j.files || []).map(f => String(f.name || f).replace(/^\//, '')).filter(x => !skipName(x));
                            const want = letter + '/';
                            const hits = names.filter(x => x.toLowerCase().startsWith(want));
                            dbg('folder match: ' + hits.length + ' file(s)');
                            if (!hits.length) continue;
                            const dir = hits[0].split('/')[0];
                            return { dir, list: hits.map(x => { const rel = x.slice(dir.length + 1); return { path: rel, get: getter(dir, rel) }; }) };
                        } catch (e) { dbg('LIST error: ' + (e.message || e)); }
                    }
                }
                return null;
            }

            // cd 로 a~z(c 제외) 폴더에 들어가면 아직 안 불러온 경우 자동으로 LOAD 실행
            function autoLoad() {
                const L = cwd.length ? String(cwd[0]).toLowerCase() : '';
                if (!/^[abd-z]$/.test(L) || loading || location.protocol === 'file:') return;
                for (const k of files.keys()) if (k.startsWith(L + '/')) return;
                return cmds.load([L]);
            }
            cmds.load = async function (a) {
                verbose = a.some(x => /^[-\/]v$/i.test(x));
                let L = (a.find(x => !/^[-\/]/.test(x)) || '').replace(/[:\\\/]+$/, '').toLowerCase();
                if (!L && cwd.length && /^[a-z]$/i.test(cwd[0])) L = cwd[0].toLowerCase();
                if (!L || !/^[a-z]$/.test(L)) return out(lm('usage'), 'err');
                if (L === 'c') return out(lm('reserved'), 'err');
                if (location.protocol === 'file:') return out(lm('local'), 'err');
                if (loading) return;
                loading = true; ghErr = null;
                try {
                    dbg('base: ' + pageBase());
                    let found = null;
                    for (const d of [L, L.toUpperCase()]) {            // 깃허브는 대소문자 구분 → 둘 다 시도
                        for (const src of [() => srcManifest(d), () => srcZipNames(d, L), () => srcIndex(d)]) {
                            let list = await src();
                            if (list) { list = await expandZips(list); if (list.length) { found = { dir: d, list }; break; } }
                        }
                        if (found) break;
                    }
                    if (!found) {
                        const g = (await srcGithub(L)) || (await srcJsd(L));
                        if (g) { const list = await expandZips(g.list); if (list.length) found = { dir: g.dir, list }; }
                    }
                    if (!found) {
                        if (ghErr) out(lm('ghErr', ghErr), 'err');
                        return out(lm('notFound', L), 'err');
                    }

                    for (const k of [...files.keys()]) if (k.startsWith(L + '/')) files.delete(k);

                    const list = found.list, total = list.length;
                    let idx = 0, done = 0, bytes = 0;
                    out('');
                    const bar = O.lastChild;
                    const worker = async () => {
                        while (idx < total) {
                            const it = list[idx++];
                            const data = await it.get();
                            addFile(L + '/' + it.path, data);
                            bytes += data.length; done++;
                            if (bar) bar.textContent = lm('progress', done, total);
                        }
                    };
                    await Promise.all(Array.from({ length: Math.min(6, total) }, worker));
                    if (bar) bar.remove();

                    out(total + tr('uploadComplete'), 'ok');
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    list.forEach(it => out('  ' + (L + '/' + it.path).replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                } catch (e) {
                    out('Error: ' + (e && e.message || e), 'err');
                } finally { loading = false; }
            };
            // =================================================================================

            $('fz').onchange=e=>{ingest([...e.target.files]);e.target.value=''};
            $('fd').onchange=e=>{ingest([...e.target.files]);e.target.value=''};

            T.ondragover=e=>{e.preventDefault();T.classList.add('drag')};
            T.ondragleave=()=>T.classList.remove('drag');
            T.ondrop=async e=>{
                e.preventDefault(); T.classList.remove('drag');
                const all=[];
                const walk=async(en,path)=>{
                    if(en.isFile) await new Promise(r=>en.file(f=>{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});all.push(f);r()}));
                    else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const c of b)await walk(c,path+en.name+'\/')}while(b.length)}
                };
                for(const it of e.dataTransfer.items){
                    const en=it.webkitGetAsEntry?.();
                    if(en?.isDirectory) await walk(en,'');
                    else if(en) await new Promise(r=>en.file(f=>{all.push(f);r()}))
                }
                ingest(all);
            };

            I.onkeydown=async e=>{
                if(e.key==='Enter'){
                    const l=I.value.trim();
                    out($('pr').textContent+I.value);
                    I.value='';
                    if(l){
                        hist.push(l); hi=hist.length;
                        const [c,...a]=l.split(/\s+/);
                        if(/^[a-z]:$/i.test(c) && !a.length){ const r=cmds.cd([c[0].toLowerCase()==='c' ? 'c:' : '\\'+c[0]]); if(r&&r.then){ I.disabled=true; try{ await r; }finally{ I.disabled=false; I.focus(); } } prompt(); T.scrollTop=T.scrollHeight; return; }
                        const fn=cmds[c.toLowerCase()];
                        if(fn){
                            const r=fn(a);
                            if(r&&typeof r.then==='function'&&(fn===cmds.ipconfig||fn===cmds.cd||fn===cmds.chdir||fn===cmds.pushd||fn===cmds.load)){ I.disabled=true; try{ await r; }finally{ I.disabled=false; I.focus(); } }
                        } else out("'"+c+"'"+tr('notCommand'),'err');
                    }
                    prompt(); T.scrollTop=T.scrollHeight;
                }else if(e.key==='ArrowUp'){
                    if(hi>0) I.value=hist[--hi];
                    e.preventDefault();
                }else if(e.key==='ArrowDown'){
                    I.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'');
                }else if(e.key==='Tab'){
                    e.preventDefault();
                    const val = I.value.trim().toLowerCase();
                    const cmdNames = Object.keys(cmds);
                    const match = cmdNames.find(c => c.startsWith(val));
                    if(match) I.value = match.toUpperCase() + ' ';
                }
            };

            window.addEventListener('keydown', async e => {
                if($('editor').style.display === 'flex') {
                    if(e.key === 'Escape') {
                        $('editor').style.display = 'none';
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    } else if((e.ctrlKey || e.metaKey) && e.key === 's') {
                        const content = new TextEncoder().encode($('editor-textarea').value);
                        files.set(editingFile.key, { p: editingFile.path, d: content });
                        $('editor').style.display = 'none';
                        out(tr('editorSaved') + editingFile.path, 'ok');
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    }
                } else if(e.key==='End' && $('game').style.display==='block') {
                    e.preventDefault(); e.stopPropagation();
                    await stopGame();
                }
            }, true);

            window.addEventListener('error', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.message || 'Script warning'), 'err');
                }
            });

            window.addEventListener('unhandledrejection', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.reason && e.reason.message || e.reason), 'err');
                }
            });

            ensureDos().catch(()=>{});
            T.onclick=()=>{if(!getSelection().toString() && $('editor').style.display !== 'flex')I.focus()};

            (async () => {
                await langReady;
                const sc = loadSetting('color');
                if (sc) T.style.color = sc;
                updateUIForLanguage();
                out(tr('intro1'),'hi');
                out(tr('intro2'));
                out('');
                prompt();
            })();
        })();
    </script>
