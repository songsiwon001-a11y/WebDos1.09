        #sw { display: none; position: absolute; top: 8px; right: 150px; z-index: 10; background: #05a; color: #fff; border: 0; padding: 6px 12px; font: 14px "NeoDunggeunmo Code", monospace; cursor: pointer; opacity: .85; }
        #x { display: none; position: absolute; top: 8px; right: 8px; z-index: 10; background: #a00; color: #fff; border: 0; padding: 6px 12px; font: 14px "NeoDunggeunmo Code", monospace; cursor: pointer; opacity: .85; }
        /* 모바일 터치 컨트롤 (키보드 이벤트로 변환) */
        #pad { display: none; position: absolute; inset: 0; z-index: 11; pointer-events: none; }
        #pad, #pad * { -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
        #stick { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; }
        #knob { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.5); }
        #btns { position: absolute; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, 62px); gap: 10px; pointer-events: none; }
        .pb { height: 58px; border-radius: 14px; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4); color: #fff; font: bold 14px "NeoDunggeunmo Code", monospace; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .pb.on { background: rgba(85,255,85,.55); }
        #kb { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
        #padtg { display: none; position: absolute; top: 8px; left: 8px; z-index: 12; background: #333; color: #fff; border: 0; padding: 6px 12px; font: 14px "NeoDunggeunmo Code", monospace; cursor: pointer; opacity: .85; }
        /* Editor Overlay Styles */
        #editor { display: none; position: fixed; inset: 20px; background: #000; border: 2px solid #5f5; z-index: 8; padding: 10px; flex-direction: column; box-sizing: border-box; }

                }

                            if (!e || !e.candidate) return finish();
                            const t = (e.candidate.candidate || '').split(' ');
                            const addr = t[4] || '', typ = t[7] || '';
                            if (/\.local$/i.test(addr)) { res.mdns = true; return; }

                // (예전 10000~30000 은 대부분의 게임이 원본보다 빠르게 돌았음. 더 느리거나 빠르게는 TUNE cycles=N)
                const CYC_MIN=6000, CYC_MAX=10000;

                const T={

                    for(const k of ['keyCode','which']) Object.defineProperty(ev,k,{get:()=>kc});

                    try{ d.dispatchEvent(ev.constructor===win.KeyboardEvent?new win.KeyboardEvent(type,Object.assign({key,code,bubbles:true},mods||{})):ev); }catch(e){}

            // 에뮬레이터가 디스크 교체 API 를 노출하면 그것을 먼저 쓰고, 없으면 Ctrl+F4 로 대체
            async function swapDisk(){
                if(diskCount<2 || $('game').style.display!=='block') return;
                const next=diskIdx>=diskCount?1:diskIdx+1;
                let done=false;
                try{
                    const w=gameFrame && gameFrame.contentWindow;
                    const em=w && w.EJS_emulator;
                    const fn=em && em.gameManager && em.gameManager.functions;
                    if(fn){
                        for(const name of ['setDiskIndex','setCurrentDisk','swapDisk','changeDisk']){
                            if(typeof fn[name]==='function'){ fn[name](next-1); done=true; break; }
                        }
                    }
                }catch(e){}
                if(!done){
                    // DOSBox 의 디스크 교체 단축키
                    sendKeyToGame('F4','F4',115,{ctrlKey:true});

            async function ingest(list){
                let n = 0; 
                const cp = cwd.join('/'), pre = cp ? cp + '/' : '';
                
                const preparedItems = [];
                for (const f of list) {
                    if (/\.(zip|jsdos)$/i.test(f.name) && !f.webkitRelativePath) {
                        preparedItems.push({ type: 'archive', file: f });
                    } else {
                        const relPath = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
                        preparedItems.push({ type: 'file', file: f, path: relPath });
                    }
                }

                const filePaths = preparedItems.filter(i => i.type === 'file').map(i => i.path);
                const firstSlashIndexes = filePaths.map(p => p.indexOf('/'));
                const hasSubfolders = filePaths.length > 0 && firstSlashIndexes.every(idx => idx > 0);
                
                let rootFolderToStrip = null;
                if (hasSubfolders) {
                    const topFolders = new Set(filePaths.map(p => p.split('/')[0]));
                    if (topFolders.size === 1) {
                        rootFolderToStrip = [...topFolders][0];
                    }
                }

                if (rootFolderToStrip) {
                }

                const uploadedNames = [];

                for (const item of preparedItems) {
                    if (item.type === 'archive') {
                        const f = item.file;
                        const root = f.name.replace(/\.[^.]+$/,'');
                        try {
                            const z = await JSZip.loadAsync(f);
                            const ents = Object.values(z.files).filter(e => !e.dir && !/^__MACOSX\/|(^|\/)\.DS_Store$/.test(e.name));
                            if (isRomZip(ents)) {
                                const tp = pre + f.name;
                                addFile(tp, new Uint8Array(await f.arrayBuffer()));
                                uploadedNames.push(tp);
                                n++;
                                out(`  ${f.name} (ROM)`, 'ok');
                                continue;
                            }
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            for (const e of ents) {
                                let nm = e.name;
                                if (strip) nm = nm.split('/').slice(1).join('/');
                                const targetPath = pre + (strip ? '' : root + '/') + nm;
                                addFile(targetPath, await e.async('uint8array'));
                                uploadedNames.push(targetPath);
                                n++;
                            }
                            out(`  ${f.name} → ${root}\\` + tr('zipUnpack'), 'ok');
                        } catch(e) {
                            out(f.name + ': ' + tr('zipFail'), 'err');
                        }
                    } else {
                        let finalPath = item.path;
                        if (rootFolderToStrip && finalPath.startsWith(rootFolderToStrip + '/')) {
                            finalPath = finalPath.slice(rootFolderToStrip.length + 1);
                        }
                        const targetPath = pre + finalPath;
                        addFile(targetPath, new Uint8Array(await item.file.arrayBuffer()));
                        uploadedNames.push(targetPath);
                        n++;
                    }
                }

                out(`${n}` + tr('uploadComplete'), 'ok');

                if (uploadedNames.length > 0) {
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    uploadedNames.forEach(fn => out('  ' + fn.replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                }
            }

                    notFound: d => '系统找不到指定的路径。',
                    ghErr: e => '网络错误 (' + e + ')。',
                    progress: (i, n) => '  下载中 ' + i + '/' + n,
                    done: (n, mb, d) => '已加载 ' + n + ' 个文件 (' + mb + ' MB) → ' + d.toUpperCase() + '\\',
                    noExe: '命令或文件名错误。',
                    pick: '找到多个程序。请用 RUN 运行以下之一:',
                    multi: n => '找到 ' + n + ' 个 zip 文件。请选择要加载的文件:',
                    choose: (n, all) => '请输入编号 (1-' + n + (all ? ', A = 全部' : '') + ', Q = 取消): ',
                    badChoice: n => '选择无效。请输入 1 到 ' + n + ' 之间的编号 (Q = 取消)。',
                    cancelled: '已取消加载。',
                    selected: nm => '已选择: ' + nm,
                    multiFile: n => '有 ' + n + ' 个文件匹配。请选择要运行的文件:'
                }
            };
            const lm = (k, ...a) => { const s = (LM[currentLang] && LM[currentLang][k]) || LM.en[k]; return typeof s === 'function' ? s(...a) : s; };
            const encPath = p => p.split('/').map(encodeURIComponent).join('/');
            const skipName = n => /(^|\/)(\.gitkeep|\.gitignore|\.DS_Store|Thumbs\.db)$/i.test(n) || /^__MACOSX\//.test(n);
            const isZip = n => /\.(zip|jsdos)$/i.test(n);
            // 커스텀 도메인/로컬에서 GitHub 자동 탐색을 쓰려면 'owner/repo' 를 적으세요 (github.io 에서는 비워도 됨)
            const GH_REPO = 'songsiwon001-a11y/WebDos1.09';
            const GH_BRANCHES = ['main', 'master', 'HEAD'];
            // 현재 주소(owner.github.io/<repo>/)에서 알아낸 저장소를 먼저, 그다음 GH_REPO 를 후보로 쓴다
            const ghRepos = () => {
                const r = [], segs = location.pathname.split('/').filter(Boolean);
                if (/\.github\.io$/i.test(location.hostname) && segs.length && (segs.length > 1 || !/\.html?$/i.test(segs[0]))) r.push(location.hostname.split('.')[0] + '/' + segs[0]);
                if (GH_REPO && !r.some(x => x.toLowerCase() === GH_REPO.toLowerCase())) r.push(GH_REPO);
                return r;
            };
            let loading = 0, ghErr = null, verbose = false;   // loading: 0 = 잠금 없음, 그 외 = 잠금을 건 시각(ms)
            const LOAD_LOCK_MS = 120000;                        // 이 시간이 지나면 멈춘 잠금으로 보고 무시
            // 자동 탐색에서 못 찾은 폴더: 같은 폴더를 연달아 cd 할 때만 잠깐(10초) 재검색을 막는다.
            // (예전에는 영구 차단이라, 네트워크가 한 번 느려서 실패하면 이후 cd 로는 다시 불러오지 못했다)
            const triedFolders = { m: new Map(), add(k) { this.m.set(k, Date.now()); }, delete(k) { this.m.delete(k); }, has(k) { const t = this.m.get(k); return !!t && Date.now() - t < 10000; } };
            const lockBusy = () => loading && Date.now() - loading < LOAD_LOCK_MS;
            const dbg = m => { if (verbose) out('  ' + m, 'yellow'); };
            const pageBase = () => {
                let pth = location.pathname;
                if (!pth.endsWith('/') && !/\.[a-z0-9]+$/i.test(pth.split('/').pop())) pth += '/';
                return location.origin + pth.replace(/[^\/]*$/, '');
            };
            const U = x => pageBase() + x;

            // ---- 네트워크 유틸 ----
            const fetchT = async (u, ms, opts) => {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), ms || 8000);
                try { return await fetch(u, Object.assign({ signal: ctl.signal }, opts || {})); }
                finally { clearTimeout(t); }
            };
            // 여러 비동기 탐색 중 '처음으로 성공(truthy)'한 결과를 반환 (모두 실패하면 null)
            const firstTruthy = ps => new Promise(res => {
                let n = ps.length;
                if (!n) return res(null);
                ps.forEach(p => Promise.resolve(p).then(v => { if (v) res(v); else if (--n === 0) res(null); }, () => { if (--n === 0) res(null); }));
            });
            let progCb = null;
            const readBody = async (r, name) => {
                if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
                const total = +r.headers.get('content-length') || 0;
                const rd = r.body.getReader(), chunks = [];
                let got = 0;
                for (;;) {
                    // 본문 수신이 20초 이상 멈추면 포기 (잠금이 영원히 남는 것 방지)
                    let tm;
                    const { done, value } = await Promise.race([
                        rd.read(),
                        new Promise((_, no) => { tm = setTimeout(() => no(new Error('download stalled: ' + name)), 20000); })
                    ]).catch(e => { try { rd.cancel(); } catch (_) {} throw e; }).finally(() => clearTimeout(tm));
                    if (done) break;
                    chunks.push(value); got += value.length;
                    if (progCb) progCb(name, got, total);
                }
                const buf = new Uint8Array(got);
                let o = 0;
                for (const c of chunks) { buf.set(c, o); o += c.length; }
                return buf;
            };

            const getter = (dir, rel) => async () => {
                const tries = [U(dir + '/' + encPath(rel))];
                for (const rp of ghRepos()) for (const b of GH_BRANCHES.filter(x => x !== 'HEAD')) {
                    tries.push('https://raw.githubusercontent.com/' + rp + '/' + b + '/' + encPath(dir + '/' + rel));
                    tries.push('https://cdn.jsdelivr.net/gh/' + rp + '@' + b + '/' + encPath(dir + '/' + rel));
                }
                let last = 0;
                for (const u of tries) {
                    try {
                        const r = await fetchT(u, 15000);
                        dbg('GET ' + u + ' → ' + r.status);
                        if (r.ok) return await readBody(r, rel);
                        last = r.status;
                    } catch (e) { dbg('GET ' + u + ' → ' + (e.message || e)); }
                }
                throw new Error(rel + ' ' + last);
            };

            // 폴더 최상위의 zip/jsdos 는 (병렬로) 풀어서 내용물로 교체 — zip 이름은 상관없음
            async function expandZips(list) {
                const parts = await Promise.all(list.map(async it => {
                    if (!it.path.includes('/') && isZip(it.path)) {
                        let buf = null;
                        try {
                            buf = await it.get();   // zip 은 한 번만 받는다 (롬 zip 이면 이 데이터를 그대로 쓴다)
                            const z = await JSZip.loadAsync(buf);
                            const ents = Object.values(z.files).filter(e => !e.dir && !skipName(e.name));
                            // 실행 파일(exe/com/bat)·디스크 이미지·HTML/JS 가 없으면 아케이드 롬 이미지: 안의 파일을 꺼내지 않고 zip 자체를 그대로 보관
                            if (isRomZip(ents)) { dbg('ROM zip kept as-is: ' + it.path); return [{ path: it.path, get: async () => buf }]; }
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            dbg('unzip ' + it.path + ' (' + ents.length + ' files)');
                            return ents.map(e => ({ path: strip ? e.name.split('/').slice(1).join('/') : e.name, get: () => e.async('uint8array') }));
                        } catch (e) { dbg('unzip failed: ' + it.path + ' ' + (e.message || e)); return buf ? [{ path: it.path, get: async () => buf }] : []; }
                    }
                    return [it];
                }));
                return parts.flat();
            }

            // 1) <폴더>/files.json (있으면 사용)
            async function srcManifest(dir) {
                try {
                    const r = await fetchT(U(dir + '/files.json'), 10000, { cache: 'no-cache' });
                    dbg('GET ' + dir + '/files.json → ' + r.status);
                    if (!r.ok) return null;
                    const j = await r.json();
                    const arr = (Array.isArray(j) ? j : (j.files || [])).filter(x => typeof x === 'string' && !skipName(x));
                    return arr.length ? { dir, list: arr.map(x => ({ path: x, get: getter(dir, x) })) } : null;
                } catch (e) { return null; }
            }

            // 2) 서버가 폴더 목록(디렉터리 인덱스)을 제공하는 경우 (로컬 서버 등)
            async function srcIndex(dir) {
                try {
                    const r = await fetchT(U(dir + '/'), 8000, { cache: 'no-cache' });
                    dbg('GET ' + dir + '/ → ' + r.status);
                    if (!r.ok) return null;
                    const html = await r.text();
                    const names = [...html.matchAll(/href="([^"?#]+)"/gi)].map(m => decodeURIComponent(m[1]))
                        .filter(h => !h.startsWith('/') && !h.startsWith('..') && !/^[a-z]+:/i.test(h) && !h.endsWith('/') && !skipName(h));
                    return names.length ? { dir, list: names.map(x => ({ path: x, get: getter(dir, x) })) } : null;
                } catch (e) { return null; }
            }

            // GitHub 저장소 후보: 현재 주소(owner.github.io/<repo>/...) + GH_REPO
            const ghCands = () => {
                const c = [], h = location.hostname, segs = location.pathname.split('/').filter(Boolean);
                if (/\.github\.io$/i.test(h) && segs.length && (segs.length > 1 || !/\.html?$/i.test(segs[0]))) {
                    const rest = segs.slice(1);
                    if (rest.length && /\.[a-z0-9]+$/i.test(rest[rest.length - 1])) rest.pop();
                    c.push({ repo: h.split('.')[0] + '/' + segs[0], prefix: rest.length ? rest.join('/') + '/' : '' });
                }
                if (GH_REPO && !c.some(x => x.repo.toLowerCase() === GH_REPO.toLowerCase())) c.push({ repo: GH_REPO, prefix: '' });
                return c;
            };
            const pickFolder = (names, c, letter) => {
                const want = (c.prefix + letter + '/').toLowerCase();
                const hits = names.filter(x => x.toLowerCase().startsWith(want));
                dbg('folder match: ' + hits.length + ' file(s)');
                if (!hits.length) return null;
                const dir = hits[0].slice(c.prefix.length).split('/')[0];
                return { dir, list: hits.map(x => { const rel = x.slice(c.prefix.length + dir.length + 1); return { path: rel, get: getter(dir, rel) }; }) };
            };

            // 3) GitHub API (트리 한 번에 조회, 브랜치/저장소 후보 병렬)
            async function srcGithub(letter) {
                const one = (c, ref) => (async () => {
                    const r = await fetchT('https://api.github.com/repos/' + c.repo + '/git/trees/' + ref + '?recursive=1', 10000);
                    dbg('API ' + c.repo + '@' + ref + ' → ' + r.status);
                    if (!r.ok) { ghErr = r.status; return null; }
                    const j = await r.json();
                    const names = (j.tree || []).filter(t => t.type === 'blob' && !skipName(t.path)).map(t => t.path);
                    return pickFolder(names, c, letter);
                })();
                const cands = ghCands();
                const hit = await firstTruthy(cands.flatMap(c => ['main', 'master'].map(ref => one(c, ref))));
                return hit || firstTruthy(cands.map(c => one(c, 'HEAD')));
            }

            // 4) jsDelivr 파일 목록 (CDN 이라 API 제한 없음)
            async function srcJsd(letter) {
                const one = (c, b) => (async () => {
                    const r = await fetchT('https://data.jsdelivr.com/v1/packages/gh/' + c.repo + '@' + b + '?structure=flat', 10000);
                    dbg('LIST ' + c.repo + '@' + b + ' → ' + r.status);
                    if (!r.ok) return null;
                    const j = await r.json();
                    const names = (j.files || []).map(f => String(f.name || f).replace(/^\//, '')).filter(x => !skipName(x));
                    return pickFolder(names, c, letter);
                })();
                return firstTruthy(ghCands().flatMap(c => ['main', 'master'].map(b => one(c, b))));
            }

            // 모든 탐색 방법을 동시에 시작해서 가장 먼저 폴더를 찾아낸 결과를 사용
            function discover(L) {
                const jobs = [];
                for (const d of [L, L.toUpperCase()]) { jobs.push(srcManifest(d)); jobs.push(srcIndex(d)); }
                jobs.push(srcGithub(L));
                jobs.push(srcJsd(L));
                return firstTruthy(jobs);
            }

            // cd 로 a~z(c 제외) 폴더에 들어가면 아직 안 불러온 경우 자동으로 LOAD 실행
            async function autoLoad() {
                const L = cwd.length ? String(cwd[0]).toLowerCase() : '';
                if (!/^[abd-z]$/.test(L) || location.protocol === 'file:') return;
                // 이미 불러온 폴더는 로딩 잠금과 상관없이 바로 통과
                const has = () => { for (const k of files.keys()) if (k.startsWith(L + '/')) return true; return false; };
                if (has() || triedFolders.has(L)) return;
                while (lockBusy()) await sleep(100);
                if (has()) return;   // 기다리는 동안 로드됐을 수 있음
                return cmds.load([L]);
            }
            // 사용자의 번호 입력을 기다린다. (LOAD 가 명령 대기열 안에서 돌고 있으므로 Enter 입력을 대기열 대신 여기로 직접 전달)
            let choiceResolver = null;
            // 반환: 번호(0부터) / -1 = 전체(allowAll) / null = 취소
            // 숫자가 아닌 다른 명령을 입력하면 선택을 취소하고 그 명령을 그대로 실행한다 (입력이 삼켜지지 않게)
            function askChoice(n, allowAll) {
                return new Promise(res => {
                    const ask = () => {
                        $('pr').textContent = lm('choose', n, allowAll);
                        choiceResolver = v => {
                            const t = String(v).trim();
                            if (/^(q|quit|cancel|0)$/i.test(t)) { $('pr').textContent = ''; res(null); return true; }
                            if (allowAll && /^(a|all)$/i.test(t)) { $('pr').textContent = ''; res(-1); return true; }
                            const k = /^\d+$/.test(t) ? parseInt(t, 10) : 0;
                            if (k >= 1 && k <= n) { $('pr').textContent = ''; res(k - 1); return true; }
                            if (t && !/^\d+$/.test(t)) { $('pr').textContent = ''; res(null); return false; }   // 다른 명령 → 취소 후 일반 명령으로 처리
                            out(lm('badChoice', n), 'err');
                            ask();
                            return true;
                        };
                        I.focus();
                    };
                    ask();
                });
            }
            cmds.load = async function (a) {
                verbose = a.some(x => /^[-\/]v$/i.test(x));
                const force = a.some(x => /^[-\/]f$/i.test(x));
                let L = (a.find(x => !/^[-\/]/.test(x)) || '').replace(/[:\\\/]+$/, '').toLowerCase();
                if (!L && cwd.length && /^[a-z]$/i.test(cwd[0])) L = cwd[0].toLowerCase();
                if (!L || !/^[a-z]$/.test(L)) return out(lm('usage'), 'err');
                if (L === 'c') return out(lm('reserved'), 'err');
                if (location.protocol === 'file:') return out(lm('local'), 'err');
                while (lockBusy()) await sleep(100);
                if (!force) { for (const k of files.keys()) if (k.startsWith(L + '/')) return out(lm('already'), 'yellow'); }
                let myLock = loading = Date.now(); ghErr = null;
                out('');
                let bar = O.lastChild;
                const st = t => { if (bar) bar.textContent = t; };
                const rm = () => { if (bar && bar.parentNode) bar.remove(); };
                try {
                    dbg('base: ' + pageBase());
                    st(lm('scan'));
                    let hit = await Promise.race([discover(L), new Promise(r => setTimeout(() => r(null), 25000))]);
                    if (!hit) { await sleep(400); hit = await Promise.race([discover(L), new Promise(r => setTimeout(() => r(null), 25000))]); }   // 한 번 더 시도
                    if (hit) hit.list = hit.list.filter(it => /\.(zip|jsdos|html?)$/i.test(it.path));   // zip/jsdos 와 HTML 앱만 받는다 (json 등 기타 파일 제외)
                    if (!hit || !hit.list.length) {
                        rm();
                        if (ghErr) out(lm('ghErr', ghErr), 'err');
                        else triedFolders.add(L);   // 네트워크 오류일 때는 막지 않고 다음 cd 에서 다시 시도
                        return out(lm('notFound', L), 'err');
                    }
                    // 최상위에 zip/jsdos 가 2개 이상이면 무엇을 불러올지 번호로 선택
                    const zipItems = hit.list.filter(it => !it.path.includes('/') && isZip(it.path));
                    if (zipItems.length >= 2) {
                        rm();
                        out(lm('multi', zipItems.length), 'hi');
                        zipItems.forEach((it, i) => out('  ' + (i + 1) + '. ' + it.path, 'cyan'));
                        const keep = setInterval(() => { if (loading === myLock) myLock = loading = Date.now(); }, 30000);   // 기다리는 동안 잠금이 풀리지 않게 갱신
                        let pick;
                        try { pick = await askChoice(zipItems.length, true); } finally { clearInterval(keep); }
                        if (pick === null) { return out(lm('cancelled'), 'yellow'); }
                        if (pick === -1) { out(lm('selected', 'ALL (' + zipItems.length + ')'), 'ok'); }
                        else {
                            const chosen = zipItems[pick];
                            out(lm('selected', chosen.path), 'ok');
                            hit.list = hit.list.filter(it => it === chosen || !zipItems.includes(it));
                        }
                        myLock = loading = Date.now();
                        out('');
                        bar = O.lastChild;
                    }
                    st(lm('fetching'));
                    progCb = (n, g, t) => st('  ' + n + '  ' + (g / 1048576).toFixed(1) + (t ? ' / ' + (t / 1048576).toFixed(1) : '') + ' MB');
                    const list = await expandZips(hit.list);
                    progCb = null;
                    if (!list.length) { rm(); triedFolders.add(L); return out(lm('notFound', L), 'err'); }

                    const total = list.length, fresh = [];
                    let idx = 0, done = 0;
                    const worker = async () => {
                        while (idx < total) {
                            const it = list[idx++];
                            const data = await it.get();
                            fresh.push([it.path, data]);
                            done++;
                            st(lm('progress', done, total));
                        }
                    };
                    await Promise.all(Array.from({ length: Math.min(6, total) }, worker));
                    for (const k of [...files.keys()]) if (k.startsWith(L + '/')) files.delete(k);
                    for (const [pp, d] of fresh) addFile(L + '/' + pp, d);
                    triedFolders.delete(L);
                    rm();

                    out(total + tr('uploadComplete'), 'ok');
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    list.forEach(it => out('  ' + (L + '/' + it.path).replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                } catch (e) {
                    rm();
                    out('Error: ' + (e && e.message || e), 'err');
                } finally { progCb = null; if (loading === myLock) loading = 0; }
            };
            // =================================================================================

            $('fz').onchange=e=>{ingest([...e.target.files]);e.target.value=''};
            $('fd').onchange=e=>{ingest([...e.target.files]);e.target.value=''};

            T.ondragover=e=>{e.preventDefault();T.classList.add('drag')};
            T.ondragleave=()=>T.classList.remove('drag');
            T.ondrop=async e=>{
                e.preventDefault(); T.classList.remove('drag');
                const all=[];
                const walk=async(en,path)=>{
                    if(en.isFile) await new Promise(r=>en.file(f=>{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});all.push(f);r()}));
                    else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const c of b)await walk(c,path+en.name+'\/')}while(b.length)}
                };
                for(const it of e.dataTransfer.items){
                    const en=it.webkitGetAsEntry?.();
                    if(en?.isDirectory) await walk(en,'');
                    else if(en) await new Promise(r=>en.file(f=>{all.push(f);r()}))
                }
                ingest(all);
            };

            // 명령은 입력창을 잠그지 않고 대기열(cmdChain)에 넣어 순서대로 실행한다.
            // (예전에는 CD/LOAD 가 끝날 때까지 입력창을 disabled 로 잠가서, 느린 기기에서 그 사이에 친 RUN 등이 사라졌다.)
            let cmdChain=Promise.resolve();
            // RUN 없이 파일명만 입력했을 때, 실행할 수 있는 파일(exe/com/bat/디스크 이미지/html)이 있는지 확인
            // 실행 가능한 파일 중 이름(경로를 적었으면 경로)에 입력한 글자가 포함된 것들
            function partialCands(arg){
                const q=String(arg).replace(/^["']|["']$/g,'').trim().toLowerCase().replace(/\\/g,'/');
                if(!/[a-z0-9\u00a1-\uffff]/i.test(q)) return [];
                const hasPath=q.includes('/');
                return [...files.values()].filter(v=>(/\.(exe|com|bat|zip|html?)$/i.test(v.p)||IMG_RE.test(v.p)) && (hasPath?v.p.toLowerCase():base(v.p).toLowerCase()).includes(q));
            }
            // 후보가 여러 개면 번호로 고르게 한다 (취소하면 null)
            async function chooseFile(cands){
                const list=[...cands].sort((x,y)=>x.p.toLowerCase()<y.p.toLowerCase()?-1:1);
                out(lm('multiFile', list.length), 'hi');
                list.forEach((v,i)=>out('  '+(i+1)+'. '+v.p.replace(/\//g,'\\'), 'cyan'));
                const k=await askChoice(list.length);
                if(k===null){ out(lm('cancelled'), 'yellow'); return null; }
                out(lm('selected', list[k].p.replace(/\//g,'\\')), 'ok');
                return list[k];
            }
            function runnableExists(arg){
                arg=String(arg).replace(/^["']|["']$/g,'').trim();
                if(!arg) return false;
                const hasExt=/\.[a-z0-9]{1,4}$/i.test(arg);
                const exts=hasExt?['']:['.exe','.com','.bat','.zip','.img','.ima','.vfd','.dsk','.flp','.iso','.cue'];
                const p=resolve(arg);
                for(const e of exts){ if(files.get(lc(p)+e)) return true; }
                const nm=arg.split(/[\\/]/).pop().toLowerCase();
                if([...files.values()].some(v=>exts.some(e=>base(v.p).toLowerCase()===nm+e))) return true;
                const nm2=nm.replace(/\.(exe|com|bat)$/i,'');
                if([...files.values()].some(v=>/\.html?$/i.test(v.p) && base(v.p).toLowerCase().replace(/\.html?$/i,'')===nm2)) return true;
                return partialCands(arg).length>0;
            }
            async function execLine(l){
                try{
                    const [c,...a]=l.split(/\s+/);
                    if(/^[a-z]:$/i.test(c) && !a.length){
                        const r=cmds.cd([c[0].toLowerCase()==='c' ? 'c:' : '\\'+c[0]]);
                        if(r&&typeof r.then==='function') await r;
                    } else {
                        const fn=Object.prototype.hasOwnProperty.call(cmds,c.toLowerCase()) ? cmds[c.toLowerCase()] : null;
                        if(fn){
                            const r=fn(a);
                            if(r&&typeof r.then==='function') await r;
                        } else if(runnableExists(c)){
                            // 내부 명령이 아니고 실행 가능한 파일이 있으면 RUN 없이 파일명만으로 실행
                            const r=cmds.run([c,...a]);
                            if(r&&typeof r.then==='function') await r;
                        } else out("'"+c+"'"+tr('notCommand'),'err');
                    }
                }catch(e){ out('Error: '+(e&&e.message||e),'err'); }
                prompt(); T.scrollTop=T.scrollHeight;
            }
            I.onkeydown=e=>{
                if(e.key==='Enter'){
                    const l=I.value.trim();
                    out($('pr').textContent+I.value);
                    I.value='';
                    if(choiceResolver){ const r=choiceResolver; choiceResolver=null; if(r(l)) return; }
                    if(l){
                        hist.push(l); hi=hist.length;
                        cmdChain=cmdChain.then(()=>execLine(l));
                    } else { prompt(); T.scrollTop=T.scrollHeight; }
                }else if(e.key==='ArrowUp'){
                    if(hi>0) I.value=hist[--hi];
                    e.preventDefault();
                }else if(e.key==='ArrowDown'){
                    I.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'');
                }else if(e.key==='Tab'){
                    e.preventDefault();
                    const val = I.value.trim().toLowerCase();
                    const cmdNames = Object.keys(cmds);
                    const match = cmdNames.find(c => c.startsWith(val));
                    if(match) I.value = match.toUpperCase() + ' ';
                }
            };

            window.addEventListener('keydown', async e => {
                if($('editor').style.display === 'flex') {
                    if(e.key === 'Escape') {
                        $('editor').style.display = 'none';
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    } else if((e.ctrlKey || e.metaKey) && e.key === 's') {
                        const content = new TextEncoder().encode($('editor-textarea').value);
                        files.set(editingFile.key, { p: editingFile.path, d: content });
                        $('editor').style.display = 'none';
                        out(tr('editorSaved') + editingFile.path, 'ok');
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    }
                } else if(manualExit && e.key==='End' && $('game').style.display==='block') {
                    e.preventDefault(); e.stopPropagation();
                    await stopGame();
                }
            }, true);

            window.addEventListener('error', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.message || 'Script warning'), 'err');
                }
            });

            window.addEventListener('unhandledrejection', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.reason && e.reason.message || e.reason), 'err');
                }
            });

            ensureDos().catch(()=>{});
            T.onclick=()=>{if(!getSelection().toString() && $('editor').style.display !== 'flex')I.focus()};

            (async () => {
                await langReady;
                const sc = loadSetting('color');
                if (sc) T.style.color = sc;
                updateUIForLanguage();
                out(tr('intro1'),'hi');
                out(tr('intro2'));
                out('');
                prompt();
            })();
        })();
    </script>
