/* =========================================================
   FIGHTER OF STREET   -  단일 파일 2D 대전 격투 게임 (외부 파일 없음)
   1P : I J K L 이동(점프/왼쪽/앉기/오른쪽)  A 펀치  S 킥  D 장풍
   2P : 방향키 이동                           [ 펀치  ] 킥  \(₩) 장풍
   ========================================================= */
/* =========================================================
   ★ 메뉴 음악 (오프닝 · 타이틀 · 캐릭터 선택 · 첫 라운드 로딩)
   ★ 아래 MUSIC_B64 의 따옴표 '' 사이에 base64 문자열만 붙여넣으세요.
     (data:audio/mpeg;base64, 같은 앞부분은 빼고 순수 base64 만!)
   ★ mp3 가 아니면 MUSIC_MIME 을 바꾸세요 (예: 'audio/ogg', 'audio/wav')
   ★ 비워두면 이 화면들은 무음입니다. (내장 합성 음악은 실제 전투 중에만 나옵니다)
   ========================================================= */
const MUSIC_MIME='audio/ogg';
const MUSIC_B64=''
/* ========================================================= */
const HAS_BGM=MUSIC_B64.trim().length>0;
let bgm=null,bgmStarted=false,bgmVol=0;
// 이 화면들에서만 재생 (실제 전투 시작되면 페이드아웃)
function bgmPhase(){return phase==='splash'||phase==='opening'||phase==='title'||phase==='select'||phase==='vs'||phase==='loading'||(phase==='intro'&&round===1);}
function syncBGM(){
  if(!HAS_BGM||!bgmStarted)return;
  if(!bgm){bgm=new Audio('data:'+MUSIC_MIME+';base64,'+MUSIC_B64.trim());bgm.loop=true;bgm.preload='auto';bgm.onerror=()=>console.error('MUSIC_B64 재생 실패: base64 또는 MUSIC_MIME 을 확인하세요');}
  bgm.muted=muted;
  if(bgmPhase()){
    if(bgm.paused){const p=bgm.play();if(p&&p.catch)p.catch(()=>{});}
    bgmVol=Math.min(1,bgmVol+.05);
  }else if(!bgm.paused){
    bgmVol=Math.max(0,bgmVol-.04);
    if(bgmVol<=0)bgm.pause();
  }
  bgm.volume=bgmVol;
}
const W=480,H=270,GY=232,GRAV=.46;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
// 터치(모바일) 기기에서만 전용 조작을 표시
const IS_TOUCH=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window&&(navigator.maxTouchPoints||0)>0);
const rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- 입력 ---------------- */
const KEYMAP={
 KeyJ:[0,'l'],KeyL:[0,'r'],KeyI:[0,'u'],KeyK:[0,'d'],KeyA:[0,'a'],KeyS:[0,'b'],KeyD:[0,'c'],
 ArrowLeft:[1,'l'],ArrowRight:[1,'r'],ArrowUp:[1,'u'],ArrowDown:[1,'d'],
 BracketLeft:[1,'a'],BracketRight:[1,'b'],Backslash:[1,'c'],IntlYen:[1,'c'],IntlBackslash:[1,'c']
};
const held=[{},{}];let press=[{},{}];
let paused=false,phase='splash',anyKey=false;
addEventListener('keydown',e=>{
  const m=KEYMAP[e.code];
  if(m||['Space','Enter','Escape','KeyP','KeyM'].includes(e.code))e.preventDefault();
  ainit();
  if(e.repeat)return;
  anyKey=true;
  if(m){held[m[0]][m[1]]=true;press[m[0]][m[1]]=true;}
  if(e.code==='Enter'&&phase!=='fight'&&phase!=='intro'&&phase!=='roundend')press[0].a=true;
  cheatBuf.push(e.code);if(cheatBuf.length>3)cheatBuf.shift();
  if(phase==='select'&&cheatBuf.join()==='KeyI,KeyL,KeyM'){cheatOn=true;cheatBuf.length=0;toastMsg='CHEAT ON : BOSS UNLOCKED';toastT=150;sfx('ok');return;}
  if(e.code==='KeyM')muted=!muted;
  if(e.code==='KeyP'&&['fight','intro','roundend'].includes(phase))paused=!paused;
  if(e.code==='Escape'){if(phase==='select'||phase==='vs'||phase==='loading'||phase==='matchend'||phase==='ending'||paused){paused=false;phase='title';}else if(['fight','intro','roundend'].includes(phase)){paused=!paused;}}
});
addEventListener('keyup',e=>{const m=KEYMAP[e.code];if(m)held[m[0]][m[1]]=false;});
addEventListener('blur',()=>{held[0]={};held[1]={};});
addEventListener('pointerdown',()=>{anyKey=true;ainit();});

/* ---------------- 사운드 (WebAudio 합성) ---------------- */
let AC=null,master=null,muted=false,nbuf=null,bgmOn=false,bstep=0,musicMode='none';
function ainit(){
  bgmStarted=true;syncBGM();
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    startBGM();
  }catch(e){AC=null;}
}
function tone(f1,f2,d,type,v,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,fq,delay){
  if(!AC||muted)return;
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=rnd()*2-1;}
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf;f.type='lowpass';f.frequency.value=fq||1200;
  g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);
}
const SFX={
  swing:()=>noise(.07,.1,3500),
  punch:()=>{noise(.1,.4,1800);tone(220,70,.1,'square',.2);},
  kick:()=>{noise(.14,.5,1200);tone(160,45,.15,'square',.25);},
  block:()=>{tone(520,300,.06,'square',.14);noise(.05,.2,4000);},
  fire:()=>{tone(180,900,.3,'sawtooth',.14);noise(.25,.1,2500);},
  tele:()=>{tone(1400,180,.2,'sine',.16);noise(.12,.12,5000);},
  jump:()=>tone(260,520,.12,'triangle',.15),
  land:()=>noise(.06,.15,600),
  ko:()=>{tone(500,40,.9,'sawtooth',.22);noise(.5,.4,900);},
  beep:()=>tone(660,660,.12,'square',.14),
  go:()=>{tone(440,880,.3,'square',.18);},
  sel:()=>tone(880,880,.05,'square',.1),
  ok:()=>{tone(523,523,.08,'square',.14);tone(784,784,.12,'square',.14,.08);},
  win:()=>{[523,659,784,1047].forEach((n,i)=>tone(n,n,.18,'square',.14,i*.13));}
};
function sfx(n){if(SFX[n])SFX[n]();}
function startBGM(){
  if(bgmOn)return;bgmOn=true;
  const N=n=>440*Math.pow(2,(n-69)/12);
  const bassP=[33,33,36,33,38,38,36,31];
  const leadP=[69,0,72,0,76,72,0,69,67,0,71,0,74,71,0,67];
  setInterval(()=>{
    if(!AC||muted||paused||musicMode!=='normal'||bgmPhase())return;
    const i=bstep++%16;
    if(i%2===0){const b=N(bassP[(i>>1)%8]+12);tone(b,b,.13,'triangle',.16);}
    const l=leadP[i];if(l)tone(N(l),N(l),.11,'square',.04);
    if(i%4===0)noise(.05,.12,300);
    if(i%4===2)noise(.03,.08,6000);
  },140);
}

/* ---------------- 캐릭터 (모두 오리지널) ---------------- */
/* 캐릭터 능력치: spd 이동속도, pow 공격력 배율, hp 체력 배율(x100), sc 크기, proj 장풍(속도 sp / 데미지 dmg / 크기 r)
 * ★ 캐릭터 추가 방법: 아래 목록에 {...} 한 덩어리를 복사해서 넣으면 끝 (선택 화면은 최대 8명까지 표시)

 *   map       : 남한 지도 위 국기 위치 [x,y] (화면 480x270 기준, 비우면 지도에 안 나옴)
 *   win / lose: 이겼을 때 / 졌을 때 대사 (없으면 기본 대사)
 *   boss:1    : 보스 (CPU 대전에서 맨 마지막에 등장)
 */
const CH=[
 {name:'최선율',en:'Choi Seon Yul',
  nation:'KOREA',flag:'kr',city:'부산',map:[270,118],win:'불꽃처럼 타올랐지? 아직 시작도 안 했어!',lose:'윽... 불꽃이 꺼지다니...',
  gi:'#d23a2a',belt:'#222',skin:'#e2a273',hair:'#7a1b12',band:null,glove:'#fc3',shoe:'#3a1a10',spd:1.0,pow:1.15,hp:1,sc:1,
  proj:{col:'#fa3',r:8,sp:3.2,dmg:13},alt:{gi:'#e8e8e8',glove:'#d23',band:null},desc:'화염 장풍'},
 {name:'가오니니',en:'Gaonini',
  nation:'KOREA',flag:'kr',city:'강릉',map:[266,62],win:'내 속도를 따라올 수 있겠어?',lose:'너무 빨랐나... 아니, 네가 더 빨랐어...',
  gi:'#2fa05a',belt:'#ffe88a',skin:'#f4d3a8',hair:'#f2d04a',band:'#fff',glove:'#fff',shoe:'#fff',spd:1.4,pow:.88,hp:.9,sc:.97,
  proj:{col:'#8f8',r:5,sp:5,dmg:9},alt:{gi:'#e060a0',glove:'#fff',band:'#fd5'},desc:'스피드형'},
 {name:'김하준',en:'Kim Ha Joon',
  nation:'KOREA',flag:'kr',city:'서울',map:[224,60],win:'힘이 전부는 아니지만... 이번엔 전부였네.',lose:'으윽... 다음엔 내가 이긴다...',
  gi:'#6a4a9a',belt:'#fc0',skin:'#8f5f3f',hair:'#111',band:null,glove:'#555',shoe:'#222',spd:.88,pow:1.3,hp:1.2,sc:1.1,
  proj:{col:'#c6f',r:10,sp:2.6,dmg:15},alt:{gi:'#555',glove:'#c33',band:null},desc:'파워형'},
 {name:'백균이',en:'Baek Gyun I',
  nation:'KOREA',flag:'kr',city:'대전',map:[236,98],win:'이게 바로 보스의 실력이다!',lose:'내가... 지다니... 믿을 수 없어...',
  gi:'#2f6fe0',belt:'#f4f4f4',skin:'#f1c27d',hair:'#1a1a22',band:'#e33',glove:'#e33',shoe:'#222',spd:1.5,pow:1.6,hp:2.2,sc:1.12,
  proj:{col:'#5cf',r:12,sp:6,dmg:22},alt:{gi:'#22b8a8',glove:'#fc3',band:'#fff'},desc:'보스 · 최강',boss:1},
 {name:'개코원숭이',en:'Baboon',
  nation:'KOREA',flag:'kr',city:'제주',map:[214,155],win:'우끼끼! 내가 이겼다!',lose:'우끼... 바나나... 먹고 올게...',
  gi:'#6b4a2a',belt:'#d22',skin:'#b0643a',hair:'#3a2616',band:'#d22',glove:'#d22',shoe:'#2a1a10',spd:1.5,pow:1.6,hp:2.2,sc:1.12,
  proj:{col:'#f54',r:12,sp:6,dmg:22},alt:{gi:'#333',glove:'#fc3',band:'#fc3'},desc:'보스 · 최강',boss:1},
 {name:'권도짱',en:'Kwon Do Jjang',
  nation:'KOREA',flag:'kr',city:'광주',map:[221,119],win:'발차기는 거짓말을 하지 않는 법!',lose:'도복이 찢어졌다... 다시 수련이다!',
  gi:'#f6f6f6',belt:'#111',skin:'#f1c27d',hair:'#111',band:'#111',glove:'#222',shoe:'#111',spd:1.5,pow:1.6,hp:2.2,sc:1.12,
  proj:{col:'#ffe040',r:12,sp:6,dmg:22},alt:{gi:'#222',glove:'#f33',band:'#f33'},desc:'보스 · 최강',boss:1}
];
CH.sort((a,b)=>(a.boss?1:0)-(b.boss?1:0)); /* 보스(boss:1)는 항상 맨 뒤에, 적은 순서대로 */
const MV={
 punch :{su:3,ac:3,re:8 ,dmg:6 ,reach:36,y:[-64,-42],stun:14,kb:1.6,snd:'punch'},
 kick  :{su:5,ac:4,re:12,dmg:10,reach:42,y:[-58,-28],stun:18,kb:2.6,snd:'kick'},
 cpunch:{su:3,ac:3,re:8 ,dmg:5 ,reach:34,y:[-42,-22],stun:13,kb:1.4,snd:'punch'},
 ckick :{su:6,ac:4,re:16,dmg:9 ,reach:42,y:[-14,0]  ,stun:20,kb:3,low:1,knock:1,snd:'kick'},
 jp    :{air:1,su:0,ac:99,re:0,dmg:7 ,reach:32,y:[-58,-22],stun:16,kb:2,over:1,snd:'punch'},
 jk    :{air:1,su:0,ac:99,re:0,dmg:10,reach:40,y:[-40,-6] ,stun:18,kb:2.5,over:1,snd:'kick'},
 special:{su:12,ac:2,re:22,spec:1},
 rise  :{su:3,ac:7,re:26,dmg:14,reach:26,y:[-88,-8],stun:20,kb:2,knock:1,snd:'kick',hop:1},
 spin  :{su:6,ac:12,re:18,dmg:6,reach:40,y:[-54,-18],stun:16,kb:1.5,multi:1,snd:'kick',move:1},
 throw :{su:4,ac:0,re:22,throw:1},
 recov :{su:0,ac:0,re:12},
};
const _dk=new Map();
function dk(h,k){
  k=k||.78;const key=h+k;if(_dk.has(key))return _dk.get(key);
  if(h[0]!=='#'){return h;}
  if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  const n=parseInt(h.slice(1),16);
  const r=`rgb(${(n>>16&255)*k|0},${(n>>8&255)*k|0},${(n&255)*k|0})`;_dk.set(key,r);return r;
}
const cc=f=>f.alt?Object.assign({},CH[f.ch],CH[f.ch].alt):CH[f.ch];

/* ---------------- 게임 상태 ---------------- */
let frameN=0,mode=0,menu=0,stage=0,round=1,hitstop=0,shake=0,tmr=99,tmrF=0;
let banner=null,bannerT=0,winner=null,roundWinner=undefined,matchWinner=null;
let fighters=[],projs=[],sparks=[];
const sel=[{c:0,ok:false},{c:1,ok:false}];let selT=0;

function mk(ch,side,ai){
  const c=CH[ch];
  return {ch,side,alt:false,x:0,y:GY,vx:0,vy:0,face:side?-1:1,state:'idle',t:0,anim:0,hp:100*c.hp,maxhp:100*c.hp,lag:100*c.hp,
    mv:null,hit:false,buf:{a:0,b:0,c:0},hist:[],ai:ai?{t:0,mode:'wait',did:false,hitair:false,low:false}:null,airAtk:false,cr:false,
    wins:0,combo:0,comboT:0,stun:0,fireCd:0,inv:0,inp:{}};
}
function startMatch(c1,c2){
  fighters=[mk(c1,0,false),mk(c2,1,mode===0)];
  fighters[1].alt=(c1===c2);
  round=1;stage=Math.floor(rnd()*3);
  startRound();
}
function startRound(){
  const [A,B]=fighters;
  [[A,W/2-70,1],[B,W/2+70,-1]].forEach(([f,x,fc])=>{
    Object.assign(f,{x,y:GY,vx:0,vy:0,face:fc,state:'idle',t:0,hp:f.maxhp,lag:f.maxhp,mv:null,combo:0,comboT:0,airAtk:false,fireCd:0,inv:0,stun:0,cr:false,hit:false});
    f.buf={a:0,b:0,c:0};f.hist=[];
    if(f.ai)f.ai={t:0,mode:'wait',did:false,hitair:false,low:false};
  });
  projs.length=0;sparks.length=0;tmr=99;tmrF=0;hitstop=0;shake=0;
  phase='intro';selT=0;banner='ROUND '+round;bannerT=9999;roundWinner=undefined;
  sfx('beep');
}

/* ---------------- 전투 로직 ---------------- */
function air(f){
  f.vy+=GRAV;f.y+=f.vy;f.x+=f.vx;
  if(f.y>=GY&&f.vy>0){f.y=GY;f.vy=0;return true;}
  return false;
}
function update(f,o,inp,pr){
  const c=CH[f.ch];
  f.t++;f.anim++;
  {
    const fw=f.face>0?inp.r:inp.l,bk=f.face>0?inp.l:inp.r;
    f.hist.push(5+((fw?1:0)-(bk?1:0))+3*(inp.u?1:inp.d?-1:0));
    if(f.hist.length>26)f.hist.shift();
  }
  for(const k of ['a','b','c']){if(pr[k])f.buf[k]=7;else if(f.buf[k]>0)f.buf[k]--;}
  if(f.fireCd>0)f.fireCd--;
  if(f.inv>0)f.inv--;
  if(f.comboT>0)f.comboT--;
  if(f.lag>f.hp)f.lag=Math.max(f.hp,f.lag-.45);
  const st=f.state,g=f.y>=GY;
  const free=g&&(st==='idle'||st==='walk'||st==='crouch');
  if(free){
    f.face=o.x>=f.x?1:-1;
    f.vx=0;
    const bt=f.buf.a?'a':f.buf.b?'b':f.buf.c?'c':null;
    let started=false;
    if(bt){
      f.buf.a=f.buf.b=f.buf.c=0;
      const hs=f.hist.join('').replace(/5/g,'').replace(/(.)\1+/g,'$1');
      const dist=Math.abs(o.x-f.x),fwdH=f.face>0?inp.r:inp.l;
      let m;
      if(bt!=='c'&&/623|323/.test(hs)){m='rise';f.hist=[];}
      else if(bt!=='c'&&/236/.test(hs)){m=f.fireCd>0?null:'special';f.hist=[];}
      else if(bt==='b'&&/214/.test(hs)){m='spin';f.hist=[];}
      else if(bt==='a'&&fwdH&&dist<34&&!inp.d&&o.y>=GY&&!['down','lie','ko'].includes(o.state)&&o.inv<=0)m='throw';
      else if(bt==='a')m=inp.d?'cpunch':'punch';
      else if(bt==='b')m=inp.d?'ckick':'kick';
      else m=f.fireCd>0?null:'special';
      if(m){
        f.state='atk';f.mv=m;f.t=0;f.hit=false;f.cr=!!inp.d&&(m==='cpunch'||m==='ckick');started=true;
        if(m==='rise')f.inv=MV.rise.su+4;
        if(m!=='special')sfx('swing');
      }
    }
    if(!started){
      const wd=(inp.r?1:0)-(inp.l?1:0);
      if(inp.u){
        f.state='jump';f.vy=-8.4;f.vx=wd*2.2*Math.min(1.15,c.spd);f.airAtk=false;f.t=0;f.y-=1;sfx('jump');
      }else if(inp.d){f.state='crouch';}
      else if(wd!==0){f.state='walk';f.vx=wd*(wd===f.face?1.4:1.1)*c.spd;}
      else f.state='idle';
    }
    f.x+=f.vx;
  }else{
    switch(st){
      case 'atk':{
        const m=MV[f.mv];
        if(m.spec&&f.t===m.su){
          const big=m.spec===2;projs.push({x:f.x+f.face*24,y:f.y-44,vx:f.face*c.proj.sp*(big?1.3:1),own:f,dmg:c.proj.dmg*c.pow*(big?2:1),col:c.proj.col,r:c.proj.r*(big?1.8:1),t:0,trail:[],big:big});
          f.fireCd=45;sfx('fire');
        }
        if(m.hop&&f.t===m.su){f.vy=m.hvy||-7.2;f.vx=f.face*(m.hvx||1.3);}
        if(m.move&&f.t>=m.su&&f.t<m.su+m.ac)f.x+=f.face*(m.mvs||2.4);
        if(m.throw&&f.t===m.su)doThrow(f,o);
        if(m.hop&&(f.y<GY||f.vy<0)){
          if(air(f)){f.vx=0;f.mv='recov';f.t=0;f.hit=true;sfx('land');}
        }else if(f.t>=m.su+m.ac+m.re){f.state=(f.cr&&inp.d)?'crouch':'idle';f.t=0;}
        break;}
      case 'jump':case 'jatk':
        if(st==='jump'&&!f.airAtk&&(f.buf.a||f.buf.b)){
          f.mv=f.buf.a?'jp':'jk';f.buf.a=f.buf.b=0;f.state='jatk';f.t=0;f.hit=false;f.airAtk=true;sfx('swing');
        }
        if(air(f)){f.vx=0;f.state='idle';f.t=0;sfx('land');}
        break;
      case 'hit':case 'block':
        f.x+=f.vx;f.vx*=.82;
        if(f.t>=f.stun){f.state=(f.cr&&inp.d)?'crouch':'idle';f.t=0;}
        break;
      case 'down':case 'ko':
        if(f.y<GY||f.vy<0){
          if(air(f)){
            f.vx*=.3;f.t=0;shake=Math.max(shake,8);sfx('land');
            if(st==='down')f.state='lie';
          }
        }else{f.x+=f.vx;f.vx*=.8;}
        break;
      case 'lie':
        f.x+=f.vx;f.vx*=.8;
        if(f.t>=55){f.state='idle';f.t=0;f.inv=20;}
        break;
    }
  }
  f.x=clamp(f.x,16,W-16);
}
function doThrow(a,d){
  if(Math.abs(d.x-a.x)>40||d.y<GY||['down','lie','ko'].includes(d.state)||d.inv>0)return;
  a.hit=true;a.combo=1;a.comboT=70;
  d.hp-=12*CH[a.ch].pow;d.t=0;d.cr=false;
  d.x=a.x+a.face*22;
  sfx('kick');hitstop=8;shake=10;spark(d.x,d.y-40,'#ffe46b',12);
  if(d.hp<=0){d.hp=0;d.state='ko';d.vy=-6.5;d.vx=a.face*3.2;sfx('ko');hitstop=10;shake=14;}
  else{d.state='down';d.vy=-6;d.vx=a.face*2.4;}
}
const inRect=(a,b)=>a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1;
function hurt(d){
  if(['down','lie','ko'].includes(d.state)||d.inv>0)return null;
  let h=74;
  if(d.y<GY-2)h=62;
  else if(d.state==='crouch'||((d.state==='atk'||d.state==='hit'||d.state==='block')&&d.cr))h=46;
  return {x1:d.x-12,x2:d.x+12,y1:d.y-h,y2:d.y};
}
function spark(x,y,col,n){
  for(let i=0;i<n;i++){const a=rnd()*6.28,s=1+rnd()*2.5;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,life:12+rnd()*8,col});}
}
function applyHit(a,d,m,dir,px,py){
  const back=d.face>0?d.inp.l:d.inp.r;
  const grounded=d.y>=GY;
  const canAct=['idle','walk','crouch','block'].includes(d.state);
  const crIn=!!d.inp.d;
  const blocked=back&&grounded&&canAct&&!(m.low&&!crIn)&&!(m.over&&crIn);
  if(blocked){
    d.state='block';d.t=0;d.stun=Math.round((m.stun||14)*.6);d.cr=crIn;d.vx=dir*(m.kb||2)*.9;
    d.hp=Math.max(1,d.hp-(m.proj?1.5:.8));
    if(!m.proj&&a.y>=GY)a.vx=-dir*1.2;
    sfx('block');spark(px,py,'#9df',6);hitstop=3;
    a.hit=true;return;
  }
  const wasCr=d.state==='crouch'||((d.state==='atk')&&d.cr);
  const scale=1-.1*Math.min(a.combo,5);
  const dmg=(m.dmg*(m.proj?1:CH[a.ch].pow))*scale;
  if(d.state==='hit')a.combo++;else a.combo=1;
  a.comboT=70;
  d.hp-=dmg;a.hit=true;d.t=0;d.cr=wasCr;d.hit=false;
  let knock=m.knock||!grounded||(m.multi&&a.t>=m.su+(m.mk||6));
  if(d.hp<=0){
    d.hp=0;d.state='ko';d.vy=-6.5;d.vx=dir*3.2;sfx('ko');hitstop=10;shake=14;spark(px,py,'#fff',14);
    return;
  }
  if(knock){d.state='down';d.vy=-5;d.vx=dir*2.6;}
  else{d.state='hit';d.stun=m.stun||16;d.vx=dir*(m.kb||2);}
  sfx(m.snd||'punch');
  hitstop=m.dmg>=9||m.proj?6:4;shake=m.dmg>=9||m.proj?6:3;
  spark(px,py,'#ffe46b',8);spark(px,py,'#fff',4);
  if(!m.proj&&a.y>=GY)a.vx=-dir*.8;
}
function resolve(a,d){
  if(a.state!=='atk'&&a.state!=='jatk')return;
  const m=MV[a.mv];
  if(m.spec||m.throw||m.recov)return;
  if(m.multi&&a.hit&&a.t>m.su&&a.t<m.su+m.ac&&(a.t-m.su)%6===0)a.hit=false;
  if(a.hit)return;
  if(!m.air&&!(a.t>=m.su&&a.t<m.su+m.ac))return;
  const x1=a.x+a.face*6,x2=a.x+a.face*m.reach;
  const box={x1:Math.min(x1,x2),x2:Math.max(x1,x2),y1:a.y+m.y[0],y2:a.y+m.y[1]};
  const hb=hurt(d);
  if(hb&&inRect(box,hb)){
    applyHit(a,d,m,a.face,(box.x1+box.x2)/2+a.face*4,(box.y1+box.y2)/2);
  }
}
function stepProjs(){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.x+=p.vx;p.t++;p.trail.push(p.x);if(p.trail.length>6)p.trail.shift();
    let dead=p.x<-30||p.x>W+30;
    if(!dead){
      const d=fighters.find(f=>f!==p.own);
      const hb=hurt(d);
      if(hb&&inRect({x1:p.x-p.r,x2:p.x+p.r,y1:p.y-p.r,y2:p.y+p.r},hb)){
        applyHit(p.own,d,{dmg:p.dmg,stun:p.big?26:22,kb:p.big?4.2:3.2,snd:p.big?'kick':'punch',proj:1,knock:p.big?1:0},Math.sign(p.vx),p.x,p.y);
        spark(p.x,p.y,p.col,8);dead=true;
      }
    }
    if(!dead){
      for(let j=i-1;j>=0;j--){
        const q=projs[j];
        if(q.own!==p.own&&Math.abs(q.x-p.x)<p.r+q.r&&Math.abs(q.y-p.y)<p.r+q.r){
          spark(p.x,p.y,'#fff',10);sfx('block');
          if(!(q.big&&!p.big)){projs.splice(j,1);i--;}
          if(!(p.big&&!q.big))dead=true;
          break;
        }
      }
    }
    if(dead)projs.splice(i,1);
  }
}
function sep(A,B){
  const bad=f=>['down','lie','ko'].includes(f.state);
  if(bad(A)||bad(B))return;
  const dx=B.x-A.x;
  if(Math.abs(dx)<22&&Math.abs(A.y-B.y)<50){
    const dir=dx>=0?1:-1,push=(22-Math.abs(dx))/2;
    A.x-=dir*push;B.x+=dir*push;
    if(A.x<16){B.x+=16-A.x;A.x=16;}
    if(B.x<16){A.x+=16-B.x;B.x=16;}
    if(A.x>W-16){B.x-=A.x-(W-16);A.x=W-16;}
    if(B.x>W-16){A.x-=B.x-(W-16);B.x=W-16;}
  }
}

/* ---------------- CPU ---------------- */
function aiInput(f,o){
  const a=f.ai,d=Math.abs(o.x-f.x),tw=o.x>f.x?'r':'l',aw=tw==='r'?'l':'r';
  const inp={},pr={};
  a.t--;
  if(a.t<=0){
    a.t=6+Math.floor(rnd()*14);a.did=false;a.hitair=false;a.low=rnd()<.4;
    const r=rnd(),oAtk=o.state==='atk'||o.state==='jatk';
    if(oAtk&&d<90&&rnd()<.6)a.mode='block';
    else if(d>170)a.mode=r<.5?'approach':r<.7?'fire':r<.85?'jumpin':'wait';
    else if(d>80)a.mode=r<.45?'approach':r<.6?'fire':r<.75?'jumpin':r<.85?'wait':'poke';
    else a.mode=r<.35?'attack':r<.5?'cattack':r<.65?'block':r<.8?'retreat':r<.9?'jumpin':'wait';
  }
  switch(a.mode){
    case 'approach':inp[tw]=true;break;
    case 'retreat':inp[aw]=true;break;
    case 'block':inp[aw]=true;if(a.low)inp.d=true;break;
    case 'fire':if(!a.did&&f.fireCd<=0&&d>100){pr.c=true;a.did=true;}break;
    case 'jumpin':
      inp[tw]=true;
      if(f.y>=GY&&!a.did){inp.u=true;a.did=true;}
      if(f.y<GY&&d<70&&!a.hitair){pr[rnd()<.5?'a':'b']=true;a.hitair=true;}
      break;
    case 'attack':if(d>52)inp[tw]=true;else if(!a.did){pr[rnd()<.5?'a':'b']=true;a.did=true;}break;
    case 'cattack':inp.d=true;if(d>50){inp[tw]=true;inp.d=false;}else if(!a.did){pr[rnd()<.5?'a':'b']=true;a.did=true;}break;
    case 'poke':inp[tw]=true;if(d<62&&!a.did){pr.b=true;a.did=true;}break;
  }
  return [inp,pr];
}

/* ---------------- 진행 ---------------- */
function endRound(kind){
  const [A,B]=fighters;
  phase='roundend';selT=0;
  if(kind==='ko'){
    const ka=A.state==='ko',kb=B.state==='ko';
    roundWinner=ka&&kb?null:ka?B:A;banner=ka&&kb?'DOUBLE K.O.':'K.O.';
  }else{
    const pa=A.hp/A.maxhp,pb=B.hp/B.maxhp;
    roundWinner=Math.abs(pa-pb)<.0001?null:pa>pb?A:B;banner=roundWinner?'TIME UP':'DRAW';
  }
  bannerT=9999;
}
function stepGame(){
  const [A,B]=fighters;
  if(hitstop>0){
    hitstop--;
    if(phase==='fight')for(const f of fighters)for(const k of ['a','b','c'])if(press[f.side][k])f.buf[k]=7;
    return;
  }
  if(shake>0)shake--;
  selT++;
  let inA={},inB={},pA={},pB={};
  if(phase==='fight'){
    inA=Object.assign({},held[0]);pA=press[0];
    if(B.ai){[inB,pB]=aiInput(B,A);}else{inB=Object.assign({},held[1]);pB=press[1];}
  }
  if(phase!=='fight'){
    // 전투 중이 아닐 때(라운드 시작 연출·종료 후)는 입력 버퍼를 모두 비움
    for(const f of fighters){f.buf={a:0,b:0,c:0};f.hist=[];}
    if(B.ai)B.ai.mode='wait';
  }
  A.inp=inA;B.inp=inB;
  update(A,B,inA,pA);update(B,A,inB,pB);
  sep(A,B);
  stepProjs();
  resolve(A,B);resolve(B,A);
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.1;if(--s.life<=0)sparks.splice(i,1);}
  if(bannerT>0&&bannerT<9999)bannerT--;
  if(phase==='intro'){
    if(selT===70){banner='FIGHT!';bannerT=50;sfx('go');phase='fight';selT=0;}
  }else if(phase==='fight'){
    if(++tmrF>=60){tmrF=0;if(tmr>0)tmr--;}
    if(A.state==='ko'||B.state==='ko')endRound('ko');
    else if(tmr<=0)endRound('time');
  }else if(phase==='roundend'){
    if(selT===70&&roundWinner&&roundWinner.state!=='ko'&&roundWinner.y>=GY&&['idle','walk','crouch'].includes(roundWinner.state)){
      roundWinner.state='win';roundWinner.t=0;sfx('win');
    }
    if(selT>=190){
      if(roundWinner)roundWinner.wins++;
      const w=fighters.find(f=>f.wins>=2);
      if(w||round>=5){
        matchWinner=w||(A.wins>=B.wins?A:B);
        phase='matchend';selT=0;banner=null;setMatchLines();
      }else{round++;startRound();}
    }
  }
}
function stepTitle(){
  for(const p of [0,1]){
    if((press[p].u||press[p].d)&&!IS_TOUCH){menu=1-menu;sfx('sel');}
    if(press[p].a||press[p].b||press[p].c){
      mode=menu;phase='select';sel[0]={c:0,ok:false};sel[1]={c:1,ok:false};selT=0;sfx('ok');return;
    }
  }
}
let vsT=0,ldT=0;
const VS_LEN=130,LD_LEN=170;
function stepVS(){
  if(++vsT>=VS_LEN){phase='loading';ldT=0;sfx('beep');}
}
function stepLoading(){
  ldT++;
  if(ldT%34===0)sfx('beep');
  if(ldT>=LD_LEN)startMatch(sel[0].c,sel[1].c);
}
/* 승패 장면 대사는 위쪽 CH 목록의 win / lose 항목에서 가져온다 */
let mlines={w:'',l:'',t1:20,t2:90,tEnd:180};
function setMatchLines(){
  const w=matchWinner,l=fighters.find(f=>f!==w);
  if(mode===0&&w.side===0){recordWin(l.ch);extendLadder();}
  const qw=CH[w.ch],ql=CH[l.ch];
  mlines.w=(qw&&qw.win)||'내가 이겼다!';
  mlines.l=(ql&&ql.lose)||'크윽... 내가 졌다...';
  mlines.t1=24;
  mlines.t2=mlines.t1+mlines.w.length*2+55;
  mlines.tEnd=mlines.t2+mlines.l.length*2+65;
}
/* CPU 대전: 일반 캐릭터를 차례로 이기면 마지막에 보스들이 나온다 */
let ladder=[],ladIdx=0;
function buildLadder(me){
  const n=selN(),o=[];
  for(let i=0;i<n;i++)if(i!==me&&!CH[i].boss)o.push(i);
  for(let i=0;i<n;i++)if(i!==me&&CH[i].boss&&!isLocked(i))o.push(i);
  return o;
}
function extendLadder(){
  for(let i=0;i<CH.length;i++)if(CH[i].boss&&i!==sel[0].c&&!isLocked(i)&&!ladder.includes(i))ladder.push(i);
}
function stepSelect(){
  const n=mode===0?1:2;
  for(let p=0;p<n;p++){
    const s=sel[p];
    if(!s.ok){
      const N=selN();
      if(press[p].l){s.c=(s.c+N-1)%N;sfx('sel');}
      if(press[p].r){s.c=(s.c+1)%N;sfx('sel');}
      if(press[p].u){const t=selVert(s.c,-1);if(t!==s.c){s.c=t;sfx('sel');}}
      if(press[p].d){const t=selVert(s.c,1);if(t!==s.c){s.c=t;sfx('sel');}}
      if(press[p].a||press[p].b||press[p].c){
        if(isLocked(s.c)){
          if(IS_TOUCH){
            lockTaps[s.c]=(lockTaps[s.c]||0)+1;
            if(lockTaps[s.c]>=3){tmpOpen[s.c]=true;sfx('ok');toastMsg=CH[s.c].name+' UNLOCKED!';toastT=100;}
            else sfx('beep');
          }else sfx('beep');
        }else{s.ok=true;sfx('ok');}
      }
    }else if(press[p].u){s.ok=false;sfx('sel');}
  }
  if(mode===0&&sel[0].ok&&!sel[1].ok){
    ladder=buildLadder(sel[0].c);ladIdx=0;
    sel[1].c=ladder.length?ladder[0]:sel[0].c;sel[1].ok=true;
  }
  if(sel[0].ok&&sel[1].ok){
    if(++selT>50){phase='vs';vsT=0;sfx('go');return;}
  }else selT=0;
}
function step(){
  if(paused){press=[{},{}];anyKey=false;return;}
  frameN++;
  if(phase==='splash'){if(anyKey)startOpening();}
  else if(phase==='opening')stepOpening();
  else if(phase==='title')stepTitle();
  else if(phase==='select')stepSelect();
  else if(phase==='vs')stepVS();
  else if(phase==='loading')stepLoading();
  else if(phase==='ending')stepEnding();
  else if(phase==='matchend'){
    selT++;
    const anyAtk=press[0].a||press[0].b||press[0].c||press[1].a||press[1].b||press[1].c;
    if(anyAtk&&selT>30&&selT<=mlines.tEnd)selT=mlines.tEnd+1;
    else if(selT>mlines.tEnd&&anyAtk){
      if(mode===0&&matchWinner&&matchWinner.side===0&&ladIdx+1<ladder.length){
        ladIdx++;sel[1].c=ladder[ladIdx];phase='vs';vsT=0;selT=0;sfx('go');
      }else if(mode===0&&matchWinner&&matchWinner.side===0){phase='ending';endS=0;endDone=false;sfx('go');}
      else{phase='select';sel[0]={c:0,ok:false};sel[1]={c:1,ok:false};selT=0;}
    }
  }else stepGame();
  press=[{},{}];anyKey=false;
  if(phase!=='opening'&&fade>0)fade=Math.max(0,fade-.04);
}

/* ---------------- 그리기: 파이터 ---------------- */
function ik(r,t,l1,l2,kind){
  let dx=t[0]-r[0],dy=t[1]-r[1],D=Math.hypot(dx,dy)||.001;
  const mx=l1+l2-.05;
  if(D>mx){dx*=mx/D;dy*=mx/D;D=mx;}
  const ux=dx/D,uy=dy/D,a=(l1*l1-l2*l2+D*D)/(2*D),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const m1=[r[0]+ux*a+uy*h,r[1]+uy*a-ux*h],m2=[r[0]+ux*a-uy*h,r[1]+uy*a+ux*h];
  let m;
  if(kind==='down')m=m1[1]>m2[1]?m1:m2;else m=m1[0]>m2[0]?m1:m2;
  return {m,e:[r[0]+dx,r[1]+dy]};
}
function two(r,t,l1,l2,kind,w,col){
  const k=ik(r,t,l1,l2,kind);
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(r[0],r[1]);ctx.lineTo(k.m[0],k.m[1]);ctx.lineTo(k.e[0],k.e[1]);ctx.stroke();
  return k.e;
}
function limb(a,b,w,col){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
}
function getPose(f){
  const s=f.state,bob=Math.sin(f.anim*.12);
  const P={hip:[0,-32],sh:[1,-57],hd:[3,-67],fh:[16,-54],bh:[9,-49],ff:[10,0],bf:[-10,0]};
  const idle=()=>{const b=bob*1.2;P.hip=[0,-32+b*.4];P.sh=[1,-57+b];P.hd=[3,-67+b];P.fh=[16,-54+b];P.bh=[9,-49+b];};
  const crouch=()=>{P.hip=[-2,-17];P.sh=[2,-40];P.hd=[5,-50];P.fh=[15,-38];P.bh=[9,-33];P.ff=[15,0];P.bf=[-11,0];};
  const jumpP=()=>{P.hip=[0,-36];P.sh=[2,-60];P.hd=[4,-70];P.fh=[16,-56];P.bh=[8,-52];P.ff=[14,-20];P.bf=[-2,-14];};
  const ext=m=>{
    if(m.air)return Math.min(1,f.t/3);
    if(f.t<m.su)return f.t/m.su*.35;
    if(f.t<m.su+m.ac)return 1;
    return Math.max(0,1-(f.t-m.su-m.ac)/m.re);
  };
  switch(s){
    case 'walk':{
      idle();const ph=f.anim*.28;
      P.ff=[10+Math.sin(ph)*10,-Math.max(0,Math.cos(ph))*5];
      P.bf=[-10-Math.sin(ph)*10,-Math.max(0,-Math.cos(ph))*5];break;}
    case 'crouch':crouch();break;
    case 'jump':jumpP();break;
    case 'atk':case 'jatk':{
      const m=MV[f.mv],e=ext(m);
      if(f.mv==='punch'){idle();P.fh=[lerp(16,34,e),-54];P.bh=[lerp(9,2,e),-50];P.sh[0]+=3*e;P.hd[0]+=3*e;P.ff[0]+=3*e;}
      else if(f.mv==='kick'){idle();P.ff=[lerp(10,38,e),lerp(0,-38,e)];P.sh[0]-=5*e;P.hd[0]-=6*e;P.hip[0]-=2*e;P.fh=[10,-56];P.bh=[4,-60];P.bf=[-12,0];}
      else if(f.mv==='cpunch'){crouch();P.fh=[lerp(15,34,e),-37];P.sh[0]+=3*e;P.hd[0]+=3*e;}
      else if(f.mv==='ckick'){crouch();P.ff=[lerp(15,38,e),lerp(0,-5,e)];P.sh[0]-=3*e;P.hd[0]-=3*e;}
      else if(f.mv==='special'){
        idle();
        if(f.t<m.su){const w=f.t/m.su;P.fh=[lerp(14,-8,w),-48];P.bh=[lerp(9,-10,w),-46];P.sh[0]-=3*w;P.hd[0]-=2*w;P.hip[1]+=2*w;}
        else{P.fh=[34,-50];P.bh=[28,-48];P.sh[0]+=4;P.hd[0]+=4;P.hip[1]+=3;P.ff=[16,0];P.bf=[-14,0];}
      }

const SEL_MAX=12,SEL_CW=42,SEL_GAP=2;

function selRects(){
  /* 일반 캐릭터는 첫 줄, 보스(boss:1)는 항상 새 줄(2번째 줄)에서 시작 */
  const n=selN(),rects=[];let row=0,col=0,prev=null;
  for(let i=0;i<n;i++){
    const b=!!CH[i].boss;
    if(prev!==null&&(b!==prev||col>=4)){row++;col=0;}
    prev=b;rects[i]={row,col};col++;
  }
  const rows=row+1,cnt={},ch=rows>2?27:40,y0=rows>2?176:180;
  rects.forEach(r=>{cnt[r.row]=(cnt[r.row]||0)+1;});
  rects.forEach(r=>{
    const c=cnt[r.row];
    r.x=(W-(c*SEL_CW+(c-1)*SEL_GAP))/2+r.col*(SEL_CW+SEL_GAP);
    r.y=y0+r.row*(ch+SEL_GAP);r.w=SEL_CW;r.h=ch;
  });
  return rects;
}
function selRect(i){return selRects()[i];}
function selVert(i,dir){
  const R=selRects(),c=R[i],cx=c.x+c.w/2;let best=-1,bd=1e9;
  R.forEach((r,j)=>{if(r.row===c.row+dir){const d=Math.abs(r.x+r.w/2-cx);if(d<bd){bd=d;best=j;}}});
  return best<0?i:best;
}

let fade=0,ot=0,opFlash=0,opA=null,opB=null,opBall=null;
const OP_FIGHT0=60,OP_BEAT=36,OP_PAN0=400,OP_PAN1=720,OP_END=900;
// [공격자(0=A,1=B), 기술, 결과]
const OSCR=[[0,'punch','block'],[1,'kick','hit'],[0,'kick','hit'],[1,'punch','block'],[0,'jk','hit'],[1,'special','block'],[0,'rise','down']];
const OPW=(()=>{
  const c=document.createElement('canvas');c.width=W;c.height=H*2;

  g.fillStyle='rgba(255,240,200,.12)';g.beginPath();g.arc(380,72,30,0,6.28);g.fill();
  g.fillStyle='#f4eec8';g.beginPath();g.arc(380,72,22,0,6.28);g.fill();
  g.fillStyle='#d8d2a8';[[372,66,5],[388,78,4],[380,60,3],[370,82,3]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,6.28);g.fill();});

function startOpening(){

const N_=n=>440*Math.pow(2,(n-69)/12);
const OP_BASS=[45,45,52,45,48,48,55,48,43,43,50,43,47,47,54,47];
const OP_LEAD=[69,0,72,0,76,0,74,72,71,0,74,0,79,0,76,74,72,0,76,0,81,0,79,76,74,0,77,0,81,0,79,77];
function opMusic(t){
  return; // 오프닝 합성 음악은 사용하지 않음 (base64 음악만 재생)
  if(!AC||muted||t%10)return;
  const i=t/10;
  const b=N_(OP_BASS[i%16]);
  tone(b,b,.13,'triangle',.17);
  if(i%4===0){tone(130,38,.16,'sine',.45);noise(.05,.15,300);}
  if(i%8===4){noise(.13,.32,5200);tone(200,120,.08,'triangle',.1);}
  if(i&1)noise(.03,.06,8000);
  if(t<OP_PAN0&&i%8===0){[69,72,76].forEach(n=>tone(N_(n),N_(n),.28,'sawtooth',.045));}
  if(t>=OP_PAN0&&t<OP_PAN1&&i%2===0){
    const n=OP_LEAD[(i/2|0)%32];
    if(n){tone(N_(n),N_(n),.26,'square',.07);tone(N_(n-12),N_(n-12),.26,'triangle',.06);}
  }
  if(t===OP_PAN1){[57,60,64,69].forEach((n,k)=>tone(N_(n),N_(n),2.4,'triangle',.12,k*.04));tone(N_(81),N_(81),2.2,'square',.05);}
}
function stepOpening(){
  const t=ot++;
  if(t>10&&anyKey){endOpening();return;}
  opMusic(t);
  opA.anim=opB.anim=t;
  for(const f of [opA,opB]){f.state='idle';f.mv=null;f.y=GY;f.t=0;f.cr=false;}
  opA.x=190;opB.x=290;opA.face=1;opB.face=-1;
  opBall=null;
  const k=Math.floor((t-OP_FIGHT0)/OP_BEAT),p=(t-OP_FIGHT0)%OP_BEAT;
  if(t>=OP_FIGHT0&&k>=0&&k<OSCR.length){
    const [ai,mv,res]=OSCR[k],att=ai?opB:opA,def=ai?opA:opB,dir=ai?-1:1,m=MV[mv];
    const rf=p<26?1:1-(p-26)/10;
    if(p===0&&mv!=='special')sfx('swing');
    let lunge=0,hf;
    if(mv==='jk'){
      att.state='jatk';att.mv=mv;att.t=Math.min(p,12);att.y=GY-48*Math.sin(Math.PI*Math.min(p,30)/30);
      lunge=dir*(p<30?p*1.4:42);hf=14;
    }else if(mv==='special'){
      att.state='atk';att.mv=mv;att.t=p;hf=24;
      if(p===12)sfx('fire');
      if(p>=12&&p<24)opBall={x:att.x+dir*(24+(p-12)*5.5),y:GY-44,col:CH[att.ch].proj.col,r:CH[att.ch].proj.r};
    }else{
      att.state='atk';att.mv=mv;att.t=p;hf=m.su+1;
      lunge=dir*Math.min(p,10)*(mv==='kick'||mv==='rise'?1.4:.9);
      if(mv==='rise'){att.y=GY-(p>=m.su?60*Math.sin(Math.PI*Math.min(1,(p-m.su)/22)):0);att.vy=-1;}
    }
    att.x+=lunge*rf;
    if(p>=hf){
      const q=p-hf;
      if(res==='hit'){def.state='hit';def.t=q;def.x+=dir*Math.min(q,8)*1.3*rf;}
      else if(res==='block'){def.state='block';def.t=q;def.x+=dir*Math.min(q,6)*.8*rf;}
      else{
        def.state=q<20?'down':'lie';def.t=q;
        def.y=q<20?GY-36*Math.sin(Math.PI*q/20):GY;
        def.vy=-1;
        def.x+=dir*Math.min(q,20)*1.7;
      }
    }
    if(p===hf){
      sfx(res==='block'?'block':(m.snd||'punch'));
      spark(def.x-dir*8,GY-46,res==='block'?'#9df':'#ffe46b',res==='block'?6:9);
      shake=res==='block'?2:5;
    }
  }else if(t>=OP_FIGHT0+OP_BEAT*OSCR.length&&t<OP_PAN0){
    // 마지막: 두 주먹이 정면충돌
    const q=t-(OP_FIGHT0+OP_BEAT*OSCR.length);
    if(q<28){
      for(const [f,d] of [[opA,1],[opB,-1]]){f.state='atk';f.mv='punch';f.t=Math.min(q,4);f.x+=d*Math.min(q,10)*1.5;}
      if(q===4){sfx('kick');sfx('punch');spark(240,GY-52,'#fff',24);spark(240,GY-52,'#ffe46b',16);opFlash=1;shake=14;}
    }
  }
  if(opFlash>0)opFlash=Math.max(0,opFlash-.06);
  if(shake>0)shake--;
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.1;if(--s.life<=0)sparks.splice(i,1);}
  if(t>=OP_END)endOpening();
}

  ctx.restore();
  ctx.restore();
  if(opFlash>0){ctx.fillStyle='rgba(255,255,255,'+opFlash+')';ctx.fillRect(0,0,W,H);}
  // 시네마 바
  const bar=t<OP_PAN1?20:Math.max(0,20-(t-OP_PAN1)*.5);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,bar);ctx.fillRect(0,H-bar,W,bar);
  // 타이틀 로고
  if(t>=OP_PAN1){
    const a=Math.min(1,(t-OP_PAN1)/50);
    ctx.globalAlpha=a;
    T('FIGHTER OF STREET',W/2,96,34,'#ffd84a');
    ctx.globalAlpha=1;

  // 페이드
  let fa=0;
  if(t<40)fa=1-t/40;

  if(fa>0){ctx.fillStyle='rgba(0,0,0,'+clamp(fa,0,1)+')';ctx.fillRect(0,0,W,H);}
  if(t>10&&((frameN>>5)&1))T('SKIP: 아무 키',W-36,H-8,8,'#aaa','center',null);

  .b.on{background:rgba(255,216,74,.55)}
  .b[data-k=a]{left:0;bottom:0}.b[data-k=b]{left:16.5vmin;bottom:10vmin}.b[data-k=c]{left:33vmin;bottom:0}
  .s{position:absolute;top:calc(2vmin + env(safe-area-inset-top,0px));width:9vmin;height:9vmin;border-radius:20%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:#fff;font:bold 4.5vmin sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto}
  #pz{right:calc(2vmin + env(safe-area-inset-right,0px))}#hm{right:calc(13vmin + env(safe-area-inset-right,0px))}`;
  document.head.appendChild(st);
  const ui=document.createElement('div');ui.id='tc';
  ui.innerHTML='<div id="joy"><div id="knob"></div></div><div id="btns"><div class="b" data-k="a">A</div><div class="b" data-k="b">S</div><div class="b" data-k="c">D</div></div><div class="s" id="hm">⌂</div><div class="s" id="pz">⏸</div>';
  document.body.appendChild(ui);
  const joy=ui.querySelector('#joy'),knob=ui.querySelector('#knob');
  let jid=null;
  const setDir=(k,v)=>{if(v&&!held[0][k])press[0][k]=true;held[0][k]=v;};
  function joyMove(e){
    const r=joy.getBoundingClientRect(),rad=r.width/2,dx=e.clientX-(r.left+rad),dy=e.clientY-(r.top+rad),dz=rad*.3;
    let l=dx<-dz,rr=dx>dz,u=dy<-dz,d=dy>dz;
    if(Math.abs(dy)<Math.abs(dx)*.45){u=d=false;}
    if(Math.abs(dx)<Math.abs(dy)*.45){l=rr=false;}
    setDir('l',l);setDir('r',rr);setDir('u',u);setDir('d',d);
    const m=Math.hypot(dx,dy),k=m>rad*.55?rad*.55/m:1;
    knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;
  }
  function joyEnd(){jid=null;['l','r','u','d'].forEach(k=>setDir(k,false));knob.style.transform='';}
  joy.addEventListener('pointerdown',e=>{e.preventDefault();ainit();jid=e.pointerId;try{joy.setPointerCapture(jid);}catch(_){}joyMove(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid){e.preventDefault();joyMove(e);}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>joy.addEventListener(n,e=>{if(e.pointerId===jid)joyEnd();}));
  ui.querySelectorAll('.b').forEach(b=>{
    const k=b.dataset.k;let pid=null;
    const off=e=>{if(e.pointerId===pid){pid=null;held[0][k]=false;b.classList.remove('on');}};
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();ainit();pid=e.pointerId;try{b.setPointerCapture(pid);}catch(_){}
      held[0][k]=true;press[0][k]=true;b.classList.add('on');
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,off));
  });
  const fire=code=>dispatchEvent(new KeyboardEvent('keydown',{code}));
  ui.querySelector('#pz').addEventListener('pointerdown',e=>{e.preventDefault();ainit();fire('KeyP');});
  ui.querySelector('#hm').addEventListener('pointerdown',e=>{e.preventDefault();ainit();fire('Escape');});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('gesturestart',e=>e.preventDefault());
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){step();acc-=1000/60;}
  syncBGM();draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
