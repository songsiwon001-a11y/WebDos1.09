# 저장소의 .github/workflows/zip-manifest.yml 을 이 파일로 교체하세요.
# zip/jsdos/html 을 push 하면 각 폴더에 files.json(파일 이름 목록)을 자동으로 만들어 커밋합니다.
# → files.json 이 있으면 WEB-DOS 가 GitHub API(호출 한도 있음) 없이 바로 폴더를 불러옵니다.
name: zip manifest
on:
  push:
    paths:
      - '**/*.zip'
      - '**/*.jsdos'
      - '**/*.html'
      - '!index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write files.json in every folder that has zips/html
        run: |
          python3 - <<'PY'
          import os, json
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              if root == '.':
                  continue  # 루트(index.html 등)는 제외
              z = sorted(f for f in files if f.lower().endswith(('.zip', '.jsdos', '.html', '.htm')))
              if z:
                  with open(os.path.join(root, 'files.json'), 'w', encoding='utf-8') as fp:
                      json.dump(z, fp, ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update files.json" && git push)
