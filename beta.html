<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SF2 웹 실행</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  #game { position: fixed; inset: 0; }
  #msg { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #ddd;
         font: 16px/1.5 system-ui, sans-serif; padding: 0 16px; pointer-events: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="msg">불러오는 중…</div>
<script>
  window.EJS_player = '#game';
  window.EJS_core = 'dosbox_pure';
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_gameUrl = 'SF2_ejs%20(1).zip';
  window.EJS_startOnLoaded = true;
  window.EJS_browserMode = 'mobile';
  window.EJS_Buttons = { gamepad: { visible: true } };
  window.EJS_threads = true;
</script>
<script src="coi-serviceworker.js"></script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
<script>
  setTimeout(function () { document.getElementById('msg').style.display = 'none'; }, 3000);
</script>
</body>
</html>
